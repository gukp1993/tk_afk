<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>预览 · 群英录</title>
<link rel="stylesheet" href="assets.css">
<link rel="stylesheet" href="pages.css">
<style>
  body { margin: 0; background: #0d0906; display: flex; justify-content: center; }
  .phone { width: 375px; min-height: 812px; background: var(--bg); position: relative; overflow: hidden; padding-bottom: 60px; }
  .fakebar { display: flex; background: linear-gradient(180deg, #241a10, #171009); border-top: 1px solid #5a452a; position: absolute; bottom: 0; left: 0; right: 0; }
  .fakebar .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 7px 0 5px; color: #a6906c; }
  .fakebar .tab-item.active { color: #e9c47a; }
  .fakebar .tab-icon { font-size: 20px; }
  .fakebar .tab-text { font-size: 11px; margin-top: 2px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="phone">
  <div class="page">
    <div class="res-bar">
      <div class="res-chip">🪙 <span id="r-gold"></span></div>
      <div class="res-chip">💵 <span id="r-gem"></span></div>
      <div class="res-chip">📜 <span id="r-scroll"></span></div>
      <div class="res-chip">📕 <span id="r-exp"></span></div>
    </div>

    <div class="crystal panel">
      <div class="crystal-head">
        <div class="h-title">共鸣水镜</div>
        <div class="t-dim">已聚 <span id="c-count"></span> 名武将</div>
      </div>
      <div class="crystal-body">
        <span class="t-gold">共鸣等级 Lv.<span id="c-cap"></span></span>
        <span class="t-dim"> — 等级前五的武将定下全军共鸣之境，其余武将自动共享此等级。</span>
      </div>
    </div>

    <div class="filters">
      <span class="chip fchip chip-on">全部</span>
      <span class="chip fchip">魏</span><span class="chip fchip">蜀</span><span class="chip fchip">吴</span><span class="chip fchip">群</span>
      <span style="flex:1"></span>
      <span class="chip fchip">战力↓</span><span class="chip fchip">等级↓</span><span class="chip fchip">品质↓</span>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="fakebar">
    <div class="tab-item"><div class="tab-icon">🏯</div><div class="tab-text">主城</div></div>
    <div class="tab-item active"><div class="tab-icon">⚔</div><div class="tab-text">群英</div></div>
    <div class="tab-item"><div class="tab-icon">📜</div><div class="tab-text">点将</div></div>
    <div class="tab-item"><div class="tab-icon">🏛</div><div class="tab-text">王庭</div></div>
  </div>
</div>

<script src="engine.js"></script>
<script>
const store = _req('store');
const F = _req('fmt');
const C = _req('config');
store.load();
// 模拟已招募一批，便于预览
['zhaoyun', 'zhugeliang', 'zhouyu', 'lvbu', 'huatuo', 'guojia', 'huangzhong', 'sunshangxiang', 'daqiao', 'zhangjiao'].forEach(id => store.addHeroCard(id));
store.levelUp('guanyu', 12);
store.levelUp('zhangfei', 9);
store.levelUp('liubei', 7);
const s = store.getState();
document.getElementById('r-gold').textContent = F.fmtNum(s.res.gold);
document.getElementById('r-gem').textContent = s.res.gem;
document.getElementById('r-scroll').textContent = s.res.scroll;
document.getElementById('r-exp').textContent = F.fmtNum(s.res.exp);
const crystal = store.crystalInfo();
document.getElementById('c-count').textContent = crystal.count;
document.getElementById('c-cap').textContent = crystal.cap;

const grid = document.getElementById('grid');
const list = store.allRoster().sort((a, b) => b.power - a.power);
list.forEach(h => {
  const def = C.RARITIES[h.rarity];
  const fac = C.FACTIONS[h.faction];
  const cls = C.CLASSES[h.cls];
  const maxStar = def.maxStar;
  let stars = '';
  for (let i = 1; i <= 5; i++) stars += '<span class="star ' + (i <= h.star ? 's2' : (i <= maxStar ? 's1' : '')) + '">★</span>';
  const cell = document.createElement('div');
  cell.className = 'gcell';
  cell.innerHTML =
    '<div class="hcard grid rarity-frame-' + h.rarity + '">' +
      '<div class="hcard-top">' +
        '<div class="hcard-face bg-' + h.faction + '"><span class="hcard-surname">' + h.name[0] + '</span></div>' +
        '<div class="hcard-tags"><span class="tag f-' + h.faction + '">' + fac.name + '</span><span class="tag">' + cls.icon + ' ' + cls.name + '</span></div>' +
        (crystal.top5.some(t => t.id === h.id) ? '<div class="hcard-mark">共鸣</div>' : '') +
      '</div>' +
      '<div class="hcard-body">' +
        '<div class="hcard-name">' + h.name + ' <span class="r' + h.rarity + '">' + def.name + '</span></div>' +
        '<div class="hcard-title t-dim">' + h.title + '</div>' +
        '<div class="hcard-stars">' + stars + '</div>' +
        '<div class="hcard-info"><span class="t-gold">Lv.' + h.level + '</span><span class="t-dim">战力 ' + h.power + '</span></div>' +
      '</div>' +
    '</div>';
  grid.appendChild(cell);
});
</script>
</body>
</html>
