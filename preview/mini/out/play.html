const factories={"src/ads/bridge.js":function(require,module,exports){
// 广告桥接层：自定义统一广告 API，微信 / 抖音的接入差异到此为止
// 统一契约：createRewarded(adUnitId) → { preload(), show() → Promise<{ended:boolean}> }
//   resolve({ended:true})   看完（平台未回传结果时按看完处理，与历史行为一致）
//   resolve({ended:false})  提前关闭，不发奖
//   reject(err)             广告拉取/展示失败
// 平台实现差异：
// - 微信：show 会自动拉取，失败后 load→show 重试一次；show 失败时 promise rejection 与 onError
//   同时出现，失败判定只走 promise 链（否则 onError 会打断重试）
// - 抖音：官方推荐 load 在前 show 在后，每次 show 前重新 load（关播后需重拉）
// - 兜底：部分老基础库的 show()/load() 不返回 Promise——同步调用不抛错即视为已发起，
//   结果交给 onClose/onError 事件；此时 onError 才参与失败判定
const platform = require('../../utils/platform');
const api = platform.api;

function isPromise(p) { return !!p && typeof p.then === 'function'; }

// 防御调用：同步抛错转为 rejected Promise；未返回 Promise 时返回 undefined
function safeCall(ad, method) {
  try { return ad[method](); } catch (e) { return Promise.reject(e); }
}

// 接线 onClose/onError，终态时自动解绑；promiseSeen.seen 为真时 onError 视为同源噪音
function wire(ad, promiseSeen, onEnded, onFail) {
  const onClose = (res) => {
    cleanup();
    onEnded(!(res && res.isEnded === false));
  };
  const onError = (err) => {
    if (promiseSeen.seen) return;
    cleanup();
    onFail(err || new Error('rewarded ad error'));
  };
  const cleanup = () => {
    ad.offClose && ad.offClose(onClose);
    ad.offError && ad.offError(onError);
  };
  ad.onClose && ad.onClose(onClose);
  ad.onError && ad.onError(onError);
  return cleanup;
}

// 微信实现：show 优先，失败自动 load→show 重试一次
function wechatRewarded(ad) {
  return {
    preload() {
      const p = safeCall(ad, 'load');
      if (isPromise(p)) p.catch(() => {});
    },
    show() {
      return new Promise((resolve, reject) => {
        const promiseSeen = { seen: false };
        const cleanup = wire(ad, promiseSeen, (ended) => resolve({ ended }), reject);
        const fail = (e) => { cleanup(); reject(e); };
        const attempt = () => {
          const p = safeCall(ad, 'show');
          if (isPromise(p)) { promiseSeen.seen = true; return p; }
          return Promise.resolve(); // 未返回 Promise：同步未抛错即视为已发起，结果交给事件
        };
        attempt().catch(() => {
          const lp = safeCall(ad, 'load');
          Promise.resolve(isPromise(lp) ? lp : undefined).then(() => {
            attempt().catch(fail); // 重拉后仍失败才判失败
          }).catch(fail);
        });
      });
    }
  };
}

// 抖音实现：load 在前 show 在后，每次 show 前重新 load
function douyinRewarded(ad) {
  return {
    preload() {
      const p = safeCall(ad, 'load');
      if (isPromise(p)) p.catch(() => {});
    },
    show() {
      return new Promise((resolve, reject) => {
        const promiseSeen = { seen: false };
        const cleanup = wire(ad, promiseSeen, (ended) => resolve({ ended }), reject);
        const fail = (e) => { cleanup(); reject(e); };
        const lp = safeCall(ad, 'load');
        Promise.resolve(isPromise(lp) ? lp : undefined).then(() => {
          const p = safeCall(ad, 'show');
          if (isPromise(p)) { promiseSeen.seen = true; p.catch(fail); }
          // 未返回 Promise：结果交给事件
        }).catch(fail);
      });
    }
  };
}

const IMPLS = { wechat: wechatRewarded, douyin: douyinRewarded };
const instances = {}; // adUnitId → 实例（官方要求单例，重复创建会导致重复播放）

function available() {
  return !!(api && api.createRewardedVideoAd);
}

function createRewarded(adUnitId) {
  if (!available()) throw new Error('当前平台无激励视频广告 API');
  if (!instances[adUnitId]) {
    const impl = IMPLS[platform.name] || wechatRewarded; // 其余平台按同形 API 走微信实现兜底
    instances[adUnitId] = impl(api.createRewardedVideoAd({ adUnitId }));
  }
  return instances[adUnitId];
}

module.exports = { available, createRewarded };

},
"src/ads.js":function(require,module,exports){
// 激励视频广告管理器（业务门面：场景/频次/发奖判定/模拟广告 UI，平台接入差异在 ./ads/bridge 桥接层）
// - 配置了 AD.rewardedUnitIds[平台]：走平台激励视频（微信/抖音各自的接入姿势由桥接层处理），看完回调发奖
// - 未配置（当前状态）：内置"模拟广告"全屏播放页（3 秒倒计时→领取奖励），用于上线前测试完整流程
const C = require('../utils/config');
const store = require('../utils/store');
const platform = require('../utils/platform');
const bridge = require('./ads/bridge');
const { ui } = require('./ui');
const T = require('./theme');

const state = { mock: null };

function rewardedUnitId() {
  const ids = C.AD.rewardedUnitIds || {};
  return ids[platform.name] || '';
}

function isConfigured() {
  return !!(rewardedUnitId() && bridge.available());
}

// 返回 true 表示已开始流程（同步）；结果经 onReward/onFail 异步回调
function showRewarded(placement, onReward, onFail) {
  const conf = C.AD.placements[placement];
  if (!conf) { onFail && onFail('未知广告场景'); return false; }
  if (store.adCount(placement) >= conf.limit) { onFail && onFail('今日"看广告' + conf.name + '"次数已用完'); return false; }

  if (!isConfigured()) return showMock(placement, onReward, onFail);

  try {
    bridge.createRewarded(rewardedUnitId()).show().then(({ ended }) => {
      if (ended) {
        store.adBump(placement);
        onReward && onReward();
      } else {
        onFail && onFail('未看完广告，无奖励');
      }
    }).catch(() => {
      onFail && onFail('广告拉取失败，稍后再试');
    });
    return true;
  } catch (e) {
    onFail && onFail('广告暂不可用');
    return false;
  }
}

// 内置模拟广告（测试模式）
function showMock(placement, onReward) {
  const conf = C.AD.placements[placement];
  state.mock = {
    placement, name: conf.name, t: 0, dur: 3,
    onDone: () => {
      store.adBump(placement);
      onReward && onReward();
    }
  };
  return true;
}

function closeMock(reward) {
  const m = state.mock;
  if (!m) return;
  state.mock = null;
  if (reward && m.onDone) m.onDone();
}

// 由 app 主循环每帧调用（在场景与 tabbar 之后绘制，保证覆盖其点击）
function frame(dt) {
  const m = state.mock;
  if (!m) return;
  m.t += dt;
  const ctx = ui.ctx;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, ui.W, ui.H);
  ctx.restore();
  ui.hitAreas = []; ui.dragAreas = [];
  ui.tap(0, 0, ui.W, ui.H, () => {}, 'ad-mask'); // 阻挡点击与滚动穿透

  const w = 300, h = 200, x = (ui.W - w) / 2, y = (ui.H - h) / 2 - 20;
  ui.panel(x, y, w, h, { ornate: true });
  ui.text('模拟广告（测试模式）', x + w / 2, y + 12, { size: 15, color: T.GOLD_HI, bold: true, align: 'center' });
  ui.text('场景：' + m.name, x + w / 2, y + 36, { size: 11, color: T.DIM, align: 'center' });

  // 模拟广告画面
  const pw = w - 48, ph = 64;
  ui.ctx.save();
  ui.ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ui.ctx.fillRect(x + 24, y + 56, pw, ph);
  ui.ctx.restore();
  ui.ctx.strokeStyle = T.LINE;
  ui.ctx.strokeRect(x + 24.5, y + 56.5, pw, ph);
  ui.text('📺', x + w / 2, y + 66, { size: 26, align: 'center' });

  const p = Math.min(1, m.t / m.dur);
  ui.bar(x + 24, y + 130, w - 48, 7, p, 'blue');
  ui.text(p < 1 ? '广告播放中… ' + Math.ceil(m.dur - m.t) + 's' : '播放完成', x + w / 2, y + 141, { size: 11, color: T.DIM, align: 'center' });

  if (p >= 1) {
    ui.btn(x + 60, y + 160, w - 120, 30, {
      text: '领取奖励', style: 'gold', size: 14, id: 'ad-claim',
      cb: () => closeMock(true)
    });
  } else {
    ui.text('提前关闭将无奖励', x + w / 2, y + 166, { size: 10, color: T.DIM, align: 'center' });
  }
  ui.text('✕ 关闭', x + w - 34, y + 5, { size: 11, color: T.DIM });
  ui.tap(x + w - 44, y + 3, 40, 18, () => closeMock(false), 'ad-close');
}

function remaining(placement) {
  const conf = C.AD.placements[placement];
  return conf ? Math.max(0, conf.limit - store.adCount(placement)) : 0;
}

module.exports = { showRewarded, isConfigured, remaining, frame, state };

},
"src/app.js":function(require,module,exports){
// 游戏核心：画布、主循环、触摸、场景导航、底部导航
const { ui } = require('./ui');
const T = require('./theme');
const store = require('../utils/store');
const ads = require('./ads');
const platform = require('../utils/platform');
const api = platform.api; // wx（微信）/ tt（抖音）平台 API，经适配层获取

const app = {
  canvas: null, ctx: null,
  scale: 1, W: 375, H: 812,
  scenes: {},            // name -> scene 对象
  stack: [],             // 导航栈（push/pop）
  tab: 'campaign',
  hidden: false,
  TABS: [
    { key: 'home', icon: '城', text: '主城' },
    { key: 'journey', icon: '图', text: '玩法' },
    { key: 'campaign', icon: '战', text: '战役' },
    { key: 'heroes', icon: '将', text: '英雄' },
    { key: 'bag', icon: '囊', text: '背包' }
  ],
  last: 0,

  init() {
    const canvas = api.createCanvas();
    this.canvas = canvas;
    const info = api.getWindowInfo ? api.getWindowInfo() : api.getSystemInfoSync();
    const dpr = Math.min(2, info.pixelRatio || 2);
    const sw = info.screenWidth, sh = info.screenHeight;
    canvas.width = sw * dpr;
    canvas.height = sh * dpr;
    this.scale = sw / 375;
    this.W = 375;
    this.H = Math.round(sh / this.scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr * this.scale, dpr * this.scale);
    this.ctx = ctx;

    store.load();
    store.checkDailyReset();

    // 触摸（逻辑坐标）
    const toLogic = (t) => {
      const x = Number.isFinite(t.clientX) ? t.clientX : Number.isFinite(t.x) ? t.x : t.pageX;
      const y = Number.isFinite(t.clientY) ? t.clientY : Number.isFinite(t.y) ? t.y : t.pageY;
      return { x: x / this.scale, y: y / this.scale };
    };
    const firstTouch = e => e && ((e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]));
    api.onTouchStart((e) => {
      const t = firstTouch(e); if (!t) return;
      const p = toLogic(t); if (Number.isFinite(p.x) && Number.isFinite(p.y)) ui.onTouchStart(p.x, p.y);
    });
    api.onTouchMove((e) => {
      const t = firstTouch(e); if (!t) return;
      const p = toLogic(t); if (Number.isFinite(p.x) && Number.isFinite(p.y)) ui.onTouchMove(p.x, p.y);
    });
    api.onTouchEnd((e) => {
      if (e.changedTouches && e.changedTouches[0]) {
        const p = toLogic(e.changedTouches[0]);
        ui.onTouchEnd(p.x, p.y);
      } else ui.onTouchEnd(ui.touch ? ui.touch.x : 0, ui.touch ? ui.touch.y : 0);
    });
    api.onTouchCancel && api.onTouchCancel(() => { ui.touch = null; ui.pressedId = null; });
    api.onHide && api.onHide(() => {
      this.hidden = true;
      const active = this.top();
      if (active && active.onHide) active.onHide();
      store.save();
    });
    api.onShow && api.onShow(() => {
      this.hidden = false;
      this.last = Date.now();
      const active = this.top();
      if (active && active.onShow) active.onShow();
    });
    // 节流自动存档：开发者工具「编译」重启不触发 onHide，仅靠事件保存会表现为丢档；
    // 心跳把丢失窗口压到间隔内，真机上与 onHide 双保险
    const heartbeat = setInterval(() => store.save(), 10000);
    heartbeat && heartbeat.unref && heartbeat.unref(); // Node 离屏渲染环境不阻塞进程退出

    this.last = Date.now();
    requestAnimationFrame(() => this.frame());
  },

  register(name, scene) { this.scenes[name] = scene; },

  switchTab(name, params) {
    if (!this.scenes[name]) return;
    const active = this.top();
    if (active && active.onExit) active.onExit('tab');
    ui.hitAreas = []; ui.dragAreas = [];
    this.tab = name;
    this.stack = [];
    const s = this.scenes[name];
    if (s && s.onEnter) s.onEnter(params || {});
  },
  push(name, params) {
    const s = this.scenes[name];
    if (!s) return;
    const active = this.top();
    if (active && active.onExit) active.onExit('push');
    ui.hitAreas = []; ui.dragAreas = [];
    s.params = params || {};
    if (s.onEnter) s.onEnter(params);
    this.stack.push(s);
  },
  pop() {
    ui.hitAreas = []; ui.dragAreas = [];
    const s = this.stack.pop();
    if (s && s.onExit) s.onExit('pop');
    const top = this.top();
    if (top && top.onEnter) top.onEnter();
  },
  top() {
    return this.stack.length ? this.stack[this.stack.length - 1] : this.scenes[this.tab];
  },

  frame() {
    const now = Date.now();
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (dt > 0.1) dt = 0.1;

    const s = this.top();
    if (s) {
      if (!this.hidden && s.update) s.update(dt);
      ui.begin(this.ctx, this.W, this.H, dt);
      // 背景
      const ctx = this.ctx;
      ctx.fillStyle = T.BG;
      ctx.fillRect(0, 0, this.W, this.H);
      const g = ctx.createRadialGradient(this.W / 2, -60, 40, this.W / 2, -60, 420);
      g.addColorStop(0, 'rgba(217,169,78,0.08)');
      g.addColorStop(1, 'rgba(217,169,78,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.W, this.H);
      if (s.draw) s.draw(dt);
      this.drawFloatersIfBattle(s, dt);
      if (!this.stack.length && !ui.modalActive) this.drawTabBar();
      ui.drawFloaters(dt);
      ui.drawToast();
      ads.frame(dt); // 模拟广告覆盖层（置顶）
      ui.end && ui.end();
    }
    requestAnimationFrame(() => this.frame());
  },
  drawFloatersIfBattle(s, dt) {
    // 战斗场景自己管理飘字坐标；其他场景飘字由 ui.drawFloaters 统一绘制
  },

  drawTabBar() {
    const ctx = this.ctx;
    const h = 52, y = this.H - h;
    ctx.save();
    const g = ctx.createLinearGradient(0, y, 0, this.H);
    g.addColorStop(0, '#241a10'); g.addColorStop(1, '#171009');
    ctx.fillStyle = g;
    ctx.fillRect(0, y, this.W, h);
    ctx.strokeStyle = T.LINE;
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(this.W, y + 0.5); ctx.stroke();
    const each = this.W / this.TABS.length;
    this.TABS.forEach((t, i) => {
      const cx = each * i + each / 2;
      const active = this.tab === t.key;
      ui.tap(each * i, y, each, h, () => this.switchTab(t.key), 'tab-' + t.key);
      if (active) ui.panel(each * i + 2, y + 2, each - 4, h - 4, { fill: t.key === 'campaign' ? '#675235' : '#3d3020', r: 3, ornate: true });
      ctx.textAlign = 'center';
      ctx.font = T.font(20);
      ctx.globalAlpha = active ? 1 : 0.6;
      ctx.fillStyle = active ? '#e9c47a' : '#a6906c';
      ctx.fillText(t.icon, cx, y + 20);
      ctx.font = T.font(12, active);
      ctx.fillText(t.text, cx, y + 39);
      ctx.globalAlpha = 1;
      if (active) {
        const gx = ctx.createLinearGradient(cx - 22, 0, cx + 22, 0);
        gx.addColorStop(0, 'rgba(240,207,138,0)');
        gx.addColorStop(0.5, '#f0cf8a');
        gx.addColorStop(1, 'rgba(240,207,138,0)');
        ctx.fillStyle = gx;
        ctx.fillRect(cx - 22, y, 44, 2);
      }
    });
    ctx.restore();
  },

  // 通用页面头（返回 + 标题）
  pageHeader(title) {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(23,16,9,0.9)';
    ctx.fillRect(0, 0, this.W, 42);
    ctx.strokeStyle = T.LINE;
    ctx.beginPath(); ctx.moveTo(0, 42.5); ctx.lineTo(this.W, 42.5); ctx.stroke();
    ui.text(title, this.W / 2, 16, { size: 16, color: T.GOLD_HI, bold: true, align: 'center' });
    ctx.font = T.font(16);
    ctx.fillStyle = T.GOLD;
    ctx.textBaseline = 'middle';
    ctx.fillText('‹ 返回', 12, 22);
    ui.tap(0, 0, 64, 42, () => this.pop(), 'back');
    ctx.restore();
  },

  // 资源条（通用）
  resBar(y, keys) {
    const s = store.getState();
    const F = require('../utils/fmt');
    const list = keys || ['gold', 'gem', 'scroll', 'exp'];
    const names = { gold: '铜钱', gem: '元宝', scroll: '招募令', token: '演武令', shard: '碎片', iron: '精铁' };
    const w = (this.W - 16 - (list.length - 1) * 5) / list.length;
    list.forEach((k, i) => {
      const x = 8 + i * (w + 5);
      const label = names[k] + ' ' + F.fmtNum(s.res[k]);
      uiPanelPill(this, x, y, w, 20);
      const size = ui.textWidth(label, 10) <= w - 8 ? 10 : 8;
      ui.text(label, x + w / 2, y + 10, { size, color: T.GOLD_HI, align: 'center', baseline: 'middle' });
    });
  }
};
function uiPanelPill(app, x, y, w, h) {
  const ctx = app.ctx;
  ctx.save();
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();
  ctx.strokeStyle = T.LINE;
  ctx.stroke();
  ctx.restore();
}

module.exports = { app, ui };

},
"src/campaign-art.js":function(require,module,exports){
// 战役首页的原创三国占位美术。仅绘制场景，命中、进度与奖励由 screen 管理。
const ROUTE = [[.40, .90], [.22, .72], [.58, .54], [.36, .34], [.65, .14]];

function poly(c, points, color) {
  c.fillStyle = color; c.beginPath(); c.moveTo(...points[0]);
  points.slice(1).forEach(p => c.lineTo(...p)); c.closePath(); c.fill();
}
function stroke(c, points, color, width) {
  c.strokeStyle = color; c.lineWidth = width;
  c.beginPath(); c.moveTo(...points[0]); points.slice(1).forEach(p => c.lineTo(...p)); c.stroke();
}
function circle(c, x, y, r, color) {
  c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
}
function oval(c, x, y, rx, ry, color) {
  const points = [];
  for (let i = 0; i < 28; i++) {
    const a = Math.PI * 2 * i / 28;
    points.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]);
  }
  poly(c, points, color);
}
// Catmull-Rom 插值落成 lineTo，兼容小游戏 Canvas 与离屏 SVG 记录器。
function curve(points) {
  const result = [];
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(0, i - 1)], p1 = points[i];
    const p2 = points[i + 1], p3 = points[Math.min(points.length - 1, i + 2)];
    for (let j = 0; j < 18; j++) {
      const t = j / 18, t2 = t * t, t3 = t2 * t;
      result.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t
        + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2
        + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));

"src/screens/arena.js":function(require,module,exports){
// 演武场：每日 5 次，三名对手
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const stages = require('../../utils/stages');
const heroes = require('../../utils/heroes');
const items = require('../../utils/items');
const F = require('../../utils/fmt');

module.exports = {
  name: 'arena',
  scroll: {}, scrollReg: {},

  onEnter() {
    store.checkDailyReset();
    const s = store.getState();
    const myPower = store.teamPower();
    const day = new Date();
    const daySeed = day.getFullYear() * 10000 + (day.getMonth() + 1) * 100 + day.getDate();
    const defs = [
      { diff: 0.8, name: '守碉老卒·1号' },
      { diff: 1.05, name: '游历侠客·2号' },
      { diff: 1.35, name: '无名猛将·3号' }
    ];
    this.opponents = defs.map((d, i) => {
      const seed = daySeed * 97 + i * 13;
      const def = stages.makeArenaEnemies(myPower, seed, d.diff);
      const power = Math.floor(def.units.reduce((sum, u) => sum + heroes.heroPower(u.hero, u.level, u.star), 0) * (d.diff > 1 ? d.diff * 0.98 : d.diff));
      return { seed, diff: d.diff, name: d.name, powerText: F.fmtNum(power), level: def.units[0].level, hard: d.diff > 1.2 };
    });
    this.view = {
      points: s.arena.points,
      rank: items.arenaRank(s.arena.points),
      wins: s.arena.wins, losses: s.arena.losses,
      attempts: s.arena.attempts,
      myPower: F.fmtNum(myPower)
    };
  },

  draw() {
    app.pageHeader('演 武 场');
    let y = 52;
    ui.panel(8, y, 359, 62, { ornate: true });
    ui.text(this.view.rank + ' · ' + this.view.points + ' 分', 20, y + 10, { size: 16, color: T.GOLD_HI, bold: true });
    ui.text('战绩 ' + this.view.wins + ' 胜 ' + this.view.losses + ' 负 · 今日剩 ' + this.view.attempts + ' 次', 20, y + 36, { size: 10, color: T.DIM });
    ui.text('我军战力', 280, y + 12, { size: 10, color: T.DIM, align: 'right' });
    ui.text(this.view.myPower, 350, y + 26, { size: 15, color: T.GOLD, align: 'right' });
    ui.text('调整编队 ›', 350, y + 46, { size: 10, color: T.DIM, align: 'right' });
    ui.tap(260, y, 100, 62, () => app.push('formation'), 'arena-form');
    y += 72;

    ui.text('今 日 对 手', 12, y, { size: 13, color: T.GOLD, bold: true });
    y += 22;

    this.opponents.forEach((o, i) => {
      const oy = y + i * 72;
      ui.panel(8, oy, 359, 64, o.hard ? { ornate: true } : {});
      ui.text(o.name, 20, oy + 10, { size: 14, color: T.GOLD });
      ui.tag(o.hard ? '凶险' : '寻常', 330, oy + 10, o.hard ? T.RED_HI : T.DIM);
      ui.text('守军约 Lv.' + o.level + ' · 战力 ' + o.powerText, 20, oy + 34, { size: 10, color: T.DIM });
      ui.btn(258, oy + 26, 98, 28, {
        text: '切 磋', style: 'red', size: 13, disabled: this.view.attempts <= 0, id: 'arena-' + i,
        cb: () => {
          if (store.getState().arena.attempts <= 0) { ui.toast('今日次数已用完'); return; }
          app.push('battle', {
            mode: 'arena',
            arenaOpt: { seed: o.seed, diff: o.diff, name: o.name, diffLabel: o.hard ? '凶险' : '寻常' }
          });
        }
      });
    });
    y += 72 * 3 + 10;
    ui.wrap('胜得积分与演武令×2，败亦得演武令×1；演武令可在集市兑换招募令与自选卡。', 24, y, 330, 13, { size: 10 });
  }
};

"src/screens/armory.js":function(require,module,exports){
// 全军共用军械图鉴：图鉴解锁、部位星级和当前配装都属于账号。
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const items = require('../../utils/items');
const F = require('../../utils/fmt');
const progression = require('../../utils/progression');

const SLOT_FALLBACK = [
  { key: 'weapon', name: '兵刃' }, { key: 'armor', name: '铠甲' },
  { key: 'helm', name: '头盔' }, { key: 'boots', name: '战靴' },
  { key: 'jade', name: '玉佩' }, { key: 'seal', name: '兵符' }
];
const ATTR_NAMES = { atk: '攻击', hp: '生命', def: '防御', spd: '攻速' };

function slotList() {
  const source = items.ARMORY_SLOTS;
  if (!Array.isArray(source) || !source.length) return SLOT_FALLBACK;
  return source.map((s, i) => typeof s === 'string'
    ? { key: s, name: SLOT_FALLBACK.find(x => x.key === s)?.name || s }
    : { ...s, key: s.key || s.id || s.slot || SLOT_FALLBACK[i]?.key, name: s.name || SLOT_FALLBACK[i]?.name || s.key });
}
function catalogList() {
  const source = items.ARMORY_CATALOG || items.CATALOG;
  if (Array.isArray(source)) return source;
  if (source && typeof source === 'object') return Object.keys(source).map(k => source[k]);
  return [];
}
function getGrade(q) {
  const grades = items.ARMORY_GRADES || items.GRADES || {};
  return Array.isArray(grades) ? grades.find(g => g.q === q || g.id === q) : grades[q] || grades['q' + q] || {};
}
function qualityName(q) {
  const g = getGrade(q);
  return g.name || g.label || ({ 1: '凡铁', 2: '精钢', 3: '百炼', 4: '名器' }[q] || ('品质' + q));
}
function qualityColor(q) {
  const g = getGrade(q);
  return g.color || ({ 1: '#c8ccd4', 2: T.BLUE, 3: T.PURPLE, 4: T.GOLD_HI }[q] || T.DIM);
}
function starAt(map, slot) { return Math.max(0, Number(map && map[slot]) || 0); }
function asPercent(n) {
  const v = Number(n) || 0;
  return (Math.abs(v) <= 1 ? v * 100 : v).toFixed(0) + '%';
}
function pctText(pct) {
  if (typeof pct === 'string') return pct;
  if (!pct || typeof pct !== 'object') return '—';
  return Object.keys(pct).filter(k => ATTR_NAMES[k] && Number(pct[k])).map(k => ATTR_NAMES[k] + '+' + asPercent(pct[k])).join('  ') || '—';
}
function effectText(effect) {
  if (!effect) return '';
  if (typeof effect === 'object') return effect.text || effect.desc || '';
  return ({ heal: '主动治疗与持续治疗效果提升', shield: '战斗开始时为全体英雄提供护盾', energy: '战斗开始时增加全体英雄怒气', reduction: '降低全体英雄受到的直接伤害' })[effect] || '';
}
function bonusText(bonuses) {
  if (!bonuses) return '—';
  const parts = Object.keys(bonuses).map(k => {
    const v = Number(bonuses[k]);
    if (!v) return '';
    if (ATTR_NAMES[k]) return ATTR_NAMES[k] + '+' + asPercent(v);
    if (k === 'heal') return '治疗+' + asPercent(v);
    if (k === 'startShield') return '开场护盾 ' + asPercent(v);
    if (k === 'startEnergy') return '开场怒气+' + v;
    if (k === 'directDR') return '直接伤害减免 ' + asPercent(v);
    return '';
  }).filter(Boolean);
  return parts.join('  ') || '暂无属性加成';
}
function scaledPctObject(pct, star) {
  const out = {};
  if (!pct || typeof pct !== 'object') return out;
  const mult = 1 + (Number(items.STAR_PCT) || 0) * star;
  Object.keys(pct).forEach(k => { if (ATTR_NAMES[k]) out[k] = Number(pct[k]) * mult; });
  return out;
}
function upgradeDelta(pct) {
  const out = {};
  if (!pct || typeof pct !== 'object') return out;
  const rate = Number(items.STAR_PCT) || 0;
  Object.keys(pct).forEach(k => { if (ATTR_NAMES[k]) out[k] = Number(pct[k]) * rate; });
  return out;
}

module.exports = {
  name: 'armory',
  scroll: {}, scrollReg: {},
  mode: 'overview', selectedSlot: 'weapon', detailId: null, boxQ: null,
  confirm: null,

  onEnter(params) {
    this.mode = 'overview'; this.detailId = null; this.boxQ = null; this.confirmRecommendations = false;
    this.refresh();
    if (params && params.boxQ) {
      this.mode = 'catalog'; this.boxQ = Number(params.boxQ);
      const item = this.catalog.find(x => x.q === this.boxQ && !this.armory.unlocked[x.id]);
      if (item) { this.selectedSlot = item.slot; this.detailId = item.id; }
    }
    if (params && params.recommendations) this.recommendations = params.recommendations;

  refresh() {

    this.armory = (typeof store.getArmoryState === 'function' && store.getArmoryState()) || s.armory || { unlocked: {}, selected: {}, slotStars: {}, boxes: {}, seen: {}, claimedMilestones: {} };
    this.slots = slotList();
    this.catalog = catalogList();
    this.recommendations = progression.getArmoryRecommendations(s);
    if (!this.slots.some(x => x.key === this.selectedSlot)) this.selectedSlot = this.slots[0]?.key || 'weapon';
    if (!this.detailId || !this.catalog.some(x => x.id === this.detailId)) this.detailId = this.catalog.find(x => x.slot === this.selectedSlot)?.id || null;

  update() { if (!this.s) this.refresh(); },

  draw() {

    ui.chipBtn(9, 70, 174, 28, '部位养成', this.mode === 'overview', () => { this.mode = 'overview'; this.detailId = null; this.boxQ = null; }, 'armory-overview');
    ui.chipBtn(192, 70, 174, 28, '装备图鉴  ' + this.unlockedCount() + '/' + this.catalog.length, this.mode === 'catalog', () => { this.mode = 'catalog'; this.detailId = this.currentItem(this.selectedSlot)?.id || this.catalog.find(x => x.slot === this.selectedSlot)?.id || null; }, 'armory-catalog');

    if (this.confirmRecommendations) this.drawRecommendationConfirm();
  },
  drawResources() {

      const x = 10 + i * 180;

      ui.text('待选择的军械箱', 13, y, { size: 11, color: T.GOLD_HI, bold: true }); y += 22;
      boxEntries.forEach((box, i) => {
        ui.btn(10 + (i % 3) * 120, y + Math.floor(i / 3) * 30, 112, 25, { text: qualityName(box.q) + '箱 ×' + box.count, style: this.boxQ === box.q ? 'gold' : 'ghost', size: 9, id: 'armory-box-' + box.q, cb: () => { this.boxQ = this.boxQ === box.q ? null : box.q; this.detailId = null; } });
      });
      y += Math.ceil(boxEntries.length / 3) * 32;
      if (this.boxQ) {
        ui.text('选择一件' + qualityName(this.boxQ) + '军械领取', 13, y, { size: 10, color: T.DIM }); y += 18;
        this.catalog.filter(x => x.q === this.boxQ).forEach((item, i) => {
          const xx = 10 + (i % 3) * 120, yy = y + Math.floor(i / 3) * 29;
          ui.btn(xx, yy, 112, 24, { text: item.name, style: this.detailId === item.id ? 'gold' : 'plain', size: 8, id: 'armory-box-item-' + item.id, cb: () => { this.detailId = item.id; } });
        });
        const count = this.catalog.filter(x => x.q === this.boxQ).length;
        y += Math.ceil(count / 3) * 30;
        ui.btn(10, y, app.W - 20, 24, { text: '本品质已收集齐？将军械箱转为精铁', style: 'ghost', size: 9, id: 'armory-box-convert', cb: () => { this.detailId = 'convert'; } });
        y += 29;
      }
    }
    y += 4;
    this.drawDetail(this.catalog.find(x => x.id === this.detailId), y);
    ui.endScroll();
  },
  availableBoxes() {
    const boxes = this.armory.boxes || {};
    return [1, 2, 3].map(q => ({ q, count: Number(boxes[q] || boxes['q' + q]) || 0 })).filter(x => x.count > 0);
  },
  drawDetail(item, y) {
    if (this.detailId === 'convert' && this.boxQ) {
      const x = 9, w = app.W - 18;
      ui.panel(x, y, w, 85, { ornate: true });
      ui.text(qualityName(this.boxQ) + '军械箱转化', x + 11, y + 10, { size: 13, color: T.GOLD_HI, bold: true });
      ui.wrap('当该品质图鉴已全部解锁时，可将这一箱转为精铁。', x + 11, y + 34, w - 22, 13, { size: 9, color: T.DIM });
      ui.btn(x + 10, y + 56, w - 20, 23, { text: '转为精铁', style: 'gold', size: 10, id: 'armory-box-convert-confirm', cb: () => this.runAction('claimBox', this.boxQ, 'convert') });
      return;
    }
    if (!item) return;
    const x = 9, w = app.W - 18, star = starAt(this.armory.slotStars, item.slot), unlocked = !!this.armory.unlocked[item.id];
    const body = effectText(item.effect);
    const source = typeof item.source === 'string' ? item.source : item.source && (item.source.text || item.source.desc) || this.sourceText(item);
    const h = 180;
    ui.panel(x, y, w, h, { ornate: true });
    ui.text(item.name, x + 11, y + 10, { size: 15, color: qualityColor(item.q), bold: true });
    ui.text(this.slotName(item.slot) + ' · ' + qualityName(item.q) + ' · 部位★' + star, x + 11, y + 34, { size: 10, color: T.DIM });
    ui.text('基础加成：' + pctText(item.basePct || item.stats) + ' · 部位星级 ★' + star, x + 11, y + 53, { size: 10, color: T.GOLD_HI });
    if (body) ui.wrap('效果：' + body, x + 11, y + 73, w - 22, 13, { size: 9, color: T.TEXT });
    if (source) ui.wrap('获得：' + source, x + 11, y + 100, w - 22, 12, { size: 8, color: T.DIM });
    const active = this.currentItem(item.slot);
    const currentLine = active ? '当前：' + active.name + '（' + pctText(scaledPctObject(active.basePct || active.stats, star)) + '）' : '当前：未配置';
    ui.text(currentLine, x + 11, y + 123, { size: 8, color: T.DIM });
    const btnY = y + 145, btnW = (w - 30) / 2;
    if (this.boxQ) {
      const boxItems = this.catalog.filter(x => x.q === this.boxQ);
      const already = !!this.armory.unlocked[item.id];
      ui.btn(x + 10, btnY, w - 20, 25, { text: already ? '此装备已解锁，请选择其他装备' : '使用军械箱领取', style: 'gold', size: 10, disabled: already || item.q !== this.boxQ, id: 'armory-claim-box', cb: () => this.runAction('claimBox', this.boxQ, item.id) });
      if (!boxItems.length) ui.text('该品质没有可选军械', x + 12, btnY + 26, { size: 8, color: T.DIM });
    } else if (unlocked) {
      const activeNow = active && active.id === item.id;
      ui.btn(x + 10, btnY, w - 20, 25, { text: activeNow ? '全军正在使用' : '全军启用', style: activeNow ? 'ghost' : 'gold', size: 10, disabled: activeNow, id: 'armory-select', cb: () => this.runAction('select', item.id) });
    } else {
      const unlockStage = this.unlockStage(item.q, item);
      const available = this.stageNo() >= Number(unlockStage || 0);
      const cost = this.unlockCost(item.q);
      const msg = available ? '精铁 ×' + cost + ' 解锁' : '通关第' + unlockStage + '关后开放';
      ui.btn(x + 10, btnY, w - 20, 25, { text: msg, style: 'gold', size: 10, disabled: !available || cost == null, id: 'armory-unlock', cb: () => { this.confirm = { type: 'unlock', itemId: item.id }; } });
    }
  },
  unlockStage(q, item) {
    const g = getGrade(q);
    return item.unlockStage !== undefined ? item.unlockStage : g.unlockStage || 0;
  },
  sourceText(item) {
    const stage = this.unlockStage(item.q, item);
    return Number(item.q) === 0 ? '新手赠送与战役奖励' : '战役奖励；通关第' + stage + '关后可用精铁定向解锁';
  },
  stageNo() {
    const s = this.s || {};
    if (s.campaign && Number(s.campaign.cleared)) return Number(s.campaign.cleared);
    if (s.progress && Number(s.progress.stage)) return Number(s.progress.stage);
    if (s.campaign && Number(s.campaign.stage)) return Number(s.campaign.stage);
    return Number(s.stage) || 1;
  },
  unlockCost(q) {
    const grades = items.ARMORY_GRADES || items.GRADES || {};
    const g = Array.isArray(grades) ? grades.find(x => x.q === q || x.id === q) : grades[q] || grades['q' + q];
    return g && (g.unlockCost !== undefined ? g.unlockCost : g.cost);
  },
  dropOddsText() {
    const eligible = (items.GRADES || []).filter(g => g.q === 0 || this.stageNo() >= g.unlockStage);
    const total = eligible.reduce((sum, g) => sum + (items.DROP_QUALITY_WEIGHTS[g.q] || 0), 0);
    const odds = eligible.map(g => g.short + Math.round(100 * items.DROP_QUALITY_WEIGHTS[g.q] / total) + '%').join(' / ');
    return '战役首通掉落率65%；当前品质概率：' + odds + '（未开放品质不计）';
  },
  drawConfirm() {
    const c = this.confirm;
    const box = ui.modal(c.type === 'upgrade' ? '部位升星确认' : '解锁军械确认', 34, Math.max(110, (app.H - 210) / 2), app.W - 68, 210);
    ui.setModalClose(() => { this.confirm = null; });
    if (c.type === 'upgrade') {
      const slot = c.slot, star = starAt(this.armory.slotStars, slot), need = this.starNeed(star), gold = this.starGold(star);
      const item = this.currentItem(slot), iron = this.s.res.iron || 0, coins = this.s.res.gold || 0;
      ui.wrap('升级' + this.slotName(slot) + '位，全体英雄共同受益。当前★' + star + ' → ★' + (star + 1) + '。', box.x, box.y + 2, box.w, 14, { size: 10, color: T.TEXT });
      if (item) {
        ui.text('当前装备：' + item.name, box.x, box.y + 35, { size: 9, color: qualityColor(item.q) });
        ui.text('本次属性提升：' + pctText(upgradeDelta(item.basePct || item.stats)), box.x, box.y + 51, { size: 8, color: T.GOLD_HI });
      }
      ui.text('部位材料：精铁 ×' + (need == null ? '—' : need) + ' · 铜钱 ×' + gold, box.x, box.y + 68, { size: 9, color: T.DIM });
      ui.text('持有：精铁 ' + F.fmtNum(iron) + ' · 铜钱 ' + F.fmtNum(coins), box.x, box.y + 84, { size: 9, color: T.DIM });
      ui.btn(box.x, box.y + 105, 122, 30, { text: '取消', style: 'ghost', size: 11, id: 'armory-confirm-cancel', cb: () => { this.confirm = null; } });
      ui.btn(box.x + 134, box.y + 105, 122, 30, { text: '确认升星', style: 'gold', size: 11, id: 'armory-confirm-upgrade', disabled: need == null || iron < need || coins < gold, cb: () => this.runAction('upgrade', slot) });
    } else {
      const item = this.catalog.find(x => x.id === c.itemId), cost = item && this.unlockCost(item.q);
      ui.wrap(item ? item.name + ' · ' + qualityName(item.q) + ' · 消耗精铁 ×' + cost + '。解锁后可由全军启用。' : '', box.x, box.y + 6, box.w, 15, { size: 10, color: T.TEXT });
      ui.text('当前精铁：' + F.fmtNum(this.s.res.iron || 0), box.x, box.y + 48, { size: 9, color: T.DIM });
      ui.btn(box.x, box.y + 105, 122, 30, { text: '取消', style: 'ghost', size: 11, id: 'armory-unlock-cancel', cb: () => { this.confirm = null; } });
      ui.btn(box.x + 134, box.y + 105, 122, 30, { text: '确认解锁', style: 'gold', size: 11, id: 'armory-unlock-confirm', disabled: !item || this.s.res.iron < cost, cb: () => this.runAction('unlock', item.id) });
    }
  },
  runAction(type, ...args) {
    const calls = { select: store.armorySelect, unlock: store.armoryUnlock, upgrade: store.armoryUpgrade, claimBox: store.armoryClaimBox };
    const fn = calls[type];
    if (typeof fn !== 'function') { ui.toast('军械功能正在接入'); this.confirm = null; return; }
    const result = type === 'select' ? fn(args[0] && this.catalog.find(x => x.id === args[0])?.slot, args[0]) : fn(...args);
    if (!result || !result.ok) { ui.toast(result && result.msg || '操作未完成'); return; }
    this.confirm = null;
    this.refresh();
    if (type === 'select' || type === 'claimBox') {
      const itemId = type === 'select' ? args[0] : args[1];
      if (this.armory.seen) this.armory.seen[itemId] = true;
    }
    if (result.before && result.bonuses) ui.toast('全军生效 · ' + bonusText(result.before) + ' → ' + bonusText(result.bonuses));
    else ui.toast(result.msg || ({ unlock: '图鉴已解锁', select: '已为全军启用', upgrade: '部位升星成功', claimBox: '军械箱已领取' }[type]));
  }
};

},

"src/screens/battle.js":function(require,module,exports){
// 战斗场景：引擎步进 + 单元渲染 + 飘字 + 大招横幅 + 结算
const { app, ui } = require('../app');
const ads = require('../ads');
const T = require('../theme');
const store = require('../../utils/store');
const battleMod = require('../../utils/battle');
const stages = require('../../utils/stages');
const heroes = require('../../utils/heroes');
const items = require('../../utils/items');
const C = require('../../utils/config');
const F = require('../../utils/fmt');
const autoBattle = require('../../utils/auto-battle');

// 战场坐标（逻辑 px，设计宽 375）：铺满竖屏
const POS = {
  B3: [128, 130], B4: [248, 130],
  B0: [75, 275], B1: [187, 275], B2: [300, 275],
  A0: [75, 520], A1: [187, 520], A2: [300, 520],
  A3: [128, 665], A4: [248, 665]
};
const CC_ICON = { stun: '✦', freeze: '❄', silence: '🔇' };

module.exports = {
  name: 'battle',
  scroll: {}, scrollReg: {},

  onEnter(params) {
    // 从上层页面返回战斗栈时只展示已停止状态，不能重开旧对局。
    if (!params && this.initialized) return;
    this.initialized = true;
    this.mode = params.mode || 'campaign';
    this.arenaOpt = params.arenaOpt || null;
    this.stage = params.stage;
    this.floor = params.floor;
    this.retryCount = 0;
    this.result = null;
    this.over = false;
    this.autoEnabled = !!params.auto;
    this.autoSummary = { wins: 0, stages: 0, gainedXP: 0, gold: 0, gem: 0, scroll: 0, iron: 0, recent: [] };
    this.autoStopReason = '';
    this.speed = this.autoEnabled ? ((store.getState().settings || {}).autoBattleSpeed || C.AUTO_BATTLE.defaultSpeed) : 1;
    this.autoState = autoBattle.createState();
    if (this.autoEnabled) {
      this.sendAuto({ type: 'start', mode: this.mode, index: this.stage, cleared: store.getState().campaign.cleared, level: store.playerLevel() });
    } else this.start();
  },
  onExit() {
    if (this.autoEnabled && this.autoState && ['fighting', 'resultDelay', 'suspended'].includes(this.autoState.status)) {
      this.sendAuto({ type: 'stop', reason: 'navigate-away' });
    } else if (this.battleId) {
      const pending = store.getState().battle.pending;
      if (pending && pending.id === this.battleId) {
        const result = store.interruptBattle(this.battleId, 'navigate-away');
        if (result.ok) this.battleId = null;
        else this.autoStopReason = result.msg;
      }
      if (!this.autoEnabled) {
        this.over = true;
        this.result = { win: false, lines: ['本场已中断，未结算奖励。'], nextLabel: null };
      }
    }
    store.save();
  },
  onHide() {
    this.wasHidden = true;
    if (this.autoEnabled) this.sendAuto({ type: 'pause', reason: 'background' });
  },
  onShow() { this.wasHidden = false; },
  sendAuto(event) {
    const next = autoBattle.transition(this.autoState, event, C.AUTO_BATTLE);
    this.autoState = next.state;
    next.commands.forEach(cmd => this.handleAutoCommand(cmd));
  },
  handleAutoCommand(cmd) {
    if (cmd.type === 'startBattle') {
      this.mode = cmd.mode;
      if (cmd.mode === 'campaign') this.stage = cmd.index;
      this.setupError = '';
      this.start(false, cmd);
    } else if (cmd.type === 'interruptBattle') {
      const result = store.interruptBattle(cmd.battleId, 'auto-stopped');
      if (!result.ok) { this.autoStopReason = result.msg; this.cleanupFailure = cmd.battleId; }
      else { this.battleId = null; this.cleanupFailure = null; }
    } else if (cmd.type === 'stopped') {
      this.autoStopReason = this.autoStopReason || cmd.reason;
      this.over = true;
      this.result = null;
    }
  },

  buildCfg() {
    let team = store.playerUnits();
    if (this.revivePct) team = team.map(u => Object.assign({}, u, { startHpPct: this.revivePct }));
    if (this.mode === 'tower') {
      const def = stages.makeTowerEnemies(this.floor);
      return { title: def.name, team, enemy: store.enemyUnits(def.units), seed: 55000 + this.floor * 77 + this.retryCount };
    }
    if (this.mode === 'arena') {
      const opt = this.arenaOpt;
      const def = stages.makeArenaEnemies(store.teamPower(), opt.seed, opt.diff);
      const enemy = store.enemyUnits(def.units);
      return { title: '演武场 · 对阵 ' + opt.name, team, enemy, seed: opt.seed + this.retryCount, referenceLevel: Math.max(1, Math.floor(enemy.reduce((n, u) => n + u.level, 0) / enemy.length)) };
    }
    if (this.mode === 'training') {
      const def = stages.makePracticeEnemies(store.playerLevel(), 70000 + this.retryCount);
      return { title: def.name, team, enemy: store.enemyUnits(def.units), seed: def.seed + this.retryCount, referenceLevel: def.referenceLevel };
    }
    const stage = this.stage || (store.getState().campaign.cleared + 1);
    this.stage = stage;
    const def = stages.makeStageEnemies(stage);
    return { title: def.name + (def.isBoss ? ' ⚔' : ''), team, enemy: store.enemyUnits(def.units), seed: 1000 + stage * 13 + this.retryCount, story: def.story, referenceLevel: def.units[0].level };
  },
  start(keepRevive, autoCmd) {
    if (!keepRevive) { this.reviveUsed = false; this.revivePct = 0; }
    if (store.playerUnits().length === 0) {
      this.setupError = '请先在编队中上阵武将';
      if (autoCmd) this.sendAuto({ type: 'battleStarted', ok: false, reason: this.setupError, sessionToken: autoCmd.sessionToken });
      return;
    }
    this.cfg = this.buildCfg();
    const index = this.mode === 'campaign' ? this.stage : this.mode === 'tower' ? this.floor : 0;
    const pending = store.beginBattle({ mode: this.mode, index, referenceLevel: this.cfg.referenceLevel, diff: this.arenaOpt && this.arenaOpt.diff });
    if (!pending.ok) {
      this.setupError = pending.msg;
      if (autoCmd) this.sendAuto({ type: 'battleStarted', ok: false, reason: pending.msg, sessionToken: autoCmd.sessionToken });
      return;
    }
    this.setupError = '';
    this.battleId = pending.id;
    this.engine = battleMod.createBattle({ team: this.cfg.team, enemy: this.cfg.enemy, seed: this.cfg.seed });
    // 剧情弹层：战役模式且该关剧情未看过时插播（打字机 + 点击推进，看过不再弹）
    this.storyPages = []; this.storyPage = 0; this.storyChars = 0; this.storyOpen = false;
    if (!this.autoEnabled && this.mode === 'campaign' && this.cfg.story && !store.isStorySeen(this.stage)) {
      const st = this.cfg.story;
      this.storyPages = [{ nar: st.stage.narration }]
        .concat((st.stage.dialogue || []).map(d => ({ who: heroes.getHero(d.who), text: d.text })));
      this.storyOpen = true;
    }
    this.meta = this.cfg.team.concat(this.cfg.enemy).map(u => {
      const h = heroes.getHero(u.heroId);
      const pos = POS[u.uid] || [187, 260];
      return {
        uid: u.uid, side: u.uid.charAt(0), name: u.name,
        surname: (u.name || '?').slice(0, 1), faction: u.faction,
        rarity: h ? h.rarity : 1, isBoss: !!u.isBoss,
        x: pos[0], y: pos[1],
        hp: u.stats.hp, maxHp: u.stats.hp, shield: 0, energy: 0,
        alive: true, cc: null, actAnim: 0, glow: 0
      };
    });
    this.banner = null; this.bannerT = 0;
    this.flashT = 0; this.shakeT = 0;
    this.over = false; this.result = null;
    if (!this.autoEnabled) this.speed = 1;
    if (this.autoEnabled && autoCmd) {
      this.sendAuto({ type: 'battleStarted', ok: true, battleId: pending.id, sessionToken: autoCmd.sessionToken });
    }
    this.accumulator = 0;
    this.timeLeft = 90;
  },

  update(dt) {
    // 剧情弹层期间战斗暂停，只推进打字机
    if (this.storyOpen) { this.storyChars += dt * 24; return; }
    if (this.autoEnabled && this.autoState && this.autoState.status === 'suspended') return;
    if (this.autoEnabled && this.autoState && this.autoState.status === 'resultDelay') {
      this.sendAuto({ type: 'tick', dt });
      return;
    }
    if (this.over || !this.engine) return;
    let events = [], r = null, guard = 0;
    this.accumulator += dt * this.speed;
    while (this.accumulator + 1e-9 >= C.BATTLE.TICK && !this.engine.ended && guard++ < 20) {
      this.accumulator -= C.BATTLE.TICK;
      r = this.engine.step(C.BATTLE.TICK);
      events = events.concat(r.events);
      if (r.done) break;
    }
    this.applyEvents(events);
    // 同步快照
    const snap = {};
    this.engine.snapshot().forEach(s => { snap[s.uid] = s; });
    this.meta.forEach(m => {
      const s = snap[m.uid];
      if (!s) return;
      m.hp = s.hp; m.shield = s.shield; m.energy = s.energy;
      m.alive = s.alive; m.cc = s.cc;
      if (m.actAnim > 0) m.actAnim -= dt;
      if (m.glow > 0) m.glow -= dt;
    });
    if (r) this.timeLeft = Math.max(0, Math.ceil(C.BATTLE.TIME_LIMIT - r.time));
    if (this.bannerT > 0) { this.bannerT -= dt; if (this.bannerT <= 0) this.banner = null; }
    if (this.flashT > 0) this.flashT -= dt;
    if (this.shakeT > 0) this.shakeT -= dt;
    if (r && r.done) this.finish(r);
  },

  applyEvents(events) {
    const M = {};
    this.meta.forEach(m => { M[m.uid] = m; });
    events.forEach(ev => {
      switch (ev.e) {
        case 'hit': {
          const m = M[ev.uid];
          if (!m) break;
          const dot = (ev.kind || '').indexOf('dot') === 0;
          ui.addFloat(m.x, m.y - 34, (ev.crit ? '暴击 ' : '') + '-' + ev.amount,
            ev.crit ? '#ff5a3c' : (dot ? '#c98af0' : '#ffb84d'), ev.crit ? 17 : 14);
          break;
        }
        case 'heal': { const m = M[ev.uid]; if (m) ui.addFloat(m.x, m.y - 34, '+' + ev.amount, '#7fe0a8', 14); break; }
        case 'shield': { const m = M[ev.uid]; if (m) ui.addFloat(m.x, m.y - 34, '盾+' + ev.amount, '#8ec5f0', 13); break; }
        case 'cheat': { const m = M[ev.uid]; if (m) ui.addFloat(m.x, m.y - 34, '龙胆！免死', '#7fe0a8', 14); break; }
        case 'death': { const m = M[ev.uid]; if (m) ui.addFloat(m.x, m.y - 24, '阵亡', '#a08c6a', 13); break; }
        case 'act': {
          const m = M[ev.uid || ev.src];
          if (m) m.actAnim = 0.32;
          break;
        }
        case 'ult': {
          const m = M[ev.uid];
          if (m) { m.glow = 1.4; this.banner = { who: m.name, skill: ev.skill, side: m.side }; this.bannerT = 1.1; }
          if (ev.scope === 'all') { this.flashT = 0.5; this.shakeT = 0.32; }
          break;
        }
      }
    });
  },
  finish(r) {
    if (this.over || !this.battleId) return;
    const res = this.engine.result();
    const win = res.winner === 'A';
    const lines = [];
    const settled = store.settleBattle(this.battleId, { win, duration: res.duration });
    if (!settled.ok) {
      this.saveFailure = { id: this.battleId, outcome: res };
      this.over = true;
      this.result = { win, lines: ['本场已结束，但结算暂未保存。重试保存前不会开始下一场。'] };
      ui.toast(settled.msg);
      return;
    }
    this.saveFailure = null;
    this.battleId = null;
    const rw = settled.reward || {};
    if (this.mode === 'campaign') {
      if (win) {
        lines.push(rw.gem ? '首通奖励：元宝 ' + rw.gem : '重复挑战奖励');
        lines.push('铜钱 +' + F.fmtNum(rw.gold));
        if (rw.chest) lines.push('📦 章末宝箱：元宝 +' + rw.chest.gem + ' · 招募令 +' + rw.chest.scroll);
        if (rw.scroll) lines.push('招募令 ×' + rw.scroll);
        if (rw.armory) lines.push(rw.armory.duplicate ? '军械重复 · 精铁 +' + rw.armory.iron : '图鉴解锁：' + items.CATALOG.find(x => x.id === rw.armory.itemId).name);
        if (rw.armoryBox) lines.push('获得 ' + items.GRADES[rw.armoryBox].short + ' 品质自选箱，可在军械图鉴领取');
        if (this.cfg.story && this.cfg.story.isBoss) lines.push('「' + this.cfg.story.ch.finale + '」');
      } else {
        lines.push('首通奖励需凯旋后方可领取');
      }
    } else if (this.mode === 'tower') {
      if (win && rw.gem) {
        lines.push('首通奖励：元宝 ' + rw.gem);
        if (rw.scroll) lines.push('招募令 ×' + rw.scroll);
        if (rw.shard) lines.push('英雄碎片 ×' + rw.shard);
      } else if (win) lines.push('已通关过此层，无首通奖励');
      else lines.push('战败，本层进度未推进');
    } else if (this.mode === 'arena') {
      lines.push('演武积分 ' + (rw.delta >= 0 ? '+' : '') + rw.delta + '（当前 ' + rw.points + ' · ' + items.arenaRank(rw.points) + '）');
      lines.push('获得演武令 ×' + rw.tokens);
    } else if (this.mode === 'training') {
      lines.push(win ? '练兵胜利，经验已入账' : '练兵失败，可再次挑战');
    }
    lines.unshift('玩家经验 +' + settled.gainedXP + (settled.levelAfter > settled.levelBefore ? ' · Lv.' + settled.levelBefore + '→' + settled.levelAfter + '，全体武将同步提升' : ''));
    lines.push('用时 ' + res.duration + ' 秒');
    let nextLabel = '';
    if (win) {
      if (this.mode === 'campaign') nextLabel = '进军下一关';
      if (this.mode === 'tower') nextLabel = '挑战下一层';
    }
    if (this.autoEnabled) {
      if (win) this.autoSummary.wins += 1;
      if (this.mode === 'campaign' && win) this.autoSummary.stages += 1;
      this.autoSummary.gainedXP += settled.gainedXP || 0;
      if (rw && this.mode === 'campaign' && win) {
        ['gold','gem','scroll'].forEach(k => { this.autoSummary[k] += (rw[k] || 0) + (rw.chest && rw.chest[k] || 0); });
        if (rw.armory && rw.armory.duplicate) this.autoSummary.iron += rw.armory.iron || 0;
      }
      this.autoSummary.recent.unshift((this.mode === 'campaign' ? '第' + (settled.reward ? store.getState().campaign.cleared : this.stage) + '关' : this.mode === 'training' ? '练兵' : this.mode) + (win ? '胜' : '败'));
      this.autoSummary.recent = this.autoSummary.recent.slice(0, 10);
      this.result = { win, lines, level: settled.levelAfter, gainedXP: settled.gainedXP };
      this.over = false;
      this.sendAuto({ type: 'settled', ok: true, battleId: settled.id, summary: settled, sessionToken: this.autoState.sessionToken });
    } else {
      this.over = true;
      this.result = { win, lines, nextLabel, level: settled.levelAfter, gainedXP: settled.gainedXP };
    }
  },

  draw() {
    if (this.setupError) {
      ui.text('无法开始战斗', 187, 250, { size: 22, color: T.GOLD_HI, align: 'center', bold: true });
      ui.wrap(this.setupError, 40, 292, 295, 22, { size: 14, align: 'center', color: T.TEXT });
      ui.btn(90, 350, 195, 44, { text: '返回', style: 'gold', id: 'battle-setup-back', cb: () => app.pop() });
      return;
    }
    // 剧情弹层独占画面（战斗已暂停）
    if (this.storyOpen) { this.drawStory(); return; }
    const ctx = ui.ctx;
    let shakeX = 0, shakeY = 0;
    if (this.shakeT > 0) {
      shakeX = Math.sin(this.shakeT * 60) * 4;
      shakeY = Math.cos(this.shakeT * 47) * 3;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // 顶栏
    ui.text(this.cfg.title, 12, 10, { size: 13, color: T.GOLD });
    ui.text('⏳ ' + this.timeLeft + 's', 363, 10, { size: 12, color: this.timeLeft < 15 ? T.RED_HI : T.DIM, align: 'right' });

    // 中线
    ctx.save();
    ctx.strokeStyle = 'rgba(217,169,78,0.35)';
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(24, 398); ctx.lineTo(351, 398);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = T.BG;
    ctx.fillRect(160, 390, 56, 15);
    ctx.restore();
    ui.text('对 阵', 187, 392, { size: 10, color: 'rgba(217,169,78,0.55)', align: 'center' });

    // 单元
    this.meta.forEach(m => this.drawUnit(m));

    // 全屏闪光
    if (this.flashT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.flashT / 0.5) * 0.55;
      const g = ctx.createRadialGradient(187, 398, 30, 187, 398, 300);
      g.addColorStop(0, 'rgba(255,220,150,0.8)');
      g.addColorStop(1, 'rgba(255,120,60,0.2)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, app.W, app.H);
      ctx.restore();
    }
    ctx.restore(); // shake

    // 大招横幅
    if (this.banner) {
      const p = this.bannerT / 1.1;
      ctx.save();
      ctx.globalAlpha = p > 0.85 ? (1 - p) / 0.15 : (p < 0.2 ? p / 0.2 : 1);
      ctx.fillStyle = 'rgba(20,12,5,0.92)';
      ctx.fillRect(0, 374, app.W, 42);
      ctx.fillStyle = 'rgba(240,207,138,0.7)';
      ctx.fillRect(0, 374, app.W, 1);
      ctx.fillRect(0, 415, app.W, 1);
      ui.text(this.banner.who, 187, 378, { size: 10, color: this.banner.side === 'A' ? '#8fd8ae' : '#e89078', align: 'center' });
      ctx.font = T.font(19, true);
      ctx.fillStyle = T.GOLD_HI;
      ctx.shadowColor = 'rgba(240,207,138,0.65)';
      ctx.shadowBlur = 12;
      ctx.textAlign = 'center';
      ctx.fillText(this.banner.skill, 187, 400);
      ctx.restore();
    }

    // 底部控制
    if (this.autoEnabled) {
      this.drawAutoStatus();
      return;
    }
    if (this.over && this.result) {
      this.drawResult();
      return;
    }
    ui.btn(12, app.H - 42, 70, 30, { text: '撤退', style: 'ghost', size: 13, id: 'retreat', cb: () => app.pop() });
    ui.btn(90, app.H - 42, 90, 30, { text: '加速 ×' + this.speed, style: 'ghost', size: 13, id: 'speed', cb: () => { this.speed = this.speed >= 4 ? 1 : this.speed * 2; } });
    ui.btn(188, app.H - 42, 100, 30, { text: '跳过战斗', style: 'gold', size: 13, id: 'skip', cb: () => this.skip() });
  },
  drawAutoStatus() {
    const y = app.H - 150;
    const status = this.autoState && this.autoState.status;
    ui.panel(10, y, 355, 106, { fill: 'rgba(20,14,8,0.94)' });
    let title = status === 'suspended' ? '自动出征已暂停' : status === 'resultDelay' ? '战果结算 · 即将继续' : status === 'fighting' ? (this.mode === 'training' ? '连续练兵' : '自动出征') : '自动出征已停止';
    ui.text(title + '  ×' + this.speed, 22, y + 8, { size: 14, color: T.GOLD_HI, bold: true });
    let detail = this.autoStopReason || (this.autoState && this.autoState.reason === 'recovery-exhausted' ? '暂时受阻，收获材料提升后再出征' : this.mode === 'training' ? '胜利获得经验 · 有限批次' : '遇阻后有限练兵恢复');
    ui.text(detail, 22, y + 30, { size: 10, color: T.TEXT });
    if (this.saveFailure) {
      ui.text('结算暂未保存；保存成功前不会开始下一场。', 187, y + 56, { size: 9, color: T.RED_HI, align: 'center' });
      ui.btn(20, y + 92, 150, 24, { text: '重试保存', style: 'gold', size: 10, id: 'auto-save-retry', cb: () => { this.over = false; this.finish(this.engine.result()); } });
      ui.btn(205, y + 92, 150, 24, { text: '返回并中断', style: 'ghost', size: 10, id: 'auto-save-exit', cb: () => app.pop() });
      return;
    }
    if (this.cleanupFailure) {
      ui.text('本场中断暂未保存，请重试。', 187, y + 60, { size: 9, color: T.RED_HI, align: 'center' });
      ui.btn(20, y + 78, 150, 24, { text: '重试中断', style: 'gold', size: 10, id: 'auto-interrupt-retry', cb: () => {
        const r = store.interruptBattle(this.cleanupFailure, 'auto-stopped');
        if (r.ok) { this.battleId = null; this.cleanupFailure = null; this.autoStopReason = '自动出征已停止'; }
        else this.autoStopReason = r.msg;
      } });
      ui.btn(205, y + 78, 150, 24, { text: '返回主城', style: 'ghost', size: 10, id: 'auto-interrupt-exit', cb: () => app.pop() });
      return;
    }
    ui.text('推进 ' + this.autoSummary.stages + ' 关 · 胜利 ' + this.autoSummary.wins + ' · 经验 +' + F.fmtNum(this.autoSummary.gainedXP), 22, y + 48, { size: 9, color: T.DIM });
    ui.text('铜钱 +' + F.fmtNum(this.autoSummary.gold) + ' · 元宝 +' + F.fmtNum(this.autoSummary.gem) + ' · 令 +' + this.autoSummary.scroll + ' · 铁 +' + this.autoSummary.iron, 22, y + 61, { size: 8, color: T.DIM });
    if (status === 'stopped') {
      ui.btn(14, y + 78, 166, 24, { text: '返回主城', style: 'ghost', size: 10, id: 'auto-home', cb: () => app.pop() });
      ui.btn(190, y + 78, 170, 24, { text: this.mode === 'training' ? '再练一批' : '重新出征', style: 'gold', size: 10, id: 'auto-restart', cb: () => { const m = this.mode; this.onEnter({ mode: m, auto: true }); } });
    } else {
      ui.btn(14, y + 78, 72, 24, { text: '×' + this.speed, style: 'ghost', size: 10, id: 'auto-speed', cb: () => { this.speed = this.speed >= 4 ? 1 : this.speed * 2; store.setAutoBattleSpeed(this.speed); } });
      ui.btn(94, y + 78, 117, 24, { text: '本场后停止', style: 'ghost', size: 10, id: 'auto-stop-after', cb: () => this.sendAuto({ type: 'stopAfterBattle' }) });
      ui.btn(219, y + 78, 68, 24, { text: '停止', style: 'ghost', size: 10, id: 'auto-stop', cb: () => this.sendAuto({ type: 'stop', reason: 'manual-stop' }) });
      ui.btn(295, y + 78, 66, 24, { text: '剧情', style: 'plain', size: 10, id: 'auto-story', disabled: !this.cfg.story || this.mode !== 'campaign', cb: () => this.openStoryManually() });
    }
    if (status === 'suspended') ui.btn(249, y + 7, 102, 24, { text: '继续', style: 'gold', size: 10, id: 'auto-resume', cb: () => this.sendAuto({ type: 'resume', reason: 'background' }) });
    if (this.result && this.result.lines) ui.text(this.result.lines[0], 187, y - 8, { size: 9, color: T.GOLD, align: 'center' });
  },
  drawResult() {
    const ctx = ui.ctx;
    const r = this.result;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, app.W, app.H);
    ctx.restore();
    const bx = 40, bw = 295, by = 210, bh = 260;
    ui.panel(bx, by, bw, bh, { ornate: true });
    ui.text(r.win ? '凯  旋' : '败  北', 187, by + 22, {
      size: 30, bold: true, align: 'center',
      color: r.win ? T.GOLD_HI : '#8a7a62'
    });
    if (this.saveFailure) {
      ui.wrap('战斗奖励尚未确认入账。请重试保存，或返回并中断本场。', bx + 16, by + 78, bw - 32, 18, { size: 11, align: 'center', color: T.TEXT });
      ui.btn(bx + 14, by + bh - 62, 128, 34, { text: '重试保存', style: 'gold', size: 12, id: 'battle-save-retry', cb: () => { this.over = false; this.finish(this.engine.result()); } });
      ui.btn(bx + 153, by + bh - 62, 128, 34, { text: '返回并中断', style: 'ghost', size: 12, id: 'battle-save-exit', cb: () => app.pop() });
      return;
    }
    let y = by + 66;
    r.lines.forEach(line => {
      ui.text(line, 187, y, { size: 11, align: 'center' });
      y += 17;
    });
    // 复活会重建敌军状态，先关闭入口，避免广告后比免费再战更差。
    const canRevive = false;
    // 行1：返回 / 再战
    ui.btn(bx + 14, by + bh - 84, 128, 30, { text: '返回', style: 'ghost', size: 13, id: 'res-exit', cb: () => app.pop() });
    ui.btn(bx + 153, by + bh - 84, 128, 30, { text: '再战', style: 'ghost', size: 13, id: 'res-retry', cb: () => { this.retryCount++; this.over = false; this.result = null; this.start(); } });
    // 行2：复活（仅败北且可用时）/ 下一关
    if (canRevive) {
      ui.btn(bx + 14, by + bh - 46, 128, 30, {
        text: '📺 复活再战（' + (1 - reviveLeft) + '/1）', style: 'gold', size: 11, id: 'res-revive',
        cb: () => {
          ads.showRewarded('revive', () => {
            this.reviveUsed = true;
            this.revivePct = 0.3; // 复活后全队以 30% 血量再战
            this.over = false;
            this.result = null;
            this.start(true);
          }, (msg) => ui.toast(msg));
        }
      });
    } else {
      ui.btn(bx + 14, by + bh - 46, 128, 30, {
        text: r.win ? '—' : '复活暂不可用', style: 'plain', size: 11, disabled: true, id: 'res-revive-off'
      });
    }
    ui.btn(bx + 153, by + bh - 46, 128, 30, {
      text: r.nextLabel || '已至尽头', style: 'gold', size: 12, disabled: !r.nextLabel, id: 'res-next',
      cb: () => {
        if (!r.nextLabel) return;
        if (this.mode === 'campaign') this.stage++;
        if (this.mode === 'tower') this.floor++;
        this.over = false; this.result = null; this.start();
      }
    });
  },
  drawUnit(m) {
    const ctx = ui.ctx;
    const S = 44;
    const jump = m.actAnim > 0 ? (m.side === 'A' ? -7 : 7) * Math.sin((0.32 - m.actAnim) / 0.32 * Math.PI) : 0;
    const x = m.x - S / 2, y = m.y - S / 2 + jump;
    ctx.save();
    if (!m.alive) ctx.globalAlpha = 0.22;
    // 脸谱
    ui.heroFace(x, y, S, m, m.isBoss ? { mark: '👑' } : {});
    // 怒气满发光
    if (m.glow > 0 && m.alive) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, m.glow) * (0.5 + 0.4 * Math.sin(ui.time * 14));
      ctx.strokeStyle = '#f0cf8a';
      ctx.lineWidth = 2.5;
      ui.roundRectPath ? null : null;
      roundedStroke(ctx, x - 2, y - 2, S + 4, S + 4, 9);
      ctx.restore();
    }
    // 状态
    if (m.cc && m.alive) {
      ui.text(CC_ICON[m.cc] || '✦', x + S + 2, y - 6, { size: 12, color: '#f0c964' });
    }
    // 血条
    ui.bar(x - 4, y + S + 3, S + 8, 6, m.maxHp > 0 ? m.hp / m.maxHp : 0, m.side === 'A' ? 'green' : 'red');
    // 护盾条（叠在血条上方细线）
    if (m.shield > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(142,197,240,0.85)';
      const sw = Math.min(1, m.shield / m.maxHp) * (S + 8);
      ctx.fillRect(x - 4, y + S + 1, sw, 1.6);
      ctx.restore();
    }
    // 怒气条
    ui.bar(x - 4, y + S + 11, S + 8, 4, m.energy / 100, 'gold');
    // 名字
    ui.text(m.name, m.x, y + S + 17, { size: 10, color: m.side === 'A' ? '#cdb27f' : T.DIM, align: 'center' });
    ctx.restore();
  },
  skip() {
    if (!this.engine || this.engine.ended) return;
    let guard = 0;
    let r = null;
    while (!this.engine.ended && guard++ < 4000) r = this.engine.step(C.BATTLE.TICK);
    const snap = {};
    this.engine.snapshot().forEach(s => { snap[s.uid] = s; });
    this.meta.forEach(m => {
      const s = snap[m.uid];
      if (!s) return;
      m.hp = s.hp; m.alive = s.alive; m.shield = s.shield; m.energy = s.energy; m.cc = s.cc;
    });
    this.timeLeft = Math.max(0, Math.ceil(C.BATTLE.TIME_LIMIT - (r ? r.time : 0)));
    this.finish(this.engine.result());
  },

  openStoryManually() {
    if (!this.cfg || !this.cfg.story || this.mode !== 'campaign') return;
    const st = this.cfg.story;
    this.storyPages = [{ nar: st.stage.narration }].concat((st.stage.dialogue || []).map(d => ({ who: heroes.getHero(d.who), text: d.text })));
    this.storyPage = 0; this.storyChars = 0; this.storyOpen = true;
    this.sendAuto({ type: 'pause', reason: 'story' });
  },

  // ---------- 剧情弹层 ----------
  // 点击推进：未放完的句子先放完，放完则翻页；末页关闭并记入存档（看过不再弹）
  advanceStory() {
    const p = this.storyPages[this.storyPage];
    if (!p) { this.closeStory(); return; }
    const total = ('' + (p.who ? p.text : p.nar)).length;
    if (this.storyChars < total) { this.storyChars = total; return; }
    this.storyPage += 1;
    this.storyChars = 0;
    if (this.storyPage >= this.storyPages.length) this.closeStory();
  },
  closeStory() {
    if (!this.storyOpen) return;
    this.storyOpen = false;
    store.markStorySeen(this.stage);
    if (this.autoEnabled) this.sendAuto({ type: 'resume', reason: 'story' });
  },
  drawStory() {
    const ctx = ui.ctx;
    const st = this.cfg.story;
    ctx.save();
    ctx.fillStyle = 'rgba(10,6,2,0.92)';
    ctx.fillRect(0, 0, app.W, app.H);
    ctx.strokeStyle = 'rgba(217,169,78,0.5)';
    ctx.beginPath();
    ctx.moveTo(24, 92); ctx.lineTo(351, 92);
    ctx.stroke();
    ctx.restore();
    ui.text('第' + F.cnNum(st.chIdx + 1) + '章 · ' + st.ch.name, 187, 46, { size: 12, color: T.GOLD, align: 'center' });
    ui.text(st.stage.name, 187, 62, { size: 20, color: T.GOLD_HI, bold: true, align: 'center' });
    ui.text(st.isBoss ? '名 将 关' : '第' + (st.inCh + 1) + '关', 187, 98, { size: 10, color: T.DIM, align: 'center' });

    const p = this.storyPages[this.storyPage];
    const full = ('' + (p.who ? p.text : p.nar));
    const shown = full.slice(0, Math.floor(this.storyChars));
    const isDialog = !!p.who;
    const by = isDialog ? 468 : 560;
    ui.panel(24, by, 327, isDialog ? 220 : 160, { ornate: true });
    if (isDialog) {
      ui.heroFace(40, by - 30, 62, p.who, p.who.rarity === 4 ? { mark: '👑' } : {});
      ui.text(p.who.name, 118, by + 12, { size: 15, color: T.GOLD_HI, bold: true });
      ui.text('·' + C.FACTIONS[p.who.faction].name + '·', 170, by + 15, { size: 10, color: C.FACTIONS[p.who.faction].color });
      ui.wrap(shown, 40, by + 44, 295, 21, { size: 13, color: T.TEXT });
      if (this.storyChars >= full.length) ui.text('▼ 点击继续', 187, by + 192, { size: 10, color: T.DIM, align: 'center' });
    } else {
      ui.wrap(shown, 42, by + 26, 291, 22, { size: 13, color: T.TEXT });
      if (this.storyChars >= full.length) ui.text('▼ 点击继续', 187, by + 130, { size: 10, color: T.DIM, align: 'center' });
    }
    // 全屏点击推进；跳过按钮后注册优先生效
    ui.tap(0, 0, app.W, app.H, () => this.advanceStory(), 'story-page');
    ui.btn(275, 40, 76, 26, { text: '跳过剧情', style: 'ghost', size: 11, id: 'story-skip', cb: () => this.closeStory() });
  }
};
function roundedStroke(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
  ctx.stroke();
}

},
"src/screens/campaign.js":function(require,module,exports){
// 战役首页：地形/军旗/营地是可替换的原创占位；导航与奖励复用现有业务。
const home = require('./home');
const { app, ui } = require('../app');
const art = require('../campaign-art');
const store = require('../../utils/store');
const stages = require('../../utils/stages');
const story = require('../../utils/story');
const C = require('../../utils/config');
const F = require('../../utils/fmt');
const T = require('../theme');

const INK = '#3d4337', PAPER = '#eee3bf', GOLD = '#edcf88';
const POINTS = art.ROUTE;
function stageTitle(n) {
  const entry = story.getStoryStage(n);
  return entry ? entry.stage.name : (stages.chapterOf(n).isBoss ? '名将镇守' : '乱世征途');
}

module.exports = {
  ...home,
  name: 'campaign', scroll: {}, scrollReg: {}, showMap: false,
  onEnter() {
    home.onEnter.call(this);
    this.showMap = false;
  },
  draw() {
    const s = store.getState(), v = this.view, ctx = ui.ctx;
    const chapter = stages.chapterOf(v.stageNo);
    const mapY = 112, mapH = Math.max(160, app.H - 386);
    const campY = app.H - 274;
    ctx.save(); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 375, app.H); ctx.restore();
    art.drawMap(ctx, 0, mapY, 375, mapH);

    // 每章分两段展示，旗帜严格对应真实关卡；完整十关可由“征途”查看。
    const chapterStart = chapter.idx * stages.STAGES_PER_CH + 1;
    const segmentStart = chapterStart + (chapter.inCh < 5 ? 0 : 5);
    POINTS.forEach(([nx, ny], i) => {
      const n = segmentStart + i, x = nx * 375, y = mapY + ny * mapH;
      const state = n < v.stageNo ? 'cleared' : n === v.stageNo ? 'current' : 'locked';
      const scale = mapH < 250 ? .76 : 1;
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
      art.drawBanner(ctx, 0, 0, { state, label: '' + n }); ctx.restore();
      ui.tap(x - 17, y - 37 * scale, 47 * scale, 48 * scale, () => {
        ui.toast('第 ' + n + ' 关 · ' + stageTitle(n) + (state === 'cleared' ? ' · 已通关' : state === 'locked' ? ' · 通关前一关后开放' : ' · 点击自动出征开始'));
      }, 'campaign-node-' + n);
      if (state === 'current') {
        const labelY = Math.min(y + 9, campY - 22);
        ui.panel(x - 39, labelY, 97, 20, { fill: '#3c6255', r: 3 });
        ui.text('当前 · 第 ' + n + ' 关', x + 9, labelY + 4, { size: 10, color: '#fff0c4', align: 'center', bold: true });
      }
    });

    this.drawHeader(s, v, chapter);
    const ready = v.quests.some(q => q.done && !q.claimed) || v.chests.some(c => c.can && !c.claimed);
    const shortcutY = mapY + (mapH < 250 ? 0 : 34);
    const gap = mapH < 250 ? 44 : 57;
    this.shortcut(shortcutY, '令', '任务', 'campaign-quests', () => { this.refresh(); this.showQuests = true; }, ready);
    this.shortcut(shortcutY + gap, '召', '召唤', 'campaign-summon', () => app.switchTab('summon'));
    this.shortcut(shortcutY + gap * 2, '囊', '背包', 'campaign-bag', () => app.switchTab('bag'));
    this.shortcut(shortcutY + gap * 3, '械', '军械', 'campaign-armory', () => app.push('armory'));

    // 前景仅展示实际出战编队，不在首页虚构战斗或发放战斗收益。
    art.drawCamp(ctx, 0, campY, 375, 89, v.formation);
    ui.text('出战阵容', 16, campY + 3, { size: 10, bold: true, color: '#f4e8bf' });
    ui.text('调整编队 ›', 247, campY + 3, { size: 10, color: '#f4e8bf', align: 'right' });
    ui.tap(8, campY, 248, 85, () => app.push('formation'), 'campaign-formation');
    this.drawHarvest(campY, ready);
    this.drawActions(v);
    if (this.showQuests) this.drawQuests();
    else if (this.showIdle) this.drawIdle();
    else if (this.showMap) this.drawMapOverview(chapter);
  },
  drawHeader(s, v, chapter) {
    ui.panel(0, 0, 375, 82, { fill: '#2d3c35', r: 0 });
    ui.panel(11, 11, 48, 49, { fill: '#5b7057', ornate: true, r: 8 });
    ui.text('汉', 35, 17, { size: 29, bold: true, color: GOLD, align: 'center' });
    ui.text(s.name || '主公', 69, 12, { size: 16, bold: true, color: '#f5e8c9' });
    ui.text('Lv.' + store.playerLevel(), 70, 35, { size: 11, color: '#c7cdac' });
    const resources = [['gold', '铜钱'], ['gem', '元宝']];
    resources.forEach(([key, label], i) => {
      const x = 165 + i * 101;
      ui.panel(x, 12, 95, 29, { fill: '#24352e', r: 5 });
      ui.text(label, x + 7, 22, { size: 9, color: '#c6bc98' });
      ui.text(F.fmtNum(s.res[key]), x + 87, 20, { size: 13, bold: true, color: GOLD, align: 'right' });
    });
    const level = store.playerLevel(), need = store.playerXpNeeded(level);
    ui.bar(165, 49, 196, 5, level >= C.MAX_LEVEL ? 1 : s.player.exp / need, 'gold');
    ui.text('战力 ' + v.myPower, 13, 65, { size: 11, bold: true, color: GOLD });
    ui.text(level >= C.MAX_LEVEL ? '主公等级已满' : '战斗经验 ' + F.fmtNum(s.player.exp) + '/' + F.fmtNum(need), 360, 63, { size: 9, color: '#c7cdac', align: 'right' });
    ui.panel(0, 82, 375, 30, { fill: '#d9cda7', r: 0 });
    ui.text(chapter.name, 14, 90, { size: 13, bold: true, color: INK });
    ui.text(chapter.inCh + '/' + stages.STAGES_PER_CH + ' 关', 360, 92, { size: 10, color: '#6c6b4c', align: 'right' });
  },
  shortcut(y, glyph, label, id, cb, ready) {
    ui.panel(320, y, 45, 40, { fill: '#e5d5ad', ornate: true, r: 5 });
    ui.text(glyph, 342.5, y + 2, { size: 21, color: '#536957', bold: true, align: 'center' });
    ui.text(label, 342.5, y + 25, { size: 11, color: INK, bold: true, align: 'center' });
    ui.tap(317, y, 50, 42, cb, id);
    if (ready) ui.tag('!', 355, y - 4, '#b34e36');
  },
  drawHarvest(campY, dailyReady) {
    const idle = this.idle || store.idlePending();
    const canClaim = !!(idle.gold || idle.scroll || idle.iron || dailyReady);
    art.drawChest(ui.ctx, 286, campY + 14, 60, { ready: canClaim });
    ui.text('挂机宝箱', 316, campY + 70, { size: 11, bold: true, align: 'center', color: '#f4e8bf' });
    ui.tap(266, campY + 8, 98, 75, () => canClaim ? this.claimFreeRewards() : ui.toast('挂机收益积累中'), 'campaign-chest');
    const y = app.H - 185;
    ui.panel(10, y, 355, 44, { fill: '#ded2ae', r: 5 });
    const minutes = Math.floor(idle.hours * 60);
    ui.text(idle.full ? '挂机收益已满' : '积累 ' + Math.floor(minutes / 60) + '时' + minutes % 60 + '分', 21, y + 6, { size: 11, color: INK, bold: true });
    ui.text('铜钱 ' + F.fmtNum(idle.gold) + ' · 精铁 ' + idle.iron + ' · 招募令 ' + idle.scroll, 21, y + 26, { size: 9, color: '#74684a' });
    ui.btn(230, y + 6, 125, 32, { text: canClaim ? '一键收获' : '收益积累中', style: 'gold', size: 13, disabled: !canClaim, id: 'idle-claim', cb: () => this.claimFreeRewards() });
  },
  drawActions(v) {
    const y = app.H - 135;
    ui.btn(10, y, 53, 48, { text: '征途', sub: '本章地图', style: 'plain', size: 13, id: 'campaign-map', cb: () => { this.showMap = true; } });
    ui.btn(72, y, 231, 48, { text: v.isBoss ? '自动出征 · 挑战名将' : '自动出征', sub: '第 ' + v.stageNo + ' 关 · ' + stageTitle(v.stageNo), subColor: '#e5e5bf', style: 'jade', size: 20, r: 10, id: 'go-battle', cb: () => app.push('battle', { mode: 'campaign', auto: true }) });
    ui.btn(312, y, 53, 48, { text: '练兵', sub: '最多10胜', style: 'plain', size: 13, id: 'go-training', cb: () => app.push('battle', { mode: 'training', auto: true }) });
    ui.panel(0, app.H - 81, 375, 29, { fill: '#344438', r: 0 });
    const title = this.goal ? this.goal.title : '通关越多，挂机收益越高';
    ui.text('目标  ' + title, 12, app.H - 72, { size: 10, color: '#e9ddba' });
    ui.tap(6, app.H - 81, 255, 29, () => {
      if (this.goal && this.goal.action && this.goal.action.type !== 'campaign') this.openGoal(this.goal);
      else this.showMap = true;
    }, 'campaign-goal');
    ui.btn(282, app.H - 78, 82, 23, { text: '加速 / 双倍', style: 'ghost', size: 10, id: 'idle-more', cb: () => { this.showIdle = true; } });
  },
  drawMapOverview(chapter) {
    const close = () => { this.showMap = false; };
    ui.setModalClose(close);
    const h = Math.min(544, app.H - 28), y = (app.H - h) / 2;
    const b = ui.modal(chapter.name, 16, y, 343, h);
    const start = chapter.idx * stages.STAGES_PER_CH + 1;
    ui.text('本章征途 · 已通关 ' + chapter.inCh + '/' + stages.STAGES_PER_CH, b.x, b.y + 1, { size: 11, color: GOLD });
    ui.beginScroll(this, 'chapter-map', b.x, b.y + 23, b.w, b.h - 75, stages.STAGES_PER_CH * 39);
    for (let i = 0; i < stages.STAGES_PER_CH; i++) {
      const n = start + i, yy = b.y + 23 + i * 39;
      const cleared = n < this.view.stageNo, current = n === this.view.stageNo;
      ui.panel(b.x, yy, b.w, 34, { fill: current ? '#375c4b' : '#302b1c', r: 3 });
      ui.text(String(n).padStart(2, '0') + '  ' + stageTitle(n), b.x + 9, yy + 10, { size: 12, color: current ? '#fff0c4' : T.TEXT });
      ui.text(cleared ? '已通关' : current ? '当前' : '未开放', b.x + b.w - 9, yy + 12, { size: 10, color: current ? GOLD : T.DIM, align: 'right' });
    }
    ui.endScroll();
    ui.btn(b.x, y + h - 43, b.w, 31, { text: '返回战役', style: 'gold', id: 'campaign-map-close', cb: close });
  }
};

},

const F = require('../../utils/fmt');

  },
