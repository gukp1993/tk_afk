    ui.text(idle.full ? '已满 · ' + C.IDLE_CAP_HOURS + '小时' : '积累 ' + Math.floor(mins / 60) + '时' + mins % 60 + '分', 14, y + 132, { size: 9, color: MUTED });
    ui.btn(141, y + 111, 128, 34, { text: canClaim ? '一键收获' : '收益积累中', style: 'gold', size: 11, id: 'idle-claim', disabled: !canClaim, cb: () => this.claimFreeRewards() });
    ui.btn(278, y + 111, 85, 34, { text: '加速 / 双倍', style: 'plain', size: 9, id: 'idle-more', cb: () => { this.showIdle = true; } });
  },
  goalSummary(goal) {
    if (!goal) return '';
    const a = goal.action || {}, p = goal.progress || {}, reward = goal.rewardPreview || {};
    if (p.remaining != null) return '进度 ' + p.current + '/' + p.target + ' · 章末宝箱与阶段自选权益';
    if (a.focusFirstWin) return '选择一名初始武将自动升星';
    if (a.id && a.focus === 'ascend') return '重复武将卡会自动升星';
    if (a.boxQ) return '待选军械箱 · 品质 ' + a.boxQ;
    if (a.pickRarity) return '待用 ' + (a.pickRarity === 3 ? 'SR' : 'SSR') + ' 自选券';
    if (a.recommendations) return a.recommendations.length + ' 个部位有免费提升';
    if (reward.replacements) return reward.replacements.length + ' 个部位有免费提升';
    return '点击查看奖励与操作入口';
  }
};

},
"src/screens/forge.js":function(require,module,exports){
// 铁匠铺：装备背包、升星强化（吃装备攒强化点）、分解、穿戴
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const items = require('../../utils/items');
const C = require('../../utils/config');
const F = require('../../utils/fmt');

const SLOT_FILTERS = [
  { key: 'all', name: '全部' }, { key: 'weapon', name: '兵刃' }, { key: 'armor', name: '铠甲' },
  { key: 'helm', name: '头盔' }, { key: 'boots', name: '战靴' }
];
const Q_FILTERS = [
  { key: 0, name: '全部' }, { key: 1, name: 'N' }, { key: 2, name: 'R' }, { key: 3, name: 'SR' }, { key: 4, name: 'SSR' }
];

module.exports = {
  name: 'forge',
  scroll: {}, scrollReg: {},
  filter: 'all', qFilter: 0,
  showHero: false, wearId: null, wearSlot: null,
  showFodder: false, targetId: null, picked: {}, fodderList: [],

  onEnter() { this.refresh(); },
  refresh() {
    const inv = store.equipInventory().map(e => this.view(e));
    this.list = inv
      .filter(x => this.filter === 'all' || x.slot === this.filter)
      .filter(x => !this.qFilter || x.q === this.qFilter)
      .sort((a, b) => b.q - a.q || b.stars - a.stars);
    this.gold = F.fmtNum(store.getState().res.gold);
    this.nCount = inv.filter(x => x.q === 1 && !x.stars).length;
    if (this.showFodder) this.refreshFodder();
  },
  view(e) {
    const Q = items.EQUIP_QUALITIES[e.q];
    const maxed = e.stars >= Q.maxStar;
    const need = maxed ? 0 : items.starNeed(e.q, e.stars);
    return {
      ...e,
      qName: Q.name, label: Q.label, color: Q.color, maxStar: Q.maxStar, maxed, need,
      goldCost: maxed ? 0 : items.starGold(need),
      fPts: items.fodderPoints(e),
      slotName: items.EQUIP_SLOTS[e.slot].name,
      icon: items.EQUIP_SLOTS[e.slot].icon,
      statText: this.statText(items.equipStat(e.q, e.slot, e.stars, false)),
      salvage: F.fmtNum(Math.floor(items.fodderPoints(e) * items.GOLD_PER_POINT * 0.4))
    };
  },
  statText(add) {
    const p = [];
    if (add.atk) p.push('攻+' + add.atk);
    if (add.hp) p.push('血+' + add.hp);
    if (add.def) p.push('防+' + add.def);
    return p.join(' ');
  },

  draw() {
    app.pageHeader('铁 匠 铺');
    app.resBar(48, ['gold']);
    let y = 74;
    let x = 8;
    SLOT_FILTERS.forEach(f => {
      const w = ui.textWidth(f.name, 11) + 20;
      ui.chipBtn(x, y, w, 20, f.name, this.filter === f.key, () => { this.filter = f.key; this.refresh(); }, 'ff-' + f.key);
      x += w + 6;
    });
    y += 26;
    x = 8;
    Q_FILTERS.forEach(f => {
      const w = ui.textWidth(f.name, 11) + 20;
      ui.chipBtn(x, y, w, 20, f.name, this.qFilter === f.key, () => { this.qFilter = f.key; this.refresh(); }, 'qf-' + f.key);
      x += w + 6;
    });
    // 批量分解 N 品 0 星（减负：白装洪水的快速出口）
    const snName = '分解白装 ' + this.nCount;
    const snW = ui.textWidth(snName, 11) + 20;
    ui.chipBtn(367 - snW, y, snW, 20, snName, false, () => {
      if (!this.nCount) { ui.toast('没有可分解的白装'); return; }
      const r = store.salvageBatch(1);
      ui.toast('分解 ' + r.count + ' 件 · 得铜钱 ' + F.fmtNum(r.gold));
      this.refresh();
    }, 'salvage-n');
    y += 32;

    const contentH = this.list.length * 62;
    ui.beginScroll(this, 'inv', 8, y, 359, app.H - y - 8, contentH);
    this.list.forEach((e, i) => this.drawCard(e, y + i * 62));
    if (!this.list.length) ui.text('背包空空如也 · 出征战役可获装备', 187, y + 60, { size: 12, color: T.DIM, align: 'center' });
    ui.endScroll();

    if (this.showHero) this.drawHeroPicker();
    if (this.showFodder) this.drawFodderPicker();
  },
  drawCard(e, ey) {
    ui.panel(8, ey, 359, 56);
    ui.text(e.icon, 20, ey + 8, { size: 18 });
    // 名称道（品质色，限宽 ~100px）；阵营字固定右对齐 x150，不随名称/星数浮动
    ui.text(e.qName + ' ' + e.slotName, 50, ey + 8, { size: 13, color: e.color, bold: true });
    if (e.faction) ui.text(C.FACTIONS[e.faction].name, 150, ey + 9, { size: 11, color: C.FACTIONS[e.faction].color, align: 'right' });
    // 属性道：属性（灰）在前，星级（金）随后，互不挤压
    ui.text(e.statText, 50, ey + 27, { size: 10, color: T.DIM });
    if (e.stars > 0) ui.text('★'.repeat(e.stars), 50 + ui.textWidth(e.statText, 10) + 6, ey + 28, { size: 10, color: T.GOLD });
    // 操作：升星（吃装备）/ 穿戴 / 分解
    ui.btn(158, ey + 8, 92, 17, {
      text: e.maxed ? '已满星' : '升星 ' + F.fmtNum(e.goldCost), style: 'gold', size: 9, disabled: e.maxed,
      id: 'enh-' + e.id,
      cb: () => { this.openFodder(e.id); }
    });
    ui.btn(158, ey + 30, 92, 17, {
      text: '穿戴', style: 'ghost', size: 9, id: 'wear-' + e.id,
      cb: () => { this.showHero = true; this.wearId = e.id; this.wearSlot = e.slot; }
    });
    ui.btn(256, ey + 8, 100, 17, {
      text: '分解 ' + e.salvage, style: 'ghost', size: 9, id: 'sal-' + e.id,
      cb: () => {
        const r = store.salvageEquip(e.id);
        if (!r.ok) ui.toast(r.msg); else ui.toast('分解得铜钱 ' + F.fmtNum(r.gold));
        this.refresh();
      }
    });
  },

  // ---- 升星弹窗：选狗粮攒强化点 ----
  openFodder(instId) {
    this.showFodder = true;
    this.targetId = instId;
    this.picked = {};
    this.refreshFodder();
  },
  refreshFodder() {
    const t = this.target();
    if (!t) { this.showFodder = false; this.targetId = null; this.fodderList = []; return; }
    this.fodderList = store.equipInventory()
      .filter(x => x.id !== this.targetId)
      .map(x => ({ ...x, pts: items.fodderPoints(x) }))
      .sort((a, b) => a.pts - b.pts || a.q - b.q);
  },
  target() {
    const e = store.getState().equips[this.targetId];
    return e ? this.view(e) : null;
  },
  pickedPts() {
    return this.fodderList.reduce((s, x) => s + (this.picked[x.id] ? x.pts : 0), 0);
  },
  drawFodderPicker() {
    const t = this.target();
    if (!t) { this.showFodder = false; return; }
    const box = ui.modal('升 星', 24, 140, 327, 560);
    ui.setModalClose(() => { this.showFodder = false; this.targetId = null; });
    ui.tap(0, 0, app.W, app.H, () => { this.showFodder = false; this.targetId = null; }, 'fodder-mask');

    const pts = this.pickedPts();
    const enough = pts >= t.need;
    // 目标与进度
    ui.text(t.qName + ' ' + t.slotName, box.x + 8, box.y + 2, { size: 14, color: t.color, bold: true });
    ui.text((t.stars ? '★'.repeat(t.stars) + ' ' : '') + '→ ★' + (t.stars + 1), box.x + box.w - 8, box.y + 4, { size: 12, color: T.GOLD, align: 'right' });
    ui.text('强化点 ' + pts + '/' + t.need + ' · 铜钱 ' + F.fmtNum(t.goldCost), box.x + 8, box.y + 24, { size: 11, color: enough ? T.GOLD : T.DIM });
    // 操作行
    ui.btn(box.x + 8, box.y + 44, 108, 22, {
      text: '一键放入', style: 'ghost', size: 11, id: 'fodder-auto',
      cb: () => {
        this.picked = {};
        store.fodderPickIds(this.targetId, this.fodderList.map(x => x.id)).forEach(id => { this.picked[id] = true; });
      }
    });
    ui.btn(box.x + box.w - 8 - 150, box.y + 44, 150, 22, {
      text: '确认强化', style: 'gold', size: 11, disabled: !enough, id: 'fodder-ok',
      cb: () => {
        const r = store.enhanceEquip(this.targetId, Object.keys(this.picked));
        if (!r.ok) ui.toast(r.msg);
        else ui.toast('升星成功 ★' + r.stars);
        this.showFodder = false; this.targetId = null;
        this.refresh();
      }
    });
    // 狗粮列表
    const ly = box.y + 74, lh = box.h - 82;
    ui.beginScroll(this, 'fodder', box.x + 4, ly, box.w - 8, lh, this.fodderList.length * 42);
    this.fodderList.forEach((e, i) => {
      const ry = ly + i * 42;
      const on = !!this.picked[e.id];
      ui.panel(box.x + 4, ry, box.w - 8, 38, on ? { fill: 'rgba(240,185,94,0.14)' } : {});
      ui.text(on ? '✓' : '·', box.x + 14, ry + 10, { size: 14, color: on ? T.GOLD : T.DIM, bold: true });
      const Q = items.EQUIP_QUALITIES[e.q];
      let tx = box.x + 32;
      const head = Q.name + ' ' + items.EQUIP_SLOTS[e.slot].name;
      ui.text(head, tx, ry + 10, { size: 12, color: Q.color, bold: true });
      tx += ui.textWidth(head, 12, true);
      if (e.stars > 0) {
        const st = ' ' + '★'.repeat(e.stars);
        ui.text(st, tx, ry + 11, { size: 10, color: T.GOLD });
        tx += ui.textWidth(st, 10);
      }
      if (e.faction) {
        ui.text(' ' + C.FACTIONS[e.faction].name, tx, ry + 11, { size: 10, color: C.FACTIONS[e.faction].color });
      }
      ui.text('+' + e.pts + '点', box.x + box.w - 16, ry + 11, { size: 11, color: T.DIM, align: 'right' });
      ui.tap(box.x + 4, ry, box.w - 8, 40, () => {
        if (this.picked[e.id]) delete this.picked[e.id];
        else this.picked[e.id] = true;
      }, 'fod-' + e.id);
    });
    if (!this.fodderList.length) ui.text('没有可消耗的装备 · 出征可得', box.x + box.w / 2, ly + 40, { size: 11, color: T.DIM, align: 'center' });
    ui.endScroll();
  },

  // ---- 穿戴选人 ----
  drawHeroPicker() {
    const list = store.allRoster().slice().sort((a, b) => b.power - a.power);
    const box = ui.modal('穿 戴 给 谁', 40, 130, 295, 460);
    ui.setModalClose(() => { this.showHero = false; });
    ui.tap(0, 0, app.W, app.H, () => { this.showHero = false; }, 'wear-mask');
    const cols = 3, cw = (box.w - 16) / 3, chh = 104;
    const rows = Math.ceil(list.length / cols);
    ui.beginScroll(this, 'wearpick', box.x, box.y, box.w, box.h, rows * (chh + 8));
    list.forEach((h, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = box.x + col * (cw + 8);
      const y = box.y + row * (chh + 8);
      ui.panel(x, y, cw, chh, { ornate: h.rarity === 4 });
      ui.tap(x, y, cw, chh, () => {
        store.equipTo(h.id, this.wearSlot, this.wearId);
        this.showHero = false;
        ui.toast('已给 ' + h.name + ' 穿戴');
        this.refresh();
      }, 'wear-' + h.id);
      ui.heroFace(x + 5, y + 5, cw - 10, h, {});
      ui.text(h.name, x + 5, y + 62, { size: 12, bold: true });
      ui.text('Lv.' + h.level, x + 5, y + 78, { size: 10, color: T.GOLD });
      ui.text('战力 ' + F.fmtNum(h.power), x + cw - 5, y + 90, { size: 8, color: T.DIM, align: 'right' });
    });
    ui.endScroll();
  }
};

},
"src/screens/formation.js":function(require,module,exports){
// 编队：前3后2槽位、阵营加成、一键布阵
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const F = require('../../utils/fmt');
const { recommendFormation } = require('../../utils/formation');

module.exports = {
  name: 'formation',
  scroll: {}, scrollReg: {},
  pickSlot: -1,
  recommendOpen: false,

  onEnter() { this.refresh(); },
  refresh() {
    const calc = store.getFormationCalc();
    const { bonus } = store.formationFactionBonus();
    this.slots = calc.map((x, i) => ({ calc: x, row: i <= 2 ? 0 : 1, slot: i }));
    this.power = F.fmtNum(store.teamPower());
    this.bonusText = bonus.atk > 0
      ? '同阵营 ×' + (bonus.atk >= 0.18 ? 5 : bonus.atk >= 0.12 ? 4 : 3) + '：攻击/生命 +' + Math.round(bonus.atk * 100) + '%'
      : '同阵营 3/4/5 人激活全队加成';
  },

  draw() {
    app.pageHeader('编 队');
    let y = 52;
    ui.panel(8, y, 359, 62, { ornate: true });
    ui.text('出征编队', 20, y + 8, { size: 15, color: T.GOLD_HI, bold: true });
    ui.text('总战力 ' + this.power, 20, y + 30, { size: 15, color: T.GOLD });
    ui.text(this.bonusText, 20, y + 48, { size: 10, color: T.DIM });
    ui.btn(272, y + 16, 84, 28, { text: '推荐布阵', style: 'gold', size: 11, id: 'auto', cb: () => { this.recommended = recommendFormation(store.allRoster()); this.recommendOpen = true; } });
    y += 72;

    // 后排
    ui.text('后 排（远程输出 / 辅助）', 187, y, { size: 10, color: T.DIM, align: 'center' });
    y += 16;
    y = this.drawRow(y, 1);
    // 分界线
    const ctx = ui.ctx;
    ctx.save();
    ctx.strokeStyle = 'rgba(217,169,78,0.35)';
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(60, y + 10); ctx.lineTo(315, y + 10);
    ctx.stroke();
    ctx.restore();
    y += 22;
    ui.text('前 排（承伤 / 近战）', 187, y, { size: 10, color: T.DIM, align: 'center' });
    y += 16;
    y = this.drawRow(y, 0);

    ui.wrap('点击已上阵武将可更换；阵营克制：魏→蜀→吴→群→魏，克制方伤害 +25%。', 24, y + 8, 330, 13, { size: 10 });

    if (this.pickSlot >= 0) this.drawPicker();
    if (this.recommendOpen) this.drawRecommendConfirm();
  },
  drawRow(y, row) {
    const slots = this.slots.filter(s => s.row === row);
    const sw = 96;
    const total = slots.length * sw + (slots.length - 1) * 12;
    let x = (app.W - total) / 2;
    slots.forEach(s => {
      ui.panel(x, y, sw, 86, {});
      ui.tap(x, y, sw, 86, () => { this.pickSlot = s.slot; this.pickerScroll = 0; }, 'slot-' + s.slot);
      if (s.calc) {
        ui.heroFace(x + 8, y + 8, sw - 16, s.calc, {});
        ui.text(s.calc.name, x + sw / 2, y + 58, { size: 12, align: 'center' });
        ui.text('Lv.' + s.calc.level, x + sw / 2, y + 72, { size: 9, color: T.DIM, align: 'center' });
      } else {
        ui.text('+', x + sw / 2, y + 26, { size: 24, color: T.DIM, align: 'center' });
        ui.text('点击上阵', x + sw / 2, y + 60, { size: 10, color: T.DIM, align: 'center' });
      }
      x += sw + 12;
    });
    return y + 94;
  },
  candidates() {
    const formed = new Set(store.getState().formation);
    return store.allRoster().filter(h => !formed.has(h.id)).sort((a, b) => b.power - a.power);
  },
  drawRecommendConfirm() {
    const list = store.allRoster(), byId = {};
    list.forEach(h => { byId[h.id] = h; });
    const ids = this.recommended || [];
    const box = ui.modal('均衡推荐编队', 30, Math.max(90, (app.H - 300) / 2), 315, 300);
    ui.setModalClose(() => { this.recommendOpen = false; });
    ui.wrap('按职业与战力生成建议，可直接应用；不会因抽到新将自动换阵。', box.x, box.y + 2, box.w, 14, { size: 10, color: T.DIM });
    ids.forEach((id, i) => {
      const h = id && byId[id], row = i < 3 ? '前排' : '后排';
      ui.text((i + 1) + '号位 · ' + row + ' · ' + (h ? h.name + '（战力 ' + F.fmtNum(h.power) + '）' : '空位'), box.x + 4, box.y + 54 + i * 28, { size: 10, color: h ? T.TEXT : T.DIM });
    });
    ui.btn(box.x, box.y + 249, 122, 30, { text: '保留当前阵容', style: 'ghost', size: 10, id: 'formation-rec-cancel', cb: () => { this.recommendOpen = false; } });
    ui.btn(box.x + 134, box.y + 249, 170, 30, { text: '应用推荐编队', style: 'gold', size: 10, id: 'formation-rec-apply', disabled: !ids.some(Boolean), cb: () => {
      const r = store.applyFormation(ids);
      if (!r.ok) { ui.toast(r.msg || '推荐应用失败'); return; }
      this.recommendOpen = false; this.refresh(); ui.toast('均衡推荐编队已应用');
    } });
  },
  drawPicker() {
    const list = this.candidates();
    const box = ui.modal('选 择 武 将（' + (this.pickSlot + 1) + '号位）', 30, 120, 315, 470);
    ui.setModalClose(() => { this.pickSlot = -1; });
    ui.tap(0, 0, app.W, app.H, () => { this.pickSlot = -1; }, 'slot-mask');
    ui.btn(box.x, box.y, box.w, 26, {
      text: '卸下该位置', style: 'ghost', size: 12, id: 'slot-empty',
      cb: () => {
        store.setFormationSlot(this.pickSlot, null);
        this.pickSlot = -1;
        this.refresh();
      }
    });
    const cols = 3, cw = (box.w - 16) / 3, chh = 104;
    const rows = Math.ceil(list.length / cols);
    ui.beginScroll(this, 'picker', box.x, box.y + 34, box.w, box.h - 34, rows * (chh + 8));
    list.forEach((h, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = box.x + col * (cw + 8);
      const y = box.y + 34 + row * (chh + 8);
      const maxStar = [0, 2, 3, 4, 5][h.rarity];
      ui.panel(x, y, cw, chh, { ornate: h.rarity === 4 });
      ui.tap(x, y, cw, chh, () => {
        store.setFormationSlot(this.pickSlot, h.id);
        this.pickSlot = -1;
        this.refresh();
      }, 'pick-' + h.id);
      ui.heroFace(x + 5, y + 5, cw - 10, h, {});
      ui.text(h.name, x + 5, y + 62, { size: 12, bold: true });
      ui.text(T.RARITY[h.rarity].name, x + cw - 5, y + 63, { size: 10, color: T.RARITY[h.rarity].color, align: 'right', bold: true });
      ui.text('Lv.' + h.level, x + 5, y + 78, { size: 10, color: T.GOLD });
      ui.text('战力 ' + F.fmtNum(h.power), x + cw - 5, y + 90, { size: 8, color: T.DIM, align: 'right' });
    });
    if (!list.length) ui.text('没有可上阵的武将了', box.x + box.w / 2, box.y + 60, { size: 12, color: T.DIM, align: 'center' });
    ui.endScroll();
  }
};

},
"src/screens/heroDetail.js":function(require,module,exports){
// 武将详情：属性/技能/装备/升星/上阵。等级统一由玩家经验提升。
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const heroes = require('../../utils/heroes');
const C = require('../../utils/config');
const F = require('../../utils/fmt');

module.exports = {
  name: 'heroDetail',
  scroll: {}, scrollReg: {},
  pickEquipSlot: null,
  showConvertConfirm: false,

  onEnter() {
    this.scroll = this.scroll || {};
    this.scroll.page = this.params && this.params.focus === 'ascend' ? 410 : 0;
    this.refresh();
  },
  refresh() {
    const id = this.params.id;
    const calc = store.calcHero(id);
    if (!calc) { app.pop(); return; }
    const def = heroes.getHero(id);
    const own = store.getState().roster[id];
    const maxStar = C.RARITIES[def.rarity].maxStar;
    const s = store.getState();
    this.v = {
      calc, def, own, maxStar,
      critText: Math.round((calc.stats.crit || 0.05) * 100) + '%',
      inFormation: s.formation.indexOf(id) >= 0,
      isTop5: false,
      effNote: '共享玩家等级',
      asc: store.ascendPreview(id),
      player: s.player
    };
  },

  update() { if (!this.v) this.refresh(); },

  draw() {
    app.pageHeader('武 将');
    if (!this.v) return;
    const { calc, def, own } = this.v;
    const scrollId = 'page';
    ui.beginScroll(this, scrollId, 0, 42, app.W, app.H - 42, this.contentH || 800);
    let y = 54;

    // 头部名片
    ui.panel(8, y, 359, 96, { ornate: true });
    ui.heroFace(18, y + 8, 80, calc, {});
    ui.text(def.name, 108, y + 8, { size: 20, bold: true });
    ui.text(T.RARITY[def.rarity].name, 108 + ui.textWidth(def.name, 20, true) + 8, y + 11, { size: 13, color: T.RARITY[def.rarity].color, bold: true });
    ui.text(def.title + ' · ' + T.FACTION[def.faction].name + ' · ' + ui.classNameOf(def.cls), 108, y + 34, { size: 11, color: T.DIM });
    ui.stars(108, y + 48, this.v.maxStar, own.star, 11);
    ui.text('全体共享 Lv.' + calc.level, 108, y + 62, { size: 12 });
    ui.text('战力 ' + F.fmtNum(calc.power), 108, y + 78, { size: 12, color: T.GOLD });
    y += 104;

    // 属性
    this.secTitle('属 性', y); y += 24;
    ui.panel(8, y, 359, 62);
    const stats = [['生命', calc.stats.hp], ['攻击', calc.stats.atk], ['防御', calc.stats.def],
      ['攻速', calc.stats.spd], ['暴击', this.v.critText], ['同名卡', own.cards + '张']];
    stats.forEach((st, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const sx = 20 + col * 118, sy = y + 10 + row * 26;
      ui.text(st[0], sx, sy, { size: 12, color: T.DIM });
      ui.text('' + st[1], sx + 44, sy, { size: 12 });
    });
    y += 72;

    // 技能
    this.secTitle('技 能', y); y += 24;
    ui.panel(8, y, 359, 54);
    ui.tag('必杀', 20, y + 8, T.GOLD_HI);
    ui.text(def.ult.name, 56, y + 8, { size: 13, color: T.GOLD, bold: true });
    ui.wrap(def.ult.desc, 20, y + 26, 330, 12, { size: 10 });
    y += 62;
    ui.panel(8, y, 359, 54);
    ui.tag('被动', 20, y + 8, T.DIM);
    ui.text(def.passive.name, 56, y + 8, { size: 13, color: T.GOLD, bold: true });
    ui.wrap(def.passive.desc, 20, y + 26, 330, 12, { size: 10 });
    y += 62;

    // 装备采用账号共享配置，新英雄立即获得整队军械属性。
    const armory = store.getArmoryBonuses();
    this.secTitle('全军共享军械', y); y += 24;
    ui.panel(8, y, 359, 64);
    ui.text('攻击 +' + Math.round(armory.atk * 100) + '%   生命 +' + Math.round(armory.hp * 100) + '%   防御 +' + Math.round(armory.def * 100) + '%', 20, y + 12, { size: 11, color: T.GOLD_HI, bold: true });
    ui.text('已享受当前军械，无需为武将单独配装', 20, y + 34, { size: 10, color: T.DIM });
    ui.btn(262, y + 9, 91, 38, { text: '军械图鉴 ›', style: 'ghost', size: 10, id: 'hero-armory', cb: () => app.push('armory') });
    y += 74;

    // 玩家等级由战斗成长；重复抽到同名武将时自动升星。
    this.secTitle('成 长', y); y += 24;
    ui.panel(8, y, 359, 114);
    const xpNeed = store.playerXpNeeded(this.v.player.level);
    ui.text('玩家等级 Lv.' + this.v.player.level + ' · 全体武将共用', 20, y + 10, { size: 12, color: T.GOLD_HI, bold: true });
    ui.bar(20, y + 30, 332, 7, this.v.player.level >= C.MAX_LEVEL ? 1 : this.v.player.exp / xpNeed, 'gold');
    ui.text(this.v.player.level >= C.MAX_LEVEL ? '等级已达上限' : '战斗经验 ' + F.fmtNum(this.v.player.exp) + ' / ' + F.fmtNum(xpNeed), 20, y + 43, { size: 10, color: T.DIM });
    ui.text(own.star >= this.v.maxStar ? '星级 ★' + own.star + ' / ★' + this.v.maxStar + ' · 已满星' : '星级 ★' + own.star + ' / ★' + this.v.maxStar, 20, y + 64, { size: 11, color: T.GOLD_HI });
    ui.text(own.star >= this.v.maxStar ? '满星后重复卡可兑换英雄碎片' : '抽到重复的 ' + def.name + ' 会自动升星，无需铜钱', 20, y + 83, { size: 10, color: T.DIM });
    y += 122;
    if (own.cards > 0) {
      ui.panel(8, y, 359, 52);
      ui.text((own.star >= this.v.maxStar ? '满星后额外卡 ' : '保留同名卡 ') + own.cards + ' 张' + (own.lockedCards ? ' · 已保护' : ''), 18, y + 10, { size: 11, color: T.GOLD_HI });
      ui.btn(172, y + 9, 82, 30, { text: own.lockedCards ? '取消保护' : '保护', style: 'ghost', size: 10, id: 'card-lock', cb: () => {
        const r = store.setCardsLocked(this.params.id, !own.lockedCards); if (r.ok) this.refresh();
      } });
      const canConvert = own.star >= this.v.maxStar && !own.lockedCards;
      ui.btn(260, y + 9, 94, 30, { text: '换 1 张碎片', style: 'plain', size: 10, disabled: !canConvert, id: 'card-convert', cb: () => this.convertOne() });
      y += 60;
    }
    ui.btn(20, y + 8, 160, 30, {
      text: this.v.inFormation ? '下 阵' : '上 阵', style: this.v.inFormation ? 'ghost' : 'gold', size: 13,
      id: 'form', cb: () => this.toggleFormation()
    });
    y += 42;
    this.contentH = y + 20;

    ui.endScroll();

    if (this.showConvertConfirm) this.drawConvertConfirm();
  },
  secTitle(t, y) {
    const ctx = ui.ctx;
    ctx.save();
    ctx.fillStyle = T.GOLD_DEEP;
    ctx.fillRect(8, y + 3, 3, 12);
    ui.text(t, 16, y + 2, { size: 13, color: T.GOLD, bold: true });
    ctx.restore();
  },
  convertOne() {
    const h = this.v.def, own = this.v.own;
    if (own.star < this.v.maxStar || own.lockedCards || own.cards < 1) { ui.toast('仅可兑换未保护的满星多余卡'); return; }
    const run = confirmHigh => {
      const r = store.convertCards([{ id: h.id, count: 1, confirmHigh }]);
      if (!r.ok) { ui.toast(r.msg); return; }
      this.refresh(); ui.toast('获得英雄碎片 ×' + r.shards);
    };
    if (h.rarity >= 3) {
      this.showConvertConfirm = true;
    } else run(false);
  },
  drawConvertConfirm() {
    const h = this.v.def, shards = h.rarity === 4 ? 60 : 15;
    const box = ui.modal('兑换高稀有度同名卡？', 44, 244, 287, 160);
    ui.setModalClose(() => { this.showConvertConfirm = false; });
    ui.wrap('消耗 ' + h.name + ' 1 张，获得英雄碎片 ×' + shards + '。兑换后不能撤回。', box.x, box.y + 6, box.w, 14, { size: 10 });
    ui.btn(box.x, box.y + 78, 124, 30, { text: '取消', style: 'ghost', size: 12, id: 'convert-cancel', cb: () => { this.showConvertConfirm = false; } });
    ui.btn(box.x + 136, box.y + 78, 124, 30, { text: '确认兑换', style: 'red', size: 12, id: 'convert-confirm', cb: () => {
      this.showConvertConfirm = false;
      const r = store.convertCards([{ id: h.id, count: 1, confirmHigh: true }]);
      if (!r.ok) ui.toast(r.msg); else ui.toast('获得英雄碎片 ×' + r.shards);
      this.refresh();
    } });
  },
  toggleFormation() {
    const id = this.params.id;
    const f = store.getState().formation;
    const idx = f.indexOf(id);
    if (idx >= 0) {
      if (f.filter(x => x).length <= 1) { ui.toast('至少保留一名上阵武将'); return; }
      store.setFormationSlot(idx, null);
      ui.toast('已下阵');
    } else {
      const empty = f.indexOf(null);
      if (empty < 0) { ui.toast('编队已满，请先调整'); app.push('formation'); return; }
      store.setFormationSlot(empty, id);
      ui.toast('已上阵');
    }
    this.refresh();
  },
};

},
"src/screens/heroes.js":function(require,module,exports){
// 群英录：全体武将共享玩家等级，网格展示个人星级与装备战力。
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const F = require('../../utils/fmt');

const FILTERS = [
  { key: 'all', name: '全部' }, { key: 'wei', name: '魏' }, { key: 'shu', name: '蜀' },
  { key: 'wu', name: '吴' }, { key: 'qun', name: '群' }
];
const SORTS = [
  { key: 'power', name: '战力' }, { key: 'level', name: '等级' },
  { key: 'rarity', name: '品质' }, { key: 'star', name: '品阶' }
];

module.exports = {
  name: 'heroes',
  scroll: {}, scrollReg: {},
  filter: 'all', sort: 'power',
  showStarterPick: false,

  onEnter(params) {
    store.checkDailyReset();
    this.showStarterPick = !!(params && params.focusFirstWin && store.firstWinChoice().available);
    this.refresh();
  },
  refresh() {
    let list = store.allRoster().map(h => ({ ...h, isTop5: false }));
    this.playerLevel = store.playerLevel();
    this.firstWinChoice = store.firstWinChoice();
    if (this.filter !== 'all') list = list.filter(h => h.faction === this.filter);
    const keyFn = {
      power: h => h.power,
      level: h => h.level,
      rarity: h => h.rarity * 100000 + h.power,
      star: h => h.star * 100000 + h.power
    }[this.sort];
    this.list = list.slice().sort((a, b) => keyFn(b) - keyFn(a));
  },

  draw() {
    app.resBar(10, ['gold', 'gem', 'scroll']);
    ui.text('英雄 · 群英录', 12, 44, { size: 20, color: T.GOLD_HI, bold: true });
    ui.text('点击英雄，查看技能、升级与装备', 12, 70, { size: 11, color: T.DIM });
    ui.btn(269, 43, 94, 34, {
      text: '调整编队', style: 'gold', size: 12, id: 'heroes-formation', cb: () => app.push('formation')
    });
    let y = 92;
    if (this.firstWinChoice.available) {
      ui.btn(8, y, 359, 32, { text: '首胜奖励：选择一名初始武将，自动升 1 星', style: 'gold', size: 12, id: 'starter-pick-open', cb: () => { this.showStarterPick = true; } });
      y += 40;
    }

    // 所有稀有度和星级统一使用玩家等级。
    ui.panel(8, y, 359, 42);
    ui.text('已拥有 ' + this.list.length + ' 名武将', 20, y + 8, { size: 13, color: T.GOLD_HI, bold: true });
    ui.text('共享玩家等级 Lv.' + this.playerLevel + ' · 新将可立即上阵', 20, y + 25, { size: 10, color: T.DIM });
    y += 50;

    // 阵营与排序分成两行，375 逻辑宽度下完整可见。
    ui.text('阵营', 12, y + 6, { size: 11, color: T.DIM });
    FILTERS.forEach((f, i) => {
      ui.chipBtn(52 + i * 63, y, 59, 26, f.name, this.filter === f.key, () => {
        this.filter = f.key; this.scroll.grid = 0; this.refresh();
      }, 'f-' + f.key);
    });
    y += 32;
    ui.text('排序', 12, y + 6, { size: 11, color: T.DIM });
    SORTS.forEach((so, i) => {
      ui.chipBtn(52 + i * 79, y, 74, 26, so.name + '↓', this.sort === so.key, () => {
        this.sort = so.key; this.scroll.grid = 0; this.refresh();
      }, 's-' + so.key);
    });
    y += 34;

    // 网格
    const cols = 3, gw = (359 - 2 * 8) / 3, gh = 157;
    const rows = Math.ceil(this.list.length / cols);
    const contentH = Math.max(136, rows * (gh + 8));
    ui.beginScroll(this, 'grid', 8, y, 359, app.H - y - 56, contentH);
    this.list.forEach((h, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const gx = 8 + col * (gw + 8);
      const gy = y + row * (gh + 8);
      const maxStar = [0, 2, 3, 4, 5][h.rarity];
      ui.panel(gx, gy, gw, gh, { ornate: h.rarity === 4 });
      ui.tap(gx, gy, gw, gh, () => app.push('heroDetail', { id: h.id }), 'hero-' + h.id);
      ui.heroFace(gx + (gw - 74) / 2, gy + 8, 74, h, {});
      ui.text(h.name, gx + 5, gy + 89, { size: 13, bold: true });
      ui.text(T.RARITY[h.rarity].name, gx + gw - 5, gy + 90, { size: 11, color: T.RARITY[h.rarity].color, bold: true, align: 'right' });
      ui.text(h.title, gx + 5, gy + 108, { size: 9, color: T.DIM });
      ui.stars(gx + 5, gy + 122, maxStar, h.star, 9);
      ui.text('Lv.' + h.level, gx + 5, gy + 139, { size: 10, color: T.GOLD });
      ui.text('战力 ' + F.fmtNum(h.power), gx + gw - 5, gy + 139, { size: 9, color: T.DIM, align: 'right' });
    });
    if (!this.list.length) {
      ui.text(this.filter === 'all' ? '还没有英雄，先去召唤一位吧' : '还未拥有这个阵营的英雄', 187, y + 28, { size: 12, color: T.DIM, align: 'center' });
      ui.btn(127, y + 58, 120, 36, { text: '前往召唤', style: 'gold', size: 13, id: 'heroes-summon', cb: () => app.switchTab('summon') });
    }
    ui.endScroll();
    if (this.showStarterPick) this.drawStarterPick();
  },
  drawStarterPick() {
    const ids = ['liubei', 'guanyu', 'zhangfei'];
    const close = () => { this.showStarterPick = false; };
    const box = ui.modal('首胜奖励 · 选择一名武将升星', 22, Math.max(94, (app.H - 236) / 2), 331, 236);
    ui.setModalClose(close);
    ui.tap(0, 0, app.W, app.H, close, 'starter-pick-mask');
    ids.forEach((id, i) => {
      const h = require('../../utils/heroes').getHero(id), x = box.x + 9 + i * 104, y = box.y + 34;
      ui.panel(x, y, 96, 132, { ornate: true });
      ui.heroFace(x + 16, y + 8, 64, { id, name: h.name, faction: h.faction, cls: h.cls, rarity: h.rarity }, {});
      ui.text(h.name, x + 48, y + 79, { size: 13, align: 'center', bold: true });
      ui.btn(x + 7, y + 94, 82, 30, { text: '选择', style: 'gold', size: 11, id: 'starter-pick-' + id, cb: () => {
        const r = store.claimFirstWinChoice(id);
        if (!r.ok) { ui.toast(r.msg); return; }
        close(); this.refresh(); ui.toast(h.name + ' 自动升至 ★' + r.star);
      } });
    });
  }
};

},
"src/screens/home.js":function(require,module,exports){
// 主城首页：先看到下一步，再进入召唤、英雄、背包等独立功能。
const { app, ui } = require('../app');
const ads = require('../ads');
const T = require('../theme');
const store = require('../../utils/store');
const stages = require('../../utils/stages');
const items = require('../../utils/items');
const C = require('../../utils/config');
const F = require('../../utils/fmt');
const progression = require('../../utils/progression');

module.exports = {
  name: 'home',
  scroll: {}, scrollReg: {}, showQuests: false, showIdle: false,
  onEnter() {
    store.checkDailyReset();
    this.showQuests = false; this.showIdle = false;
    this.refresh();
  },
  refresh() {
    const s = store.getState();
    const stageNo = s.campaign.cleared + 1;
    const info = stages.chapterOf(stageNo);
    this.view = {
      stageNo, stageName: info.name, isBoss: info.isBoss,
      myPower: F.fmtNum(store.teamPower()),
      formation: store.getFormationCalc(),
      quests: store.questList(), activePts: store.activePoints(),
      chests: items.ACTIVE_CHESTS.map((c, i) => ({
        ...c, idx: i, can: store.activePoints() >= c.need,
        claimed: s.daily.active.indexOf(i) >= 0
      }))
    };
    this.goal = progression.getNextGoal(s, store);
  },
  rewardText(r) {
    return [['gem', '元宝'], ['gold', '铜钱'], ['scroll', '招募令'], ['shard', '碎片'], ['iron', '精铁']]
      .filter(([k]) => r[k]).map(([k, n]) => n + '×' + F.fmtNum(r[k])).join(' · ');
  },
  update() {
    if (!this.view) this.refresh();
    this.idle = store.idlePending();
  },
  draw() {
    const v = this.view, s = store.getState();
    const idle = this.idle || store.idlePending();
    ui.text('挂机定三国', 14, 14, { size: 22, color: T.GOLD_HI, bold: true });
    ui.text('主城 · 征途从这里开始', 15, 41, { size: 10, color: T.DIM });
    ui.text('总战力 ' + v.myPower, 361, 23, { size: 12, color: T.GOLD, align: 'right' });
    app.resBar(62, ['gold', 'gem', 'scroll']);

    ui.beginScroll(this, 'home', 0, 94, 375, Math.max(80, app.H - 150), 690);
    let y = 94;
    const level = store.playerLevel(), player = s.player;
    const needXP = store.playerXpNeeded(level);
    ui.panel(12, y, 351, 68);
    ui.text('主公等级 Lv.' + level, 26, y + 10, { size: 16, color: T.GOLD_HI, bold: true });
    ui.text(level >= C.MAX_LEVEL ? '已达等级上限' : '全体武将同步成长', 349, y + 12, { size: 10, color: T.DIM, align: 'right' });
    ui.bar(26, y + 31, 323, 8, level >= C.MAX_LEVEL ? 1 : player.exp / needXP, 'gold');
    ui.text(level >= C.MAX_LEVEL ? '已达上限' : '战斗经验 ' + F.fmtNum(player.exp) + ' / ' + F.fmtNum(needXP), 26, y + 46, { size: 10, color: T.DIM });
    y += 78;
    // 主任务保留一个醒目的行动按钮。
    ui.panel(12, y, 351, 156, { ornate: true });
    this.cityBackdrop(y);
    ui.text('主线战役', 26, y + 14, { size: 10, color: T.GOLD });
    ui.text(v.stageName, 26, y + 36, { size: 19, color: T.GOLD_HI, bold: true });
    ui.text('第 ' + v.stageNo + ' 关' + (v.isBoss ? ' · 名将镇守' : ' · 继续你的三国征途'), 26, y + 64, { size: 11, color: T.TEXT });
    ui.text('通关越多，挂机收益越高', 26, y + 84, { size: 10, color: T.DIM });
    ui.btn(26, y + 106, 192, 38, { text: '出征  ›', style: 'red', size: 16, id: 'go-battle', cb: () => app.push('battle', { mode: 'campaign' }) });
    ui.btn(226, y + 106, 123, 38, { text: '练兵', sub: '胜利得经验', style: 'gold', size: 13, id: 'go-training', cb: () => app.push('battle', { mode: 'training' }) });
    y += 170;
    const entries = [
      { key: 'summon', glyph: '召', name: '召唤', desc: '获得新武将', hint: '招募令 ' + F.fmtNum(s.res.scroll), color: T.GOLD_HI },
      { key: 'heroes', glyph: '将', name: '英雄', desc: '升级与培养', hint: '已拥有 ' + Object.keys(s.roster).length + ' 将', color: '#9ec7ad' },
      { key: 'bag', glyph: '囊', name: '背包', desc: '资源与装备', hint: '查看我的物品', color: '#a8bfdf' }
    ];
    entries.forEach((e, i) => {
      const x = 12 + i * 121;
      ui.panel(x, y, 109, 98, { ornate: i === 0 });
      ui.tap(x, y, 109, 98, () => app.switchTab(e.key), 'home-' + e.key);

      ui.text(e.desc, x + 12, y + 49, { size: 11, color: T.TEXT });
      ui.text(e.hint, x + 12, y + 73, { size: 9, color: T.DIM });
    });
    y += 112;
    ui.panel(12, y, 351, 98);
    ui.text('挂机收益', 26, y + 12, { size: 15, color: T.GOLD_HI, bold: true });
    const mins = Math.floor(idle.hours * 60);

    ui.text(time, 349, y + 15, { size: 10, color: T.DIM, align: 'right' });
    ui.text('铜钱 ' + F.fmtNum(idle.gold) + '   招募令 ' + idle.scroll + '   精铁 ' + idle.iron, 26, y + 36, { size: 10, color: T.GOLD });
    ui.btn(26, y + 58, 196, 30, { text: '领取收益', style: 'gold', size: 12, id: 'idle-claim', disabled: !(idle.gold || idle.exp || idle.scroll || idle.iron), cb: () => this.claimIdle(false) });
    ui.btn(230, y + 58, 119, 30, { text: '加速 / 双倍', style: 'ghost', size: 11, id: 'idle-more', cb: () => { this.showIdle = true; } });
    y += 112;

  },
  cityBackdrop(y) {
    // 原创程序化城楼剪影，仅为装饰，不承担点击控件。
    const ctx = ui.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(217,169,78,0.07)';

    ctx.fillStyle = 'rgba(217,169,78,0.10)';
    [250, 292, 334].forEach((x, i) => {
      const roof = y + (i === 1 ? 41 : 57);
      ctx.fillRect(x - 12, roof + 10, 24, y + 96 - roof - 10);
      ctx.beginPath(); ctx.moveTo(x - 23, roof + 13); ctx.lineTo(x, roof); ctx.lineTo(x + 23, roof + 13); ctx.closePath(); ctx.fill();
    });

  },
  claimIdle(double) {
    const r = store.claimIdle(double);
    ui.toast((double ? '双倍收获：' : '已领取：') + this.rewardText(r));
    this.refresh(); this.update();
  },
  claimFreeRewards() {
    const r = store.claimFreeRewards();
    if (!r.ok) { ui.toast(r.msg || '领取失败'); return; }
    const text = this.rewardText(r.rewards);
    const quests = r.claimedQuestIds.length, chests = r.claimedChestIds.length;
    ui.toast(r.changed ? '一键收获：' + (text || '日常奖励已到账') + (quests || chests ? ' · 任务' + quests + '项/宝箱' + chests + '个' : '') : '暂无可领取收益');

    else if (a.type === 'heroDetail') app.push('heroDetail', { id: a.id, focus: a.focus });
    else if (a.type === 'armory') app.push('armory', a.boxQ ? { boxQ: a.boxQ } : { recommendations: a.recommendations });

    const s = store.getState(), left = ads.remaining('idle2x'), fast = ads.remaining('fast');
    const idle = this.idle || store.idlePending();
    const quick = C.idleRates(s.campaign.cleared);
    const quickText = '铜钱 +' + F.fmtNum(Math.floor(C.FAST_REWARD_HOURS * quick.gold)) + ' · 招募令 +' + Math.floor(C.FAST_REWARD_HOURS * quick.scrollPerHour);
    ui.wrap('离线也会积累收益，最多储存 ' + C.IDLE_CAP_HOURS + ' 小时。', b.x, b.y + 2, b.w, 17, { size: 12 });
    ui.btn(b.x, b.y + 44, b.w, 42, { text: '看广告 · 双倍领取', sub: '铜钱、招募令双倍；精铁正常领取 · 今日 ' + left + ' 次', style: 'gold', id: 'idle-ad2x', disabled: left <= 0 || !(idle.gold || idle.exp || idle.scroll), cb: () => ads.showRewarded('idle2x', () => this.claimIdle(true), msg => ui.toast(msg)) });
    ui.btn(b.x, b.y + 98, b.w, 42, { text: '快速收获 · ' + C.FAST_REWARD_COST + ' 元宝', sub: quickText + ' · 今日 ' + s.fast.count + '/' + C.FAST_REWARD_DAILY, style: 'plain', id: 'idle-fast', disabled: s.fast.count >= C.FAST_REWARD_DAILY, cb: () => { const r = store.fastReward(false); ui.toast(r.ok ? '快速收获：铜钱 +' + F.fmtNum(r.gold) + ' · 招募令 +' + r.scroll : r.msg); this.refresh(); } });
    ui.btn(b.x, b.y + 152, b.w, 42, { text: '看广告 · 免费快速收获', sub: quickText + ' · 今日剩余 ' + fast + ' 次', style: 'ghost', id: 'idle-adfast', disabled: fast <= 0, cb: () => ads.showRewarded('fast', () => { const r = store.fastReward(true); ui.toast(r.ok ? '快速收获：铜钱 +' + F.fmtNum(r.gold) + ' · 招募令 +' + r.scroll : r.msg); this.refresh(); }, msg => ui.toast(msg)) });
    ui.btn(b.x, b.y + 208, b.w, 34, { text: '返回' + (this.name === 'campaign' ? '战役' : '主城'), id: 'idle-close', cb: close });
  },
  drawQuests() {
    const v = this.view, close = () => { this.showQuests = false; this.refresh(); };
    ui.setModalClose(close);
    const h = Math.min(580, app.H - 32), y = (app.H - h) / 2;
    const b = ui.modal('每日任务', 16, y, 343, h);
    const viewH = b.h - 44, contentH = v.quests.length * 60 + 126;
    ui.beginScroll(this, 'quests', b.x, b.y, b.w, viewH, contentH);
    let rowY = b.y;
    v.quests.forEach(q => {
      ui.text(q.name, b.x, rowY + 4, { size: 13 });
      ui.text(q.count + '/' + q.target, b.x + b.w - 82, rowY + 7, { size: 10, color: T.DIM, align: 'right' });
      ui.wrap(this.rewardText(q.reward), b.x, rowY + 26, b.w - 82, 13, { size: 9 });
      ui.btn(b.x + b.w - 68, rowY + 5, 64, 34, { text: q.claimed ? '已领取' : (q.done ? '领取' : '未完成'), style: q.done && !q.claimed ? 'gold' : 'ghost', size: 11, disabled: q.claimed || !q.done, id: 'q-' + q.id, cb: () => { const r = store.claimQuest(q.id); ui.toast(r.ok ? '已领取' : r.msg || '无法领取'); this.refresh(); } });
      rowY += 60;
    });
    ui.text('活跃度 ' + Math.min(100, v.activePts) + ' · 活跃宝箱', b.x, rowY + 2, { size: 13, color: T.GOLD });
    const w = (b.w - 16) / 3;
    v.chests.forEach((c, i) => {
      const x = b.x + i * (w + 8);
      ui.btn(x, rowY + 30, w, 44, { text: c.need + ' 活跃', sub: c.claimed ? '已领取' : c.can ? '领取宝箱' : '未达成', style: c.can && !c.claimed ? 'gold' : 'ghost', size: 12, disabled: c.claimed || !c.can, id: 'chest-' + i, cb: () => { const r = store.claimActiveChest(c.idx); ui.toast(r.ok ? '宝箱已开启' : r.msg || '无法领取'); this.refresh(); } });
      ui.wrap(this.rewardText(c.reward), x + 2, rowY + 80, w - 4, 12, { size: 9 });
    });
    ui.endScroll();
    ui.btn(b.x, y + h - 46, 154, 34, { text: '领取全部日常', style: 'gold', id: 'quests-claim-all', cb: () => {
      const r = store.claimAllDailyRewards();
      if (!r.ok) ui.toast(r.msg || '领取失败');
      else ui.toast(r.changed ? '日常已领取：' + (this.rewardText(r.rewards) || '奖励到账') : '暂无可领取日常');
      this.refresh();
    } });
    ui.btn(b.x + 164, y + h - 46, b.w - 164, 34, { text: '返回' + (this.name === 'campaign' ? '战役' : '主城'), id: 'quests-close', cb: close });
  }
};

"src/screens/shop.js":function(require,module,exports){
// 集市：每日限购商品 + 自选卡兑换
const { app, ui } = require('../app');
const T = require('../theme');
const store = require('../../utils/store');
const items = require('../../utils/items');
const heroes = require('../../utils/heroes');
const F = require('../../utils/fmt');

const CUR_ICON = { gold: '🪙', gem: '💵', scroll: '📜', token: '🎫', shard: '💠' };

module.exports = {
  name: 'shop',
  scroll: {}, scrollReg: {},
  pickList: null, pickRarity: 0,

  onEnter(params) {
    store.checkDailyReset();
    this.refresh();
    const rarity = params && Number(params.pickRarity);
    if ((rarity === 3 && store.getState().vouchers.sr > 0) || (rarity === 4 && store.getState().vouchers.ssr > 0)) this.openVoucher(rarity);
  },
  refresh() {
    const s = store.getState();
    this.goods = items.SHOP_GOODS.map(g => {
      const bought = s.buyLog.buys[g.id] || 0;
      return {
        ...g,
        priceText: F.fmtNum(g.price),
        soldOut: bought >= g.limit,
        bought,
        afford: s.res[g.cur] >= g.price,
        isPick: !!(g.give.srPick || g.give.ssrPick)
      };
    });
  },

  draw() {
    app.pageHeader('集 市');
    app.resBar(48, ['gold', 'gem', 'scroll', 'token', 'shard']);
    let y = 76;
    ui.text('今 日 商 品（每日刷新）', 12, y, { size: 13, color: T.GOLD, bold: true });
    y += 22;
    ui.text('待用自选券：SR ' + store.getState().vouchers.sr + ' · SSR ' + store.getState().vouchers.ssr, 12, y, { size: 10, color: T.DIM });
    const vouchers = store.getState().vouchers;
    if (vouchers.sr || vouchers.ssr) {
      if (vouchers.sr) ui.btn(12, y + 17, 170, 28, { text: '使用 SR 自选券 ×' + vouchers.sr, style: 'gold', size: 10, id: 'use-sr-voucher', cb: () => this.openVoucher(3) });
      if (vouchers.ssr) ui.btn(190, y + 17, 173, 28, { text: '使用 SSR 自选券 ×' + vouchers.ssr, style: 'gold', size: 10, id: 'use-ssr-voucher', cb: () => this.openVoucher(4) });
    }
    y += vouchers.sr || vouchers.ssr ? 51 : 18;

    const contentH = this.goods.length * 56 + 30;
    ui.beginScroll(this, 'goods', 8, y, 359, app.H - y - 8, contentH);
    this.goods.forEach((g, i) => {
      const gy = y + i * 56;
      ui.panel(8, gy, 359, 50, {});
      const rarColor = g.give && g.give.ssrPick ? T.RARITY[4].color : (g.give && g.give.srPick ? T.RARITY[3].color : null);
      ui.text(g.name, 20, gy + 8, { size: 13, color: rarColor || undefined });
      if (g.isPick) ui.tag('自选', 20 + ui.textWidth(g.name, 13) + 8, gy + 8, T.GOLD);
      ui.text('限购 ' + g.bought + '/' + g.limit, 20, gy + 28, { size: 10, color: T.DIM });
      ui.btn(258, gy + 10, 98, 30, {
        text: g.soldOut ? '售罄' : CUR_ICON[g.cur] + ' ' + g.priceText,
        style: 'gold', size: 12, disabled: g.soldOut || !g.afford, id: 'buy-' + g.id,
        cb: () => this.buy(g)
      });
    });
    ui.wrap('满星后的同名卡可兑换碎片；演武令通过演武场切磋获得。关闭自选窗口不会消耗自选券。', 20, y + contentH, 340, 13, { size: 10 });
    ui.endScroll();

    if (this.pickList) this.drawPick();
  },
  buy(g) {
    const r = store.buyGood(g.id);
    if (!r.ok) { ui.toast(r.msg || '购买失败'); return; }
    if (g.give.ssrPick || g.give.srPick) {
      this.pickRarity = g.give.ssrPick ? 4 : 3;
      this.buildPickList();
    } else {
      ui.toast('购买成功');
    }
    this.refresh();
  },
  openVoucher(rarity) {
    const key = rarity === 4 ? 'ssr' : 'sr';
    if (!(store.getState().vouchers[key] > 0)) { ui.toast('自选券不足'); return; }
    this.pickRarity = rarity;
    this.buildPickList();
  },
  buildPickList() {
    this.pickList = heroes.HEROES.filter(h => h.rarity === this.pickRarity).map(h => ({
      id: h.id, name: h.name, surname: h.name.slice(0, 1), title: h.title,
      faction: h.faction, cls: h.cls, rarity: h.rarity, level: 1, star: 0, power: 0
    }));
  },
  drawPick() {
    const box = ui.modal(this.pickRarity === 4 ? '自 选 SSR 名 将' : '自 选 SR 名 将', 30, 130, 315, 460);
    ui.setModalClose(() => { this.pickList = null; });
    ui.tap(0, 0, app.W, app.H, () => { this.pickList = null; }, 'pick-mask');
    const cols = 3, cw = (box.w - 16) / 3, chh = 104;
    const rows = Math.ceil(this.pickList.length / cols);
    ui.beginScroll(this, 'ssrpick', box.x, box.y, box.w, box.h, rows * (chh + 8));
    this.pickList.forEach((h, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = box.x + col * (cw + 8);
      const y = box.y + row * (chh + 8);
      ui.panel(x, y, cw, chh, { ornate: h.rarity === 4 });
      ui.tap(x, y, cw, chh, () => {
      const picked = store.useChoiceVoucher(this.pickRarity, h.id);
      if (!picked.ok) { ui.toast(picked.msg); return; }
      this.pickList = null;
      ui.toast(picked.isNew ? '解锁 ' + h.name + '，共享 Lv.' + picked.level : picked.autoStar ? h.name + ' 自动升至 ★' + picked.star : h.name + ' 已满星，额外卡 +1');
        this.refresh();
      }, 'ssrpick-' + h.id);
      ui.heroFace(x + 5, y + 5, cw - 10, h, {});
      ui.text(h.name, x + 5, y + 62, { size: 12, bold: true });
      ui.text(h.title, x + 5, y + 78, { size: 9, color: T.DIM });
      ui.text(T.FACTION[h.faction].name, x + cw - 5, y + 78, { size: 10, color: T.FACTION[h.faction].color, align: 'right' });
    });
    ui.endScroll();
  }
};

},
"src/screens/summon.js":function(require,module,exports){
// 点将台：招募单抽/十连、元宝十连、固定概率公示、翻牌揭示
const { app, ui } = require('../app');
const ads = require('../ads');
const T = require('../theme');
const store = require('../../utils/store');
const heroes = require('../../utils/heroes');
const C = require('../../utils/config');
const F = require('../../utils/fmt');

module.exports = {
  name: 'summon',
  scroll: {}, scrollReg: {},
  result: null, revealCount: 0, revealTimer: 0, busy: false,

  onEnter() { this.refresh(); },
  refresh() {
    const s = store.getState();
    this.sm = s.summon;
  },
  update(dt) {
    if (this.result && this.revealCount < this.result.length) {
      this.revealTimer += dt;
      const need = this.result.length > 1 ? 0.16 : 0.4;
      while (this.revealTimer >= need && this.revealCount < this.result.length) {
        this.revealTimer -= need;
        this.revealCount++;
      }
    } else if (this.result) {
      this.busy = false;
    }
  },

  draw() {
    app.resBar(10, ['gem', 'scroll']);
    let y = 40;

    // 主视觉
    ui.panel(8, y, 359, 150, { ornate: true });
    const ctx = ui.ctx;
    const cx = 187, cy = y + 66;
    const pulse = 0.5 + 0.5 * Math.sin(ui.time * 2.4);
    ctx.save();
    ctx.strokeStyle = 'rgba(240,207,138,' + (0.25 + pulse * 0.25) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 44 + pulse * 4, 0, Math.PI * 2);
    ctx.stroke();
    const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, 70);
    g.addColorStop(0, 'rgba(240,201,100,' + (0.16 + pulse * 0.1) + ')');
    g.addColorStop(1, 'rgba(240,201,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI * 2); ctx.fill();
    // 旋转光线
    ctx.translate(cx, cy);
    ctx.rotate(ui.time * 0.6);
    ctx.strokeStyle = 'rgba(217,169,78,0.10)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, 62); ctx.stroke();
    }
    ctx.restore();
    ui.text('召唤 · 点将台', cx, y + 14, { size: 22, color: T.GOLD_HI, bold: true, align: 'center' });
    ui.text('聚天下英杰 · 成千秋霸业', cx, y + 42, { size: 10, color: T.DIM, align: 'center' });
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ui.time * 1.2);
    ctx.font = T.font(22);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = T.GOLD;
    ctx.fillText('☯', 0, 0);
    ctx.restore();
    ui.text('概率 SSR 2% · SR 10% · R 28% · N 60%', 187, y + 128, { size: 10, color: T.DIM, align: 'center' });
    y += 158;

    // 概率图例（四色稀有度）
    ui.panel(8, y, 359, 56);
    ui.text('武将池 · 120 将 · 固定概率，无保底', 20, y + 8, { size: 10, color: T.DIM });
    const legend = [T.RARITY[4], T.RARITY[3], T.RARITY[2], T.RARITY[1]];
    legend.forEach((r, i) => {
      const lx = 20 + i * 88;
      ctx.fillStyle = r.color;
      ctx.fillRect(lx, y + 24, 10, 10);
      ui.text(r.name, lx + 15, y + 24, { size: 11, color: r.color, bold: true, baseline: 'top' });
    });

    ui.btn(8, y, 110, 46, { text: '招募 ×1', sub: '📜 招募令 ×1', style: 'ghost', size: 14, id: 'pull1', cb: () => this.pull('scroll1') });
    ui.btn(126, y, 113, 46, { text: '招募 ×10', sub: '📜 招募令 ×10', style: 'gold', size: 14, id: 'pull10', cb: () => this.pull('scroll10') });
    ui.btn(247, y, 112, 46, { text: '元宝十连', sub: '💵 ' + C.GACHA.costTenGold, style: 'gold', size: 14, id: 'pullG', cb: () => this.pull('gem10') });
    y += 54;

    const adLeft = ads.remaining('summon');

      id: 'ad-summon', disabled: adLeft <= 0,

          store.applyReward({ scroll: 1 });

          this.refresh();
        }, (msg) => ui.toast(msg));
      }
    });

    // 结果弹层
    if (this.result) this.drawResult();
  },

  pull(type) {
    if (this.busy) return;
    const r = store.doSummon(type);
    if (!r.ok) { ui.toast(r.msg); return; }
    this.result = r.results.map(x => {
      const def = heroes.getHero(x.id);
      return {
        ...x, name: def.name, surname: def.name.slice(0, 1),
        faction: def.faction, rarity: def.rarity, title: def.title
      };
    });
    this.scroll.result = 0;
    this.revealCount = 0;
    this.revealTimer = 0;
    this.busy = true;
    this.refresh();
  },
  drawResult() {
    const list = this.result;
    // 结果窗口和底部确认固定在导航栏上方，短屏只滚动卡片。
    const close = () => {
      if (!this.busy) { this.result = null; this.refresh(); }
    };
    ui.setModalClose(close);
    ui.modal('召唤结果 · ' + list.length + ' 名英雄', 8, 24, 359, app.H - 88);
    ui.tap(8, 24, 359, app.H - 88, () => {}, 'summon-result-panel');
    ui.text('新英雄直接入队；抽到重复武将自动升星，无需铜钱', 187, 61, { size: 10, color: T.DIM, align: 'center' });
    const cols = list.length > 1 ? 3 : 1;
    const cw = 90, chh = 106, gap = 10;
    const totalW = Math.min(cols, list.length) * (cw + gap) - gap;
    const x0 = (app.W - totalW) / 2;
    const y0 = 86;
    const contentH = Math.ceil(list.length / cols) * (chh + gap) - gap;
    const viewH = Math.min(contentH, app.H - 216);
    ui.beginScroll(this, 'result', 20, y0, 335, viewH, contentH);
    list.forEach((r, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = x0 + col * (cw + gap);
      const y = y0 + row * (chh + gap);
      const revealed = i < this.revealCount;
      ui.panel(x, y, cw, chh, {});
      if (!revealed) {
        // 卡背
        const ctx2 = ui.ctx;
        ctx2.save();
        const g = ctx2.createLinearGradient(0, y, 0, y + chh);
        g.addColorStop(0, '#3a2b18'); g.addColorStop(1, '#241a10');
        roundRectFill(ui, x + 2, y + 2, cw - 4, chh - 4, 6, g);
        ctx2.strokeStyle = 'rgba(217,169,78,0.2)';
        ctx2.lineWidth = 1;
        for (let d = -chh; d < cw; d += 7) {
          ctx2.beginPath();
          ctx2.moveTo(x + Math.max(0, d), y + Math.max(0, -d));
          ctx2.lineTo(x + Math.min(cw, d + chh), y + Math.min(chh, cw - d + chh > chh ? chh : cw - d + chh));
          ctx2.stroke();
        }
        ctx2.font = T.font(30, true);
        ctx2.fillStyle = 'rgba(240,207,138,0.8)';
        ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
        ctx2.fillText('?', x + cw / 2, y + chh / 2);
        ctx2.restore();
      } else {
        const fac = T.FACTION[r.faction];
        const rar = T.RARITY[r.rarity];
        let ctx2 = ui.ctx;
        ctx2.save();
        const g = ctx2.createLinearGradient(0, y, 0, y + chh);
        g.addColorStop(0, fac.fill);
        g.addColorStop(1, 'rgba(0,0,0,0.4)');
        roundRectFill(ui, x + 2, y + 2, cw - 4, chh - 4, 6, g);
        ctx2.restore();
        ui.panel(x, y, cw, chh, { fill: 'rgba(0,0,0,0)' });
        ctx2 = ui.ctx;
        ctx2.save();
        roundRectPath2(ui, x + 1.5, y + 1.5, cw - 3, chh - 3, 6);
        ctx2.strokeStyle = rar.frame;
        ctx2.lineWidth = 2;
        ctx2.stroke();
        if (r.rarity === 4) {
          ctx2.shadowColor = 'rgba(240,185,94,0.9)';
          ctx2.shadowBlur = 14;
          ctx2.stroke();
        }
        ctx2.restore();
        ui.text(r.surname, x + cw / 2, y + 22, { size: 30, bold: true, align: 'center', color: '#fff6e0' });
        ui.text(r.name, x + cw / 2, y + 62, { size: 13, bold: true, align: 'center' });
        ui.text(rar.name, x + cw / 2, y + 78, { size: 12, color: rar.color, bold: true, align: 'center' });
        if (r.isNew) {
          roundRectFill(ui, x + cw - 30, y + 4, 26, 13, 4, 'rgba(192,138,62,0.95)');
          ui.text('NEW', x + cw - 17, y + 6.5, { size: 8, color: '#3a2408', bold: true, align: 'center', baseline: 'top' });
        } else if (r.autoStar) {
          roundRectFill(ui, x + cw - 38, y + 4, 34, 13, 4, 'rgba(192,138,62,0.95)');
          ui.text('升至★' + r.star, x + cw - 21, y + 6.5, { size: 8, color: '#3a2408', bold: true, align: 'center', baseline: 'top' });
        } else {
          roundRectFill(ui, x + cw - 32, y + 4, 28, 13, 4, 'rgba(0,0,0,0.6)');
          ui.text('满星+1', x + cw - 18, y + 6.5, { size: 7, color: T.DIM, align: 'center', baseline: 'top' });
        }
      }
    });
    ui.endScroll();
    const buttonY = app.H - 106;
    if (contentH > viewH) ui.text('上下滑动查看全部英雄', 187, buttonY - 19, { size: 10, color: T.DIM, align: 'center' });
    ui.btn(117, buttonY, 140, 34, {
      text: this.busy ? '揭示中…' : '确 定', style: 'gold', size: 14, disabled: this.busy, id: 'summon-ok',
      cb: () => { this.result = null; this.refresh(); }
    });
  }
};
function roundRectFill(uiIns, x, y, w, h, r, style) {
  const ctx = uiIns.ctx;
  roundRectPath2(uiIns, x, y, w, h, r);
  ctx.fillStyle = style;
  ctx.fill();
}
function roundRectPath2(uiIns, x, y, w, h, r) {
  const ctx = uiIns.ctx;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}

},

"src/ui.js":function(require,module,exports){
// 轻量 Canvas UI 框架（IMGUI 风格：每帧重绘 + 命中区注册）
const T = require('./theme');

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}

const ui = {
  ctx: null, W: 375, H: 812,
  hitAreas: [],      // {x,y,w,h,cb,id} 每帧由绘制顺序注册
  dragAreas: [],     // 滚动区域 {x,y,w,h,key,scene}
  pressedId: null,
  touch: null,       // 当前触摸 {sx,sy,x,y,moved,dragKey}
  floaters: [],
  toastMsg: null, toastUntil: 0,
  time: 0,

  begin(ctx, W, H, dt) {
    this.ctx = ctx; this.W = W; this.H = H;
    this.hitAreas = []; this.dragAreas = [];
    this.scrollState = null;
    this.modalActive = false;
    this._modalClose = null;
    this.time += dt;
  },

  // ---------- 触摸（由 app 层喂入） ----------
  onTouchStart(x, y) {
    this.touch = { sx: x, sy: y, x, y, moved: false, dragKey: null, dragScene: null };
    // 命中滚动区域（后注册者优先）
    for (let i = this.dragAreas.length - 1; i >= 0; i--) {
      const d = this.dragAreas[i];
      if (x >= d.x && x <= d.x + d.w && y >= d.y && y <= d.y + d.h) {
        this.touch.dragKey = d.key; this.touch.dragScene = d.scene;
        this.touch.startScroll = d.scene.scroll[d.key] || 0;
        break;
      }
    }
    // 按钮按下态
    const hit = this.hitAt(x, y);
    if (hit) this.pressedId = hit.id;
  },
  onTouchMove(x, y) {
    if (!this.touch) return;
    this.touch.x = x; this.touch.y = y;
    this._updateTouchScroll(this.touch, x, y);
  },
  _updateTouchScroll(touch, x, y) {
    if (Math.abs(x - touch.sx) > 6 || Math.abs(y - touch.sy) > 6) touch.moved = true;
    if (!touch.dragKey || !touch.moved) return;
    const scene = touch.dragScene;
    const reg = scene.scrollReg[touch.dragKey] || {};
    const max = Math.max(0, (reg.contentH || 0) - (reg.viewH || 0));
    const offset = touch.startScroll - (y - touch.sy);
    scene.scroll[touch.dragKey] = Math.max(0, Math.min(max, offset));
  },
  onTouchEnd(x, y) {
    if (!this.touch) return;
    const t = this.touch;
    // Some runtimes coalesce a fast swipe into start/end events without a move event.
    // Apply the final displacement here as well so scrolling never depends on move cadence.
    this._updateTouchScroll(t, x, y);
    this.touch = null;
    const wasPressed = this.pressedId; this.pressedId = null;
    if (!t.moved) {
      const hit = this.hitAt(x, y);
      if (hit && hit.id === wasPressed && hit.cb) hit.cb();
    }
  },
  hitAt(x, y) {
    for (let i = this.hitAreas.length - 1; i >= 0; i--) {
      const a = this.hitAreas[i];
      if (!a.cb) continue;
      if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) return a;
    }
    return null;
  },

  tap(x, y, w, h, cb, id) {
    const st = this.scrollState;
    if (st) {
      y -= st.off;
      const right = Math.min(x + w, st.x + st.w);
      const bottom = Math.min(y + h, st.y + st.h);
      x = Math.max(x, st.x); y = Math.max(y, st.y);
      w = right - x; h = bottom - y;
      if (w <= 0 || h <= 0) return;
    }
    this.hitAreas.push({ x, y, w, h, cb, id: id || ('z' + this.hitAreas.length) });
  },

  // ---------- 基础绘制 ----------
  panel(x, y, w, h, opts) {
    const ctx = this.ctx;
    opts = opts || {};
    ctx.save();
    roundRectPath(ctx, x, y, w, h, opts.r === undefined ? 8 : opts.r);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, T.PANEL_HI); g.addColorStop(1, T.PANEL_LO);
    ctx.fillStyle = opts.fill || g;
    ctx.fill();
    ctx.strokeStyle = opts.ornate ? T.LINE_HI : T.LINE;
    ctx.lineWidth = 1;
    ctx.stroke();
    if (opts.ornate) {
      roundRectPath(ctx, x + 2, y + 2, w - 4, h - 4, (opts.r || 8) - 1);
      ctx.strokeStyle = 'rgba(138,106,51,0.25)';
      ctx.stroke();
    }
    ctx.restore();
  },
  text(str, x, y, opts) {
    if (str === undefined || str === null) return 0;
    const ctx = this.ctx;
    opts = opts || {};
    const size = opts.size || 14;
    ctx.save();
    ctx.font = T.font(size, opts.bold);
    ctx.fillStyle = opts.color || T.TEXT;
    ctx.textBaseline = opts.baseline || 'top';
    ctx.textAlign = opts.align || 'left';
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
    ctx.fillText('' + str, x, y);
    ctx.restore();
    return this.textWidth(str, size, opts.bold);
  },
  textWidth(str, size, bold) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = T.font(size || 14, bold);
    const w = ctx.measureText('' + str).width;
    ctx.restore();
    return w;
  },
  wrap(str, x, y, maxW, lineH, opts) {
    const ctx = this.ctx;
    opts = opts || {};
    const size = opts.size || 13;
    ctx.save();
    ctx.font = T.font(size, opts.bold);
    ctx.fillStyle = opts.color || T.DIM;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    let line = '', yy = y;
    // ASCII 词（数字/英文/百分号）不拆行：断行点落在词中间时整词移到下一行
    const asciiRun = s => (s.match(/[A-Za-z0-9%.+]+$/) || [''])[0];
    for (const ch of ('' + str)) {
      if (ctx.measureText(line + ch).width > maxW && line) {
        const run = asciiRun(line);
        if (run.length > 1 && run.length < line.length) {
          ctx.fillText(line.slice(0, line.length - run.length), x, yy);
          line = run + ch;
        } else {
          ctx.fillText(line, x, yy);
          line = ch;
        }
        yy += lineH;
      } else line += ch;
    }
    if (line) { ctx.fillText(line, x, yy); yy += lineH; }
    ctx.restore();
    return yy - y;
  },
  bar(x, y, w, h, pct, style) {
    const ctx = this.ctx;
    pct = Math.max(0, Math.min(1, pct || 0));
    ctx.save();
    roundRectPath(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,69,42,0.8)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (pct > 0.01) {
      const colors = {
        gold: ['#b8842e', '#f0cf8a'], green: ['#3f9e5f', '#7fd0a8'],
        red: ['#a33420', '#e86a4a'], blue: ['#3b6ea5', '#7fb0e8']
      }[style || 'green'] || ['#3f9e5f', '#7fd0a8'];
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
      roundRectPath(ctx, x + 1, y + 1, Math.max(h - 2, (w - 2) * pct), h - 2, (h - 2) / 2);
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.restore();
  },

  // ---------- 按钮 ----------
  BTN_STYLE: {
    jade: { g: ['#54877a', '#2e6258'], border: '#cbd9a0', color: '#fff3cf' },
    gold: { g: ['#f0cd7c', '#c08a3e'], border: '#f4dd9e', color: '#3a2408' },
    red: { g: ['#d4553a', '#96291a'], border: '#e88a6a', color: '#ffe8d8' },
    ghost: { g: ['rgba(217,169,78,0.08)', 'rgba(217,169,78,0.04)'], border: T.LINE_HI, color: T.GOLD },
    plain: { g: ['#3a2b18', '#2b1f11'], border: T.LINE_HI, color: T.TEXT }
  },
  btn(x, y, w, h, opts) {
    const ctx = this.ctx;
    const st = this.BTN_STYLE[opts.style || 'plain'];
    const disabled = !!opts.disabled;
    this.tap(x, y, w, h, disabled ? null : opts.cb, opts.id);
    const pressed = !disabled && this.pressedId === opts.id;
    ctx.save();
    if (disabled) ctx.globalAlpha = 0.45;
    roundRectPath(ctx, x, y, w, h, opts.r === undefined ? 6 : opts.r);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, st.g[0]); g.addColorStop(1, st.g[1]);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = st.border; ctx.lineWidth = 1; ctx.stroke();
    if (pressed) { ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill(); }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = x + w / 2;
    if (opts.sub) {
      ctx.font = T.font(opts.size || 15, true);
      ctx.fillStyle = st.color;
      ctx.fillText(opts.text, cx, y + h / 2 - 7);
      ctx.font = T.font(9, false);
      ctx.fillStyle = opts.subColor || (st.color === '#3a2408' ? 'rgba(58,36,8,0.75)' : T.DIM);
      ctx.fillText(opts.sub, cx, y + h / 2 + 9);
    } else {
      ctx.font = T.font(opts.size || 14, opts.style === 'gold' || opts.style === 'red');
      ctx.fillStyle = st.color;
      ctx.fillText(opts.text, cx, y + h / 2 + 0.5);
    }
    ctx.restore();
  },
  chipBtn(x, y, w, h, text, active, cb, id) {
    const ctx = this.ctx;
    this.tap(x, y, w, h, cb, id);
    ctx.save();
    roundRectPath(ctx, x, y, w, h, h / 2);
    ctx.fillStyle = active ? 'rgba(217,169,78,0.16)' : 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.strokeStyle = active ? T.GOLD : T.LINE;
    ctx.stroke();
    ctx.font = T.font(11, active);
    ctx.fillStyle = active ? T.GOLD_HI : T.DIM;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
    ctx.restore();
  },

  tag(text, x, y, color) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = T.font(9);
    const w = this.textWidth(text, 9) + 10;
    roundRectPath(ctx, x, y, w, 14, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.strokeStyle = color || T.LINE;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = color || T.TEXT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

  },

  // ---------- 武将脸谱 ----------
  heroFace(x, y, size, calc, opts) {

    for (let i = -size; i < size * 2; i += 8) {
      ctx.beginPath();
      ctx.moveTo(x + i, y + size);
      ctx.lineTo(x + i + size, y);

    ctx.restore();
    roundRectPath(ctx, x + 1, y + 1, size - 2, size - 2, size * 0.16);
    ctx.strokeStyle = rar.frame || T.LINE;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = T.font(size * 0.52, true);
    ctx.fillStyle = 'rgba(255,246,224,0.96)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
    ctx.fillText(calc.surname || (calc.name || '?').slice(0, 1), x + size / 2, y + size / 2 + 1);
    ctx.restore();
    if (opts.mark) {
      ctx.save();
      ctx.font = T.font(8);
      const w = this.textWidth(opts.mark, 8) + 8;
      roundRectPath(ctx, x + size - w - 2, y + 3, w, 12, 6);
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
      ctx.strokeStyle = T.LINE_HI; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = T.GOLD_HI;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(opts.mark, x + size - w / 2 - 2, y + 9.5);
      ctx.restore();
    }
  },
  stars(x, y, maxStar, star, size) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = T.font(size || 10);
    ctx.textBaseline = 'top';
    for (let i = 1; i <= 5; i++) {
      if (i <= star) ctx.fillStyle = '#f0c964';
      else if (i <= maxStar) ctx.fillStyle = 'rgba(200,170,110,0.35)';
      else ctx.fillStyle = 'rgba(120,100,70,0.35)';
      ctx.fillText('★', x + (i - 1) * (size || 10) * 1.05, y);
    }
    ctx.restore();
  },
  classNameOf(cls) {
    return { warrior: '武将', tank: '猛将', mage: '军师', archer: '神射', support: '辅助' }[cls] || cls;
  },
  classIconOf(cls) {
    return { warrior: '⚔', tank: '🛡', mage: '✦', archer: '🏹', support: '☯' }[cls] || '';
  },

  // ---------- 滚动区域 ----------
