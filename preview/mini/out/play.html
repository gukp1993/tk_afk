    scene.scrollReg = scene.scrollReg || {};
    scene.scrollReg[key] = { contentH, viewH: h };
    const off = Math.max(0, Math.min(scene.scroll[key] || 0, Math.max(0, contentH - h)));
    scene.scroll[key] = off;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.translate(0, -off);
    this.dragAreas.push({ x, y, w, h, key, scene });
    this.scrollState = { key, x, y, w, h, contentH, off, scene };
    return off;
  },
  endScroll() {
    const st = this.scrollState;
    if (!st) return;
    const ctx = this.ctx;
    ctx.restore();
    // 滚动条
    const max = Math.max(1, st.contentH - st.h);
    const off = st.scene.scroll[st.key] || 0;
    if (st.contentH > st.h) {
      const bh = Math.max(20, st.h * st.h / st.contentH);
      const by = st.y + (st.h - bh) * (off / max);
      const ctx2 = this.ctx;
      ctx2.save();
      roundRectPath(ctx2, st.x + st.w - 3, by, 3, bh, 1.5);
      ctx2.fillStyle = 'rgba(217,169,78,0.35)';
      ctx2.fill();
      ctx2.restore();
    }
    this.scrollState = null;
  },

  // ---------- 弹窗 ----------
  // 返回内容区 {x,y,w,h}；点击遮罩关闭
  modal(title, x, y, w, h, closable) {
    const ctx = this.ctx;
    this.modalActive = true;
    this.hitAreas = [];
    this.dragAreas = [];
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, this.W, this.H);
    ctx.restore();
    // 兼容场景在 modal() 前后注册关闭回调；点击时读取本帧回调。
    this.tap(0, 0, this.W, this.H, () => {
      if (closable !== false && this._modalClose) this._modalClose();
    }, 'mask-' + title);
    this.panel(x, y, w, h, { ornate: true, r: 10 });
    this.tap(x, y, w, h, () => {}, 'modal-body-' + title);
    if (title) {
      this.text(title, x + w / 2, y + 14, { size: 16, color: T.GOLD_HI, bold: true, align: 'center' });
      // 标题两侧装饰线
      ctx.save();
      ctx.strokeStyle = 'rgba(217,169,78,0.4)';
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 24); ctx.lineTo(x + w / 2 - this.textWidth(title, 16, true) / 2 - 12, y + 24);
      ctx.moveTo(x + w / 2 + this.textWidth(title, 16, true) / 2 + 12, y + 24); ctx.lineTo(x + w - 20, y + 24);
      ctx.stroke();
      ctx.restore();
    }
    return { x: x + 12, y: y + (title ? 38 : 14), w: w - 24, h: h - (title ? 50 : 28) };
  },
  setModalClose(cb) { this._modalClose = cb; },

  // ---------- 飘字 ----------
  addFloat(x, y, text, color, size) {
    this.floaters.push({ x, y, text, color: color || '#ffb84d', size: size || 15, t: 0 });
    if (this.floaters.length > 30) this.floaters.shift();
  },
  drawFloaters(dt) {
    const ctx = this.ctx;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of this.floaters) {
      f.t += dt;
      const p = f.t / 0.9;
      if (p >= 1) continue;
      ctx.globalAlpha = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
      ctx.font = T.font(f.size, true);
      ctx.fillStyle = f.color;
      ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 3;
      ctx.fillText(f.text, f.x, f.y - p * 45);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    this.floaters = this.floaters.filter(f => f.t < 0.9);
  },

  // ---------- toast ----------
  toast(msg) {
    this.toastMsg = msg;
    this.toastUntil = this.time + 1.8;
  },
  drawToast() {
    if (!this.toastMsg || this.time > this.toastUntil) { this.toastMsg = null; return; }
    const ctx = this.ctx;
    const w = this.textWidth(this.toastMsg, 12) + 28;
    const x = (this.W - w) / 2, y = this.H - 140;
    ctx.save();
    ctx.globalAlpha = 0.92;
    roundRectPath(ctx, x, y, w, 30, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
    ctx.strokeStyle = T.LINE_HI; ctx.stroke();
    ctx.fillStyle = T.GOLD_HI;
    ctx.font = T.font(12);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.toastMsg, this.W / 2, y + 15.5);
    ctx.restore();
  }
};
module.exports = { ui, roundRectPath };

},
"utils/auto-battle.js":function(require,module,exports){
// 自动出征状态机。纯逻辑：不调用平台、存档、战斗引擎、UI 或计时器。
// transition(state, event, options) -> { state, commands, ignored? }

const CONFIG = require('./config');
const DEFAULTS = Object.assign({ maxLevel: CONFIG.MAX_LEVEL }, CONFIG.AUTO_BATTLE || {});

function createState() {
  return {
    status: 'idle',
    sessionToken: 0,
    sessionMode: null,
    currentMode: null,
    campaignIndex: null,
    recoveryRounds: 0,
    trainingStartLevel: null,
    trainingWins: 0,
    trainingPurpose: null,
    trainingLevelGain: 2,
    trainingMaxWins: 10,
    delayRemaining: 0,
    launchSeq: 0,
    awaitingStart: false,
    currentBattleId: null,
    lastHandledBattleId: null,
    stopAfterBattle: false,
    resumeStatus: null,
    pauseReasons: {},
    reason: null
  };
}

function transition(input, event, options) {
  const cfg = Object.assign({}, DEFAULTS, options || {});
  const state = cloneState(input || createState());
  const commands = [];
  event = event || {};
  const type = event.type;
  const ignored = (why) => ({ state, commands, ignored: why });

  if (type === 'start') {
    if (isRunning(state)) return ignored('already-running');
    state.sessionToken += 1;
    state.sessionMode = event.mode === 'training' ? 'training' : 'campaign';
    state.currentMode = state.sessionMode;
    state.campaignIndex = state.sessionMode === 'campaign'
      ? positiveInt(event.index || event.cleared + 1, 1) : null;
    state.recoveryRounds = 0;
    state.trainingWins = 0;
    state.stopAfterBattle = false;
    state.reason = null;
    if (state.sessionMode === 'training') {
      if (levelOf(event.level) >= cfg.maxLevel) return stop(state, commands, 'level-max');
      beginTraining(state, 'independent', event.level, cfg);
    }
    launch(state, commands, state.currentMode, state.campaignIndex);
    return { state, commands };
  }

  if (type === 'battleStarted') {
    if (!matchesSession(state, event) || !state.awaitingStart || state.status !== 'fighting') return ignored('stale-start');
    if (!event.ok || !event.battleId) return stop(state, commands, event.reason || 'battle-start-failed');
    state.awaitingStart = false;
    state.currentBattleId = event.battleId;
    return { state, commands };
  }

  if (type === 'settled') {
    if (!matchesSession(state, event)) return ignored('stale-session');
    const battleId = event.battleId;
    if (!battleId || battleId === state.lastHandledBattleId || battleId !== state.currentBattleId) return ignored('stale-or-duplicate-settlement');
    if (!event.ok) return stop(state, commands, event.reason || 'settlement-failed');
    const summary = event.summary || event;
    const outcome = summary.outcome || (event.win === true ? 'win' : event.win === false ? 'loss' : null);
    if (outcome !== 'win' && outcome !== 'loss') return stop(state, commands, 'invalid-settlement');
    state.lastHandledBattleId = battleId;
    state.currentBattleId = null;

    if (state.stopAfterBattle) return stop(state, commands, 'stopped-after-battle');

    if (state.currentMode === 'campaign') {
      if (outcome === 'win') {
        state.campaignIndex += 1;
        state.recoveryRounds = 0;
        scheduleNext(state, cfg);
        return { state, commands };
      }
      const level = levelOf(summary.levelAfter !== undefined ? summary.levelAfter : event.level);
      if (level >= cfg.maxLevel) return stop(state, commands, 'level-max');
      if (state.recoveryRounds >= cfg.recoveryMaxRounds) return stop(state, commands, 'recovery-exhausted');
      state.recoveryRounds += 1;
      beginTraining(state, 'recovery', level, cfg);
      launch(state, commands, 'training', null);
      return { state, commands };
    }

    if (state.currentMode === 'training') {
      if (outcome !== 'win') return stop(state, commands, 'training-loss');
      const gainedXP = Number(summary.gainedXP || 0);
      const level = levelOf(summary.levelAfter !== undefined ? summary.levelAfter : event.level);
      if (gainedXP <= 0 && level < cfg.maxLevel) return stop(state, commands, 'training-no-xp');
      state.trainingWins += 1;
      const targetLevel = Math.min(state.trainingStartLevel + state.trainingLevelGain, cfg.maxLevel);
      const reachedLevel = level >= targetLevel;
      const reachedWins = state.trainingWins >= state.trainingMaxWins;
      if (reachedLevel || reachedWins || level >= cfg.maxLevel) {
        if (state.trainingPurpose === 'recovery') {
          state.currentMode = 'campaign';
          launch(state, commands, 'campaign', state.campaignIndex);
        } else {
          stop(state, commands, reachedLevel ? 'training-level-target' : (level >= cfg.maxLevel ? 'level-max' : 'training-win-limit'));
        }
        return { state, commands };
      }
      launch(state, commands, 'training', null);
      return { state, commands };
    }
    return stop(state, commands, 'unknown-mode');
  }

  if (type === 'tick') {
    if (state.status !== 'resultDelay') return ignored('not-waiting');
    const dt = Math.max(0, Number(event.dt) || 0);
    state.delayRemaining = Math.max(0, state.delayRemaining - dt);
    if (state.delayRemaining <= 1e-9) launch(state, commands, state.currentMode, state.campaignIndex);
    return { state, commands };
  }

  if (type === 'pause') {
    if (!isRunning(state)) return ignored('not-running');
    const reason = String(event.reason || 'manual');
    state.pauseReasons[reason] = true;
    if (state.status !== 'suspended') {
      state.resumeStatus = state.status;
      state.status = 'suspended';
    }
    return { state, commands };
  }

  if (type === 'resume') {
    const reason = String(event.reason || 'manual');
    if (state.status !== 'suspended' || !state.pauseReasons[reason]) return ignored('pause-reason-mismatch');
    delete state.pauseReasons[reason];
    if (Object.keys(state.pauseReasons).length === 0) {
      state.status = state.resumeStatus || 'fighting';
      state.resumeStatus = null;
    }
    return { state, commands };
  }

  if (type === 'stop') {
    if ((state.status === 'fighting' || state.status === 'suspended') && (state.currentBattleId || state.awaitingStart)) {
      if (state.currentBattleId) commands.push({ type: 'interruptBattle', battleId: state.currentBattleId, sessionToken: state.sessionToken });
      return stop(state, commands, event.reason || 'stopped');
    }
    return stop(state, commands, event.reason || 'stopped');
  }

  if (type === 'stopAfterBattle') {
    if (!isRunning(state)) return ignored('not-running');
    if (state.status === 'resultDelay') return stop(state, commands, 'stopped-between-battles');
    state.stopAfterBattle = true;
    return { state, commands };
  }

  return ignored('unknown-event');
}

function launch(state, commands, mode, index) {
  state.status = 'fighting';
  state.currentMode = mode;
  state.currentBattleId = null;
  state.awaitingStart = true;
  state.launchSeq += 1;
  commands.push({
    type: 'startBattle', mode, index: mode === 'campaign' ? index : undefined,
    sessionToken: state.sessionToken, launchId: state.launchSeq
  });
}

function scheduleNext(state, cfg) {
  state.status = 'resultDelay';
  state.awaitingStart = false;
  state.delayRemaining = Math.max(0, Number(cfg.resultDelaySeconds) || 0);
}

function beginTraining(state, purpose, level, cfg) {
  state.currentMode = 'training';
  state.trainingPurpose = purpose;
  state.trainingStartLevel = levelOf(level);
  state.trainingWins = 0;
  state.trainingLevelGain = purpose === 'recovery' ? cfg.recoveryLevelGain : cfg.trainingBatchLevelGain;
  state.trainingMaxWins = purpose === 'recovery' ? cfg.recoveryMaxWins : cfg.trainingBatchMaxWins;
}

function stop(state, commands, reason) {
  state.status = 'stopped';
  state.reason = reason;
  state.currentBattleId = null;
  state.awaitingStart = false;
  state.delayRemaining = 0;
  state.resumeStatus = null;
  state.pauseReasons = {};
  state.stopAfterBattle = false;
  commands.push({ type: 'stopped', reason, sessionToken: state.sessionToken });
  return { state, commands };
}

function matchesSession(state, event) {
  return event.sessionToken === undefined || event.sessionToken === state.sessionToken;
}
function isRunning(state) {
  return ['fighting', 'resultDelay', 'suspended'].indexOf(state.status) >= 0;
}
function levelOf(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(1, Math.floor(n)) : 1;
}
function positiveInt(value, fallback) {
  const n = Math.floor(Number(value));
  return Number.isFinite(n) && n > 0 ? n : fallback;
}
function cloneState(state) {
  const next = Object.assign(createState(), state || {});
  next.pauseReasons = Object.assign({}, next.pauseReasons || {});
  return next;
}

module.exports = { createState, transition };

},
"utils/battle.js":function(require,module,exports){
// 回合制实时战斗引擎（tick 模拟，纯 JS 可独立测试）
const { BEATS, FACTION_ADV, factionBonus, BATTLE } = require('./config');
const { makeRng } = require('./rng');

// unit spec: { uid, heroId, name, faction, cls, level, star, stats:{hp,atk,def,spd,crit}, ult:{name,desc,effects}, passive:{mods...}, row, isBoss }
function createBattle(cfg) {
  const seed = cfg.seed || 1;
  const rng = makeRng(seed);
  const limit = cfg.timeLimit || BATTLE.TIME_LIMIT;
  const stats = {}; // uid -> {dmg, heal}
  const sides = { A: buildSide(cfg.team, 'A'), B: buildSide(cfg.enemy, 'B') };
  let time = 0;
  let ended = false;
  let winner = null;

  function buildSide(list, tag) {
    const units = list.map((u, i) => ({
      uid: u.uid || (tag + i),
      side: tag, slot: i, row: u.row !== undefined ? u.row : (i <= 2 ? 0 : 1),
      name: u.name, heroId: u.heroId, faction: u.faction, cls: u.cls, level: u.level,
      isBoss: !!u.isBoss,
      startHpPct: u.startHpPct || 0,
      base: Object.assign({}, u.stats),
      ult: u.ult || { name: '奋击', effects: [{ t: 'dmg', tgt: 'single', mult: 2 }] },
      passive: u.passive || {},
      // 运行时
      hp: u.stats.hp, maxHp: u.stats.hp, shield: 0, energy: 0,
      alive: true, actTimer: rng.range(0.2, 0.9),
      buffs: [], dots: [], hots: [], cc: null,
      cheat: (u.passive && u.passive.cheatDeath) || 0
    }));
    // 光环 + 阵营加成
    const fcount = {};
    units.forEach(u => { fcount[u.faction] = (fcount[u.faction] || 0) + 1; });
    const fb = factionBonus(Math.max.apply(null, Object.keys(fcount).map(k => fcount[k])));
    let auraAtk = 0, auraDef = 0, auraSpd = 0;
    units.forEach(u => {
      const p = u.passive;
      auraAtk += p.auraAtk || 0; auraDef += p.auraDef || 0; auraSpd += p.auraSpd || 0;
    });
    units.forEach(u => {
      u.auraAtk = auraAtk + fb.atk;
      u.auraDef = auraDef;
      u.auraSpd = auraSpd;
      u.fbHp = fb.hp;
      u.maxHp = Math.floor(u.maxHp * (1 + (u.passive.hp || 0)) * (1 + fb.hp));
      u.hp = u.startHpPct > 0 ? Math.max(1, Math.floor(u.maxHp * u.startHpPct)) : u.maxHp;
      // 开战能量来自武将被动与共享军械，统一按战斗上限裁切。
      u.energy = Math.min(BATTLE.ENERGY_MAX,
        (u.passive.firstEnergy || 0) + (u.passive.armoryStartEnergy || 0));
      // 军械护符的开场护盾按最终最大生命计算，并与其他护盾共用吸收逻辑。
      const startShield = Math.max(0, u.passive.armoryStartShield || 0);
      if (startShield > 0) u.shield = Math.floor(u.maxHp * startShield);
      stats[u.uid] = { dmg: 0, heal: 0 };
    });
    return units;
  }

  function aliveOf(side) { return sides[side].filter(u => u.alive); }
  function foesOf(u) { return aliveOf(u.side === 'A' ? 'B' : 'A'); }
  function alliesOf(u) { return aliveOf(u.side); }

  function effStat(u, stat) {
    let pct = u.passive[stat] || 0;
    for (const b of u.buffs) if (b.stat === stat) pct += b.pct;
    let v = u.base[stat] * (1 + pct);
    if (stat === 'atk') v *= (1 + u.auraAtk);
    if (stat === 'def') v *= (1 + u.auraDef);
    if (stat === 'spd') v *= (1 + u.auraSpd);
    return v;
  }
  function critChance(u) {
    let c = (u.base.crit || 0.05) + (u.passive.crit || 0);
    for (const b of u.buffs) if (b.stat === 'crit') c += b.pct;
    return Math.min(0.95, c);
  }

  // ---- 目标选择 ----
  function pickBy(u, pred) {
    const fs = foesOf(u);
    if (!fs.length) return null;
    const sorted = fs.slice().sort((a, b) => (a.slot - b.slot));
    const hit = sorted.find(pred);
    return hit || null;
  }
  function defaultTarget(u) {
    const cls = u.cls;
    if (cls === 'archer') {
      return pickBy(u, x => x.row === 1) || pickBy(u, () => true);
    }
    if (cls === 'mage') {
      const fs = foesOf(u);
      return fs.length ? fs[Math.floor(rng.next() * fs.length)] : null;
    }
    return pickBy(u, x => x.row === 0) || pickBy(u, () => true);
  }
  function lowest(units, key) {
    return units.slice().sort((a, b) => a[key] - b[key])[0] || null;
  }
  function resolveTargets(src, tgt) {
    const foes = foesOf(src);
    const allies = alliesOf(src);
    switch (tgt) {
      case 'self': return [src];
      case 'allEnemies': return foes;
      case 'allAllies': return allies;
      case 'frontRow': return foes.filter(x => x.row === 0);
      case 'backRow': return foes.filter(x => x.row === 1);
      case 'rand2': return rng.shuffle(foes).slice(0, 2);
      case 'rand3': return rng.shuffle(foes).slice(0, 3);
      case 'randEach': return foes.length ? [foes[Math.floor(rng.next() * foes.length)]] : [];
      case 'lowestEnemy': return lowest(foes, 'hp') ? [lowest(foes, 'hp')] : [];
      case 'strongestEnemy': { const t = foes.slice().sort((a, b) => b.maxHp - a.maxHp)[0]; return t ? [t] : []; }
      case 'lowestAlly': return lowest(allies, 'hp') ? [lowest(allies, 'hp')] : [];
      case 'single': default: { const t = defaultTarget(src); return t ? [t] : []; }
    }
  }

  // ---- 伤害/治疗 ----
  function emit(ev) { events.push(ev); }
  function gainEnergy(u, amt) {
    u.energy = Math.min(BATTLE.ENERGY_MAX, u.energy + amt * (1 + (u.passive.energyGain || 0)));
  }
  function applyDamage(src, tgt, raw, opts) {
    opts = opts || {};
    if (!tgt.alive) return;
    let dmg = raw;
    const K = BATTLE.DEF_K(src.level || 1);
    const defF = K / (K + effStat(tgt, 'def'));
    const fac = BEATS[src.faction] === tgt.faction ? FACTION_ADV : 1;
    let crit = false;
    if (!opts.noCrit) crit = rng.chance(critChance(src));
    const critM = crit ? (BATTLE.CRIT_BASE_DMG + (src.passive.critDmg || 0)) : 1;
    const exec = opts.execute && (tgt.hp / tgt.maxHp < opts.execute) ? 1.8 : 1;
    dmg = dmg * defF * fac * critM * exec * rng.range(0.92, 1.08);
    dmg *= (1 - (src === tgt ? 0 : (tgt.passive.dmgReduce || 0)));
    // 防御封印只削减普攻与大招的直接伤害，不作用于 dot 等持续伤害。
    if (opts.kind === 'atk' || opts.kind === 'ult') {
      dmg *= 1 - Math.max(0, Math.min(1, tgt.passive.armoryDirectDR || 0));
    }
    dmg = Math.max(1, Math.floor(dmg));
    // 护盾吸收
    if (tgt.shield > 0) {
      const absorbed = Math.min(tgt.shield, dmg);
      tgt.shield -= absorbed;
      dmg -= absorbed;
      if (absorbed > 0) emit({ e: 'shieldHit', uid: tgt.uid, amount: absorbed });
    }
    if (dmg > 0) {
      tgt.hp -= dmg;
      tgt.hp = Math.max(0, tgt.hp);
      stats[src.uid].dmg += dmg;
      emit({ e: 'hit', uid: tgt.uid, src: src.uid, amount: dmg, crit, kind: opts.kind || 'atk' });
      gainEnergy(tgt, BATTLE.ENERGY_HIT);
      // 吸血
      const ls = (opts.ls || 0) + (src.passive.vamp || 0);
      if (ls > 0 && src.alive) healHp(src, dmg * ls);
      // 反弹
      const th = tgt.passive.thorns || 0;
      if (th > 0 && src.alive && !opts.isReflect) {
        const r = Math.max(1, Math.floor(dmg * th));
        dealRaw(src, r, 'reflect');
      }
    }
    if (tgt.hp <= 0) handleDeath(tgt, src);
  }
  function dealRaw(u, amount, kind) {
    if (!u.alive) return;
    u.hp = Math.max(0, u.hp - amount);
    emit({ e: 'hit', uid: u.uid, src: null, amount, crit: false, kind });
    if (u.hp <= 0) handleDeath(u, null);
  }
  function healHp(u, amount) {
    if (!u.alive || amount <= 0) return;
    const real = Math.min(u.maxHp - u.hp, Math.floor(amount));
    if (real > 0) {
      u.hp += real;
      stats[u.uid].heal += real;
      emit({ e: 'heal', uid: u.uid, amount: real });
    }
  }
  function handleDeath(u, killer) {
    if (u.cheat > 0) {
      u.cheat--;
      u.hp = 1;
      emit({ e: 'cheat', uid: u.uid });
      return;
    }
    u.alive = false;
    u.buffs = []; u.dots = []; u.hots = []; u.cc = null; u.shield = 0;
    emit({ e: 'death', uid: u.uid });
    if (killer && killer.alive) {
      gainEnergy(killer, BATTLE.ENERGY_KILL);
      const rk = killer.passive.rageOnKill;
      if (rk) gainEnergy(killer, rk);
    }
    checkEnd();
  }

  // ---- 效果执行 ----
  function castUlt(u) {
    u.energy = 0;
    const fx = u.ult.effects || [];
    const scope = fx.some(f => f.tgt === 'allEnemies') ? 'all'
      : fx.some(f => f.tgt === 'frontRow' || f.tgt === 'backRow') ? 'row' : 'single';
    emit({ e: 'ult', uid: u.uid, skill: u.ult.name, scope });
    for (const f of fx) applyEffect(u, f);
  }
  function applyEffect(src, fx) {
    const tgts = resolveTargets(src, fx.tgt);
    switch (fx.t) {
      case 'dmg': {
        const hits = fx.hits || 1;
        for (let i = 0; i < hits; i++) {
          let list = tgts.filter(x => x.alive);
          if (fx.tgt === 'randEach') list = resolveTargets(src, 'randEach');
          if (fx.tgt === 'lowestEnemy') { const t = resolveTargets(src, 'lowestEnemy')[0]; list = t ? [t] : []; }
          if (fx.tgt === 'strongestEnemy') { const t = resolveTargets(src, 'strongestEnemy')[0]; list = t ? [t] : []; }
          if (!list.length) break;
          for (const t of list) {
            if (!t.alive) continue;
            applyDamage(src, t, effStat(src, 'atk') * fx.mult, { ls: fx.ls || 0, execute: fx.execute, kind: 'ult' });
          }
        }
        break;
      }
      case 'heal': {
        const healMult = (1 + (src.passive.heal || 0)) * (1 + (src.passive.armoryHeal || 0));
        for (const t of tgts) healHp(t, effStat(src, 'atk') * fx.mult * healMult);
        break;
      }
      case 'hot': {
        const healMult = (1 + (src.passive.heal || 0)) * (1 + (src.passive.armoryHeal || 0));
        for (const t of tgts) t.hots.push({ perTick: effStat(src, 'atk') * fx.mult * healMult, remaining: fx.dur, acc: 0 });
        break;
      }
      case 'shield': {
        for (const t of tgts) {
          t.shield += Math.floor(effStat(src, 'atk') * fx.mult);
          emit({ e: 'shield', uid: t.uid, amount: Math.floor(effStat(src, 'atk') * fx.mult) });
        }
        break;
      }
      case 'buff': {
        for (const t of tgts) addBuff(t, fx.stat, fx.pct, fx.dur);
        break;
      }
      case 'debuff': {
        for (const t of tgts) addBuff(t, fx.stat, -fx.pct, fx.dur);
        break;
      }
      case 'cc': {
        for (const t of tgts) {
          if (!t.alive) continue;
          t.cc = { kind: fx.kind, remaining: fx.dur };
          emit({ e: 'cc', uid: t.uid, kind: fx.kind, dur: fx.dur });
        }
        break;
      }
      case 'dot': {
        for (const t of tgts) {
          if (!t.alive) continue;
          t.dots.push({ kind: fx.kind, perTick: effStat(src, 'atk') * fx.mult, remaining: fx.dur, acc: 0, src: src.uid });
        }
        break;
      }
      case 'energy': {
        for (const t of tgts) gainEnergy(t, fx.amt);
        break;
      }
    }
  }
  function addBuff(u, stat, pct, dur) {
    if (!u.alive) return;
    const ex = u.buffs.find(b => b.stat === stat);
    if (ex) { ex.pct = pct; ex.remaining = dur; }
    else u.buffs.push({ stat, pct, remaining: dur });
  }

  function normalAttack(u) {
    const t = defaultTarget(u);
    if (!t) return;
    emit({ e: 'act', uid: u.uid, type: 'atk', tgt: t.uid });
    applyDamage(u, t, effStat(u, 'atk'), { kind: 'atk' });
    gainEnergy(u, BATTLE.ENERGY_ATK);
  }

  function checkEnd() {
    if (ended) return;
    if (!aliveOf('A').length) { ended = true; winner = 'B'; emit({ e: 'end', winner: 'B', duration: time }); }
    else if (!aliveOf('B').length) { ended = true; winner = 'A'; emit({ e: 'end', winner: 'A', duration: time }); }
  }

  const events = [];
  function step(dt) {
    if (ended) return { events: [], done: true, winner };
    const out = [];
    // swap & clear
    events.length = 0;
    time += dt;
    for (const tag of ['A', 'B']) {
      for (const u of sides[tag]) {
        if (!u.alive) continue;
        // buff/cc/dot 计时
        for (const b of u.buffs) b.remaining -= dt;
        u.buffs = u.buffs.filter(b => b.remaining > 0);
        // hot/dot 结算不受控制状态影响
        for (const h of u.hots) { h.acc += dt; while (h.acc >= 1) { h.acc -= 1; healHp(u, h.perTick); } }
        u.hots = u.hots.filter(h => h.remaining - dt > -1);
        for (const h of u.hots) h.remaining -= dt;
        u.hots = u.hots.filter(h => h.remaining > 0);
        for (const d of u.dots) {
          d.acc += dt;
          while (d.acc >= 1 && u.alive) {
            d.acc -= 1;
            dealRaw(u, Math.max(1, Math.floor(d.perTick)), 'dot:' + d.kind);
          }
        }
        u.dots = u.dots.filter(d => d.remaining - dt > -1 && u.alive);
        for (const d of u.dots) d.remaining -= dt;
        u.dots = u.dots.filter(d => d.remaining > 0);
        if (!u.alive) continue;
        // 控制状态：硬控（眩晕/冰冻）跳过行动；沉默只禁大招（下方满怒分支处理）
        if (u.cc) {
          u.cc.remaining -= dt;
          if (u.cc.remaining <= 0) { u.cc = null; emit({ e: 'ccEnd', uid: u.uid }); }
          else if (u.cc.kind !== 'silence') continue;
        }
        // 行动
        u.actTimer -= dt;
        if (u.actTimer <= 0) {
          const interval = BATTLE.BASE_ATTACK_INTERVAL / Math.max(0.3, effStat(u, 'spd'));
          if (u.energy >= BATTLE.ENERGY_MAX && !u.cc) {
            if (u.passive && hasSilence(u)) { normalAttack(u); }
            else castUlt(u);
          } else {
            normalAttack(u);
          }
          u.actTimer = interval;
        }
      }
    }
    if (time >= limit && !ended) {
      ended = true; winner = 'B';
      emit({ e: 'end', winner: 'B', duration: time, timeout: true });
    }
    checkEnd();
    return { events: events.slice(), done: ended, winner, time };
  }
  function hasSilence(u) { return u.cc && u.cc.kind === 'silence'; }

  function snapshot() {
    const out = [];
    for (const tag of ['A', 'B']) {
      for (const u of sides[tag]) {
        out.push({
          uid: u.uid, side: tag, slot: u.slot, name: u.name, hp: Math.floor(u.hp), maxHp: u.maxHp,
          shield: Math.floor(u.shield), energy: Math.floor(u.energy), alive: u.alive,
          cc: u.cc ? u.cc.kind : null, dots: u.dots.length
        });
      }
    }
    return out;
  }
  function result() {
    return { winner, duration: Math.round(time * 10) / 10, stats };
  }
  return { step, snapshot, result, get ended() { return ended; } };
}

// 由武将定义+等级+星+装备生成战斗单元
function buildUnit(calc, uid, row) {
  return {
    uid, heroId: calc.id, name: calc.name, faction: calc.faction, cls: calc.cls,
    level: calc.level, star: calc.star, row: row !== undefined ? row : calc.row,
    stats: calc.stats, ult: calc.ult, passive: calc.passive, isBoss: calc.isBoss || false
  };
}
module.exports = { createBattle, buildUnit };

},

"utils/fmt.js":function(require,module,exports){
// 数字与文案格式化
function fmtNum(n) {
  n = Math.floor(n || 0);
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return '' + n;
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  return pad2(m) + ':' + pad2(s);
}
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
const NUM_CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
function cnNum(n) {
  if (n <= 20) return NUM_CN[n - 1] || '' + n;
  return '' + n;
}
module.exports = { fmtNum, fmtDur, todayStr, cnNum, pad2 };

},
"utils/formation.js":function(require,module,exports){
// 确定性均衡编队建议，不修改传入阵容。
function recommendFormation(roster) {
  const all = (roster || []).filter(Boolean).slice();
  const powerOrder = (a, b) => (Number(b.power) || 0) - (Number(a.power) || 0) || String(a.id).localeCompare(String(b.id));
  const allByPower = all.slice().sort(powerOrder);
  const tanks = all.filter(h => h.cls === 'tank').sort(powerOrder);
  const fighters = all.filter(h => h.cls === 'warrior').sort(powerOrder);
  const firstFront = tanks[0] || fighters[0] || allByPower[0];
  if (!firstFront) return [null, null, null, null, null];
  const chosen = [firstFront];
  const supports = all.filter(h => h.id !== firstFront.id && h.cls === 'support').sort(powerOrder);
  if (supports.length) chosen.push(supports[0]);
  allByPower.forEach(h => { if (chosen.length < 5 && !chosen.some(x => x.id === h.id)) chosen.push(h); });

  const front = chosen.filter(h => h.cls === 'tank' || h.cls === 'warrior').sort((a, b) => {
    const role = (h) => h.cls === 'tank' ? 0 : 1;
    return role(a) - role(b) || powerOrder(a, b);
  }).slice(0, 3);
  const remaining = chosen.filter(h => !front.some(x => x.id === h.id));
  const bulk = remaining.filter(h => h.cls !== 'support').sort((a, b) =>
    (Number(b.stats && b.stats.hp) || 0) - (Number(a.stats && a.stats.hp) || 0) ||
    (Number(b.stats && b.stats.def) || 0) - (Number(a.stats && a.stats.def) || 0) || powerOrder(a, b));
  while (front.length < 3 && bulk.length) front.push(bulk.shift());
  const back = chosen.filter(h => !front.some(x => x.id === h.id)).sort((a, b) => {
    const support = (h) => h.cls === 'support' ? 0 : 1;
    return support(a) - support(b) || powerOrder(a, b);
  });
  // 只有非辅助不足三名时，剩余成员才会补前排。
  while (front.length < 3 && back.length) front.push(back.shift());
  while (back.length < 2 && chosen.some(h => !front.some(x => x.id === h.id) && !back.some(x => x.id === h.id))) {
    const next = chosen.find(h => !front.some(x => x.id === h.id) && !back.some(x => x.id === h.id));
    if (!next) break;
    back.push(next);
  }
  const ids = front.slice(0, 3).concat(back.slice(0, 2)).map(h => h ? h.id : null);
  while (ids.length < 5) ids.push(null);
  return ids;
}
module.exports = { recommendFormation };

},

"utils/progression.js":function(require,module,exports){
// 只读近期目标与免费军械启用建议。所有结果均从传入的存档快照/API派生。
const C = require('./config');
const H = require('./heroes');
const IT = require('./items');
const STAGES = require('./stages');

const MILESTONE_BOX_Q = { 10: 1, 30: 2, 60: 3 };
const CHAPTER_CHEST = { gem: 100, scroll: 1 };

function own(obj, key) { return !!obj && Object.prototype.hasOwnProperty.call(obj, key); }

function getArmoryRecommendations(state, items) {
  const catalog = items || IT;
  const armory = state && state.armory;
  if (!armory || !armory.unlocked || !armory.selected) return [];
  const byId = {};
  (catalog.CATALOG || []).forEach(item => { byId[item.id] = item; });
  const slots = catalog.ARMORY_SLOTS || [];
  const result = [];
  slots.forEach(slotDef => {
    const slot = slotDef.id;
    const currentId = armory.selected[slot];
    const current = byId[currentId];
    // 已启用SSR的槽位由玩家自行比较特殊效果，不参与建议。
    if (!current || current.q >= 3) return;
    const currentStats = current.basePct || current.stats || {};
    const candidates = (catalog.CATALOG || []).filter(item => {
      if (item.slot !== slot || item.q > 2 || item.q <= current.q || !armory.unlocked[item.id]) return false;
      // N/R/SR不应引入特殊效果；同时要求替换前后效果完全相同。
      if ((item.effect || null) !== (current.effect || null)) return false;
      const stats = item.basePct || item.stats || {};
      const keys = new Set(Object.keys(currentStats).concat(Object.keys(stats)));
      let improved = false;
      for (const key of keys) {
        const before = Number(currentStats[key]) || 0;
        const after = Number(stats[key]) || 0;
        if (after < before) return false;
        if (after > before) improved = true;
      }
      return improved;
    }).sort((a, b) => b.q - a.q || String(a.id).localeCompare(String(b.id)));
    if (!candidates.length) return;
    const next = candidates[0], nextStats = next.basePct || next.stats || {};
    const keys = new Set(Object.keys(currentStats).concat(Object.keys(nextStats)));
    const delta = {};
    keys.forEach(key => {
      const amount = (Number(nextStats[key]) || 0) - (Number(currentStats[key]) || 0);
      if (amount > 0) delta[key] = amount;
    });
    result.push({ slot, slotName: slotDef.name, fromId: current.id, toId: next.id,
      fromName: current.name, toName: next.name, fromQ: current.q, toQ: next.q, delta });
  });
  return result;
}

function firstAvailableAscension(state, storeApi) {
  if (!storeApi || typeof storeApi.ascendPreview !== 'function') return null;
  const roster = state.roster || {};
  const formation = Array.isArray(state.formation) ? state.formation : [];
  const ordered = [];
  formation.forEach(id => { if (id && roster[id] && ordered.indexOf(id) < 0) ordered.push(id); });
  Object.keys(roster).sort().forEach(id => { if (ordered.indexOf(id) < 0) ordered.push(id); });
  for (const id of ordered) {
    const preview = storeApi.ascendPreview(id);
    if (preview && preview.ok && preview.can) return { id, hero: H.getHero(id), preview };
  }
  return null;
}

function firstWinAvailable(storeApi) {
  if (!storeApi || typeof storeApi.firstWinChoice !== 'function') return false;
  const choice = storeApi.firstWinChoice();
  return !!(choice && choice.available === true);
}

function nextChapterGoal(state, stages) {
  const cleared = Math.max(0, Math.floor(Number(state.campaign && state.campaign.cleared) || 0));
  const stageNo = (Math.floor(cleared / (stages.STAGES_PER_CH || 10)) + 1) * (stages.STAGES_PER_CH || 10);
  const reward = { firstClear: { gem: 30,
    gold: Math.floor(2000 * Math.pow(1.05, stageNo)) + Math.floor(1400 * Math.pow(1.05, stageNo)),
    }, bossReward: { scroll: 1 }, chapterChest: Object.assign({}, CHAPTER_CHEST), armoryBoxQ: 0, srChoiceVoucher: false };
  const milestoneQ = MILESTONE_BOX_Q[stageNo] || 0;
  if (milestoneQ && !(state.armory && state.armory.claimedMilestones && state.armory.claimedMilestones[milestoneQ])) {
    reward.armoryBoxQ = milestoneQ;
  }
  const progress = state.heroProgress || {};
  // 当前 settleBattle 的实际发放条件是任意战役胜利关号 >=10 时补发一次。
  if (stageNo >= 10 && !progress.chapterOneVoucherGranted) reward.srChoiceVoucher = true;
  return { id: 'chapter-' + stageNo, title: '再过' + (stageNo - cleared) + '关，获得章末奖励',
    progress: { current: cleared, target: stageNo, remaining: stageNo - cleared },
    rewardPreview: reward, action: { type: 'campaign', stage: cleared + 1 } };
}

function getNextGoal(state, storeApi, deps) {
  if (!state) return null;
  const d = deps || {};
  const stages = d.stages || STAGES;
  if (firstWinAvailable(storeApi)) {
    return { id: 'first-win-choice', title: '首胜奖励可领', progress: null,
      rewardPreview: { choice: ['liubei', 'guanyu', 'zhangfei'] }, action: { type: 'heroes', focusFirstWin: true } };
  }
  const ascension = firstAvailableAscension(state, storeApi);
  if (ascension) {
    return { id: 'ascend-' + ascension.id, title: '可升星：' + (ascension.hero ? ascension.hero.name : ascension.id),
      progress: { current: ascension.preview.cards, target: ascension.preview.needCards },
      rewardPreview: { starFrom: ascension.preview.from, starTo: ascension.preview.to },
      action: { type: 'heroDetail', id: ascension.id, focus: 'ascend' } };
  }
  const boxes = state.armory && state.armory.boxes || {};
  for (const q of [1, 2, 3]) {
    if ((Number(boxes[q]) || 0) > 0) return { id: 'armory-box-' + q, title: '有军械自选箱待选择', progress: null,
      rewardPreview: { boxQ: q }, action: { type: 'armory', boxQ: q } };
  }
  const vouchers = state.vouchers || {};
  for (const [key, rarity] of [['sr', 3], ['ssr', 4]]) {
    if ((Number(vouchers[key]) || 0) > 0) return { id: 'hero-voucher-' + key, title: '有武将自选券待选择', progress: null,
      rewardPreview: { rarity, count: Math.floor(vouchers[key]) }, action: { type: 'shop', pickRarity: rarity } };
  }
  const recommendations = getArmoryRecommendations(state, d.items);
  if (recommendations.length) return { id: 'armory-upgrade', title: '可启用新军械', progress: null,
    rewardPreview: { replacements: recommendations }, action: { type: 'armory', recommendations } };
  return nextChapterGoal(state, stages);
}

module.exports = { getNextGoal, getArmoryRecommendations };

},
"utils/rng.js":function(require,module,exports){
// 可播种随机数（mulberry32），保证战斗可复现
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const f = mulberry32(seed || 1);
  return {
    next: f,
    int(min, max) { return min + Math.floor(f() * (max - min + 1)); },
    range(min, max) { return min + f() * (max - min); },
    chance(p) { return f() < p; },
    pick(arr) { return arr[Math.floor(f() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(f() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
  };
}
module.exports = { makeRng, mulberry32 };

},
"utils/stages.js":function(require,module,exports){
// 战役章节与群英塔（敌方阵容生成）
// 前 12 章 × 10 关走 utils/story.js 演义剧情表（名称/敌阵/对白/名将关）；
// 超出剧情表的关卡进入循环乱世，用由 story 派生的兜底章节轮转生成（单一数据源，不维护第二份敌将表）。
const { getHero } = require('./heroes');
const story = require('./story');
const F = require('./fmt');

const STAGES_PER_CH = 10;

// 循环乱世兜底章节：名字/主将/敌阵取自剧情表（首关敌阵作轮转池）
const CHAPTERS = story.CHAPTERS.map(sc => ({
  name: sc.name,
  boss: sc.stages[STAGES_PER_CH - 1].foes[0],
  foes: sc.stages[0].foes
}));

// 敌方强度：全局关卡序号（从 1 开始）
function stageScale(globalStage) {
  // 敌方等级已按关卡提升，不再额外叠加指数属性，避免中后期倍率失控。
  return 1;
}
function chapterOf(globalStage) {
  const idx = Math.floor((globalStage - 1) / STAGES_PER_CH); // 0-based
  const inCh = (globalStage - 1) % STAGES_PER_CH;
  const ch = idx < CHAPTERS.length ? CHAPTERS[idx] : CHAPTERS[CHAPTERS.length - 1];
  const loop = idx >= CHAPTERS.length ? idx - CHAPTERS.length + 1 : 0;
  const name = idx < CHAPTERS.length
    ? '第' + F.cnNum(idx + 1) + '章 · ' + ch.name
    : '乱世纷争 · ' + F.cnNum(loop + 1);
  return { ch, idx, inCh, name, isBoss: inCh === STAGES_PER_CH - 1 };
}

// 生成敌方阵容（5 人，slot 0-2 前排，3-4 后排）；剧情表内关卡附带 story 配置
function makeStageEnemies(globalStage) {
  const { ch, inCh, name, isBoss } = chapterOf(globalStage);
  const st = story.getStoryStage(globalStage);
  const scale = stageScale(globalStage) * (isBoss ? 1.25 : 1);
  const lv = Math.max(1, Math.round(1 + (globalStage - 1) * 1.6));
  const pick = (i) => {
    if (st) return st.stage.foes[i];
    if (isBoss && i === 0) return ch.boss;
    return ch.foes[(inCh + i) % ch.foes.length];
  };
  const units = [];
  for (let i = 0; i < 5; i++) {
    const h = getHero(pick(i));
    units.push({
      hero: h,
      level: lv,
      star: Math.min(2, Math.floor((globalStage - 1) / 40)),
      scale: i === 0 && isBoss ? scale : scale * 0.92,
      isBoss: i === 0 && isBoss,
      row: i <= 2 ? 0 : 1
    });
  }
  const label = st ? ' · ' + st.stage.name : (isBoss ? ' · 名将' : ' · 第' + (inCh + 1) + '关');
  return { name: name + label, units, isBoss, story: st };
}

// 群英塔：无限层，随机阵营混合，每 5 层一名将
function makeTowerEnemies(floor) {
  const heroes = require('./heroes').HEROES;
  const rng = require('./rng').makeRng(9000 + floor * 131);
  const pool = rng.shuffle(heroes.map(h => h.id));
  const scale = 1;
  const lv = Math.max(1, Math.round(2 + (floor - 1) * 1.8));
  const units = [];
  for (let i = 0; i < 5; i++) {
    const h = require('./heroes').getHero(pool[i]);
    const isBoss = floor % 5 === 0 && i === 0;
    units.push({
      hero: h, level: lv, star: Math.min(3, Math.floor(floor / 25)),
      scale: (isBoss ? scale * 1.2 : scale * 0.9), isBoss, row: i <= 2 ? 0 : 1
    });
  }
  return { name: '群英塔 · 第' + floor + '层', units, isBoss: floor % 5 === 0 };
}

// 无次数限制的练兵队：三名低稀有度武将，敌方弱于同等级常规守军。
function makePracticeEnemies(playerLevel, seed) {
  const H = require('./heroes');
  const ids = ['liaohua', 'mengda', 'masu'];
  const lv = Math.max(1, Math.floor(playerLevel || 1) - 2);
  const units = ids.map((id, i) => ({
    hero: H.getHero(id), level: lv, star: 0,
    scale: 0.6, isBoss: false, row: i < 2 ? 0 : 1
  }));
  return { name: '练兵场 · 熟悉阵容', units, isBoss: false, seed: seed || 1, referenceLevel: lv };
}

// 演武场对手：按玩家战力缩放
function makeArenaEnemies(playerPower, seed, diff) {
  const heroes = require('./heroes').HEROES;
  const rng = require('./rng').makeRng(seed);
  const pool = rng.shuffle(heroes.map(h => h.id)).slice(0, 5);
  // 由目标战力反推等级
  const targetPower = playerPower * diff;
  const lv = Math.max(1, Math.round(Math.pow(targetPower / 2600, 1 / 1.35)));
  const units = pool.map((hid, i) => {
    const h = require('./heroes').getHero(hid);
    return { hero: h, level: lv, star: Math.min(2, Math.floor(lv / 60)), scale: 1, isBoss: false, row: i <= 2 ? 0 : 1 };
  });
  return { name: '演武场 · 对阵', units, isBoss: false };
}

module.exports = { CHAPTERS, STAGES_PER_CH, stageScale, chapterOf, makeStageEnemies, makeTowerEnemies, makeArenaEnemies, makePracticeEnemies };

},
"utils/store.js":function(require,module,exports){
// 游戏状态管理：存档、武将养成、挂机、招募、任务、商店、演武
const C = require('./config');
const H = require('./heroes');
const IT = require('./items');

const SAVE_KEY = 'sanguo_afk_save_v1';

let memStore = {};

function rawGet(k) { return hasStorage ? api.getStorageSync(k) : memStore[k]; }
function rawSet(k, v) { if (hasStorage) api.setStorageSync(k, v); else memStore[k] = v; }

let state = null;

function defaultState() {

    campaign: { cleared: 0, storySeen: {} },
    tower: { best: 0 },
    arena: { points: 1000, wins: 0, losses: 0, attempts: C.ARENA.DAILY },
    equips: {}, nextEquip: 1,
    armory: createArmory(),
    idle: { last: Date.now(), gold: 0, scroll: 0, ironAcc: 0 },
    fast: { day: '', count: 0 },
    daily: { day: '', quests: {}, claimed: [], active: [] },
    summon: { total: 0 },
    vouchers: { sr: 0, ssr: 0 },
    heroProgress: { starterMengdaGranted: true, firstWinChoiceGranted: false, firstWinChoicePending: false, chapterOneVoucherGranted: false },
    battle: { nextSeq: 1, pending: null, lastSettled: null },

    ads: { day: '', counts: {} },
    buyLog: { day: '', buys: {} },
    settings: { speed: 1 }
  };
}
function newHero(id) { return { id, star: 0, cards: 0, lockedCards: false, equip: { weapon: null, armor: null, helm: null, boots: null } }; }
function createArmory() {
  const unlocked = {}, selected = {}, slotStars = {};
  IT.ARMORY_SLOTS.forEach(s => {
    const starter = IT.CATALOG.find(x => x.slot === s.id && x.q === 0);
    unlocked[starter.id] = true; selected[s.id] = starter.id; slotStars[s.id] = 0;
  });
  return { schema: 1, unlocked, selected, slotStars, seen: {}, claimedMilestones: {}, boxes: { 1: 0, 2: 0, 3: 0 } };
}

// 旧档 v1（tier 1-6 / enh 0-12）→ v2（q 品质 1-4 / stars 星级 / faction 阵营）
// 导出供冒烟测试直测；映射保持战力大致连续（旧 t6+12 ≈ 新 SSR 5★）
const V1_TIER_TO_Q = { 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 4 };
function migrateSaveV1(raw) {
  raw.v = 2;
  Object.keys(raw.equips || {}).forEach(k => {
    const e = raw.equips[k];
    if (e.q) return;
    e.q = V1_TIER_TO_Q[e.tier] || 1;
    e.stars = Math.min(IT.EQUIP_QUALITIES[e.q].maxStar, Math.round((e.enh || 0) / 2.4));

}

// 旧档 v2 → v3：补齐剧情关卡字段（storySeen 缺省安全，旧档 cleared 不动）
function migrateSaveV2(raw) {
  raw.v = 3;

  if (!raw.campaign.storySeen) raw.campaign.storySeen = {};

}

// v3兵书→铜钱、个人等级→玩家等级。只补偿旧档仍能重建的投入，迁移标记阻止重复返还。
function migrateSaveV3(raw) {
  if (raw.migrations && raw.migrations.playerLevelV2 && raw.migrations.playerLevelV2.applied) {
    raw.v = 4;
    return raw;
  }
  raw.res = raw.res || {};
  raw.roster = raw.roster || {};
  raw.campaign = raw.campaign || { cleared: 0 };
  raw.daily = raw.daily || { day: '', quests: {}, claimed: [], active: [] };
  raw.idle = raw.idle || { last: Date.now(), gold: 0, exp: 0, scroll: 0 };

  // 先按旧速率结算一次剩余离线收益，随后把挂机兵书一并折铜钱。
  const oldCleared = raw.campaign.cleared || 0;
  const oldRate = { gold: Math.floor(1800 + 260 * oldCleared), exp: Math.floor(1200 + 170 * oldCleared), scrollPerHour: 0.25 };
  const elapsed = Math.max(0, (Date.now() - (raw.idle.last || Date.now())) / 3600000);
  const hours = Math.min(C.IDLE_CAP_HOURS, elapsed);
  const idleGold = Math.min(C.IDLE_CAP_HOURS * oldRate.gold, (raw.idle.gold || 0) + hours * oldRate.gold);

// v5→v6：旧档中未用于手动升星的同名卡，按每张卡自动升一星；满星后余卡继续保留。

function isEquipped(instId) {

// 升星：吃掉 fodderIds 里的装备攒强化点 + 铜钱（对标 AFK 强化）
function enhanceEquip(instId, fodderIds) {
  const e = state.equips[instId];
  if (!e) return { ok: false, msg: '装备不存在' };
  const maxStar = IT.EQUIP_QUALITIES[e.q].maxStar;
  if (e.stars >= maxStar) return { ok: false, msg: '已满星' };
  const need = IT.starNeed(e.q, e.stars);
  const goldCost = IT.starGold(need);
  if (state.res.gold < goldCost) return { ok: false, msg: '铜钱不足' };
  const fodder = (fodderIds || [])
    .map(id => state.equips[id])
    .filter(x => x && x.id !== instId && !isEquipped(x.id));
  if (!fodder.length) return { ok: false, msg: '请选择要消耗的装备' };
  const pts = fodder.reduce((s, x) => s + IT.fodderPoints(x), 0);
  if (pts < need) return { ok: false, msg: '强化点不足 ' + pts + '/' + need };
  fodder.forEach(x => { delete state.equips[x.id]; });
  state.res.gold -= goldCost;
  e.stars += 1;
  return { ok: true, stars: e.stars };
}
// 一键放入：从可选狗粮里由低到高凑满强化点，返回建议消耗的 id 列表
function fodderPickIds(instId, ids) {
  const e = state.equips[instId];
  if (!e) return [];
  const maxStar = IT.EQUIP_QUALITIES[e.q].maxStar;
  if (e.stars >= maxStar) return [];
  const need = IT.starNeed(e.q, e.stars);
  const pool = (ids || [])
    .map(id => state.equips[id])
    .filter(x => x && x.id !== instId && !isEquipped(x.id))
    .sort((a, b) => IT.fodderPoints(a) - IT.fodderPoints(b));
  const picked = [];
  let pts = 0;
  for (const x of pool) {
    if (pts >= need) break;
    picked.push(x.id);
    pts += IT.fodderPoints(x);
  }
  return picked;
}

function idlePending() {
  idleTick();
  const rate = C.idleRates(state.campaign.cleared);
  const gold = Math.floor(state.idle.gold), scroll = Math.floor(state.idle.scroll);
  const hours = rate.gold > 0 ? state.idle.gold / rate.gold : 0;
  const full = state.idle.gold >= C.IDLE_CAP_HOURS * rate.gold - 1;
  return { gold, exp: 0, scroll, iron: Math.floor(state.idle.ironAcc), hours, full };
}
function idleTick() {
  // 把离线时间折算进累计（入 state.idle 缓存）
  const now = Date.now();
  const addH = Math.max(0, Math.min(C.IDLE_CAP_HOURS, (now - state.idle.last) / 3600000));
  const rate = C.idleRates(state.campaign.cleared);
  state.idle.gold += addH * rate.gold;
  if (state.idle.exp) { state.idle.gold += state.idle.exp; state.idle.exp = 0; }
  state.idle.scroll += addH * rate.scrollPerHour;
  state.idle.ironAcc += addH * C.ARMORY_IRON_PER_HOUR;
  const capG = C.IDLE_CAP_HOURS * rate.gold;
  state.idle.gold = Math.min(state.idle.gold, capG);
  state.idle.scroll = Math.min(state.idle.scroll, C.IDLE_CAP_HOURS * rate.scrollPerHour);
  state.idle.ironAcc = Math.min(state.idle.ironAcc, C.IDLE_CAP_HOURS * C.ARMORY_IRON_PER_HOUR);
  state.idle.last = now;
}
function claimIdleInternal(double) {
  idleTick();
  let g = Math.floor(state.idle.gold), s = Math.floor(state.idle.scroll), iron = Math.floor(state.idle.ironAcc);
  if (double) { g *= 2; s *= 2; }
  state.res.gold += g; state.res.scroll += s; state.res.iron += iron;
  state.idle.gold -= Math.floor(state.idle.gold); state.idle.scroll -= Math.floor(state.idle.scroll); state.idle.ironAcc -= iron;
  const changed = !!(g || s || iron);
  if (changed) bumpQuest('q_idle1', 1);
  return { ok: true, gold: g, exp: 0, scroll: s, iron, double: !!double, changed };
}

function rollRarity() {
  const g = C.GACHA.rates;
  const r = Math.random();
  if (r < g.ssr) return 4;
  if (r < g.ssr + g.sr) return 3;
  if (r < g.ssr + g.sr + g.r) return 2;
  return 1;
}
function pickHeroOfRarity(rarity) {

function doSummonMutation(type) {
  // type: scroll1 | scroll10 | gem10
  const g = C.GACHA;
  const count = type === 'scroll1' ? 1 : 10;
  let costOk = false;
  if (type === 'scroll1') {
    if (state.res.scroll >= 1) { state.res.scroll -= 1; costOk = true; }
  } else if (type === 'scroll10') {
    if (state.res.scroll >= 10) { state.res.scroll -= 10; costOk = true; }
  } else {
    if (state.res.gem >= g.costTenGold) { state.res.gem -= g.costTenGold; costOk = true; }
  }
  if (!costOk) return { ok: false, msg: '招募令/元宝不足' };

  const results = [];
  for (let i = 0; i < count; i++) {
    state.summon.total += 1;
    const rarity = rollRarity();
    const id = pickHeroOfRarity(rarity);
    const received = addHeroCard(id);

function winCampaign(stageIdx) {

  const reward = { gold: 0, gem: 0, scroll: 0, armory: null, armoryBox: null, chest: null };
  if (first) {
    state.campaign.cleared = stageIdx;
    reward.gem = 30;

    reward.gold += Math.floor(1400 * Math.pow(1.05, stageIdx)); // 旧兵书奖励并入铜钱
    const { isBoss } = require('./stages').chapterOf(stageIdx);
    if (isBoss) {
      reward.scroll = 1;
      reward.chest = { gem: CHAPTER_CHEST.gem, scroll: CHAPTER_CHEST.scroll };
    }
    const milestoneQ = stageIdx === 10 ? 1 : stageIdx === 30 ? 2 : stageIdx === 60 ? 3 : 0;
    if (milestoneQ && !state.armory.claimedMilestones[milestoneQ]) {
      state.armory.claimedMilestones[milestoneQ] = true;
      state.armory.boxes[milestoneQ] = (state.armory.boxes[milestoneQ] || 0) + 1;
      reward.armoryBox = milestoneQ;
    }
    if (Math.random() < 0.65) {
      reward.armory = rollArmoryDrop(stageIdx);

  } else {
    // 重复挑战仍给小额奖励

// 每个对局开始时发ID并冻结等级/关卡；同一结算ID幂等，所有变化一次保存。
function beginBattle(spec) {
  spec = spec || {};
  if (state.battle.pending) {
    return { ok: false, msg: '已有未结束战斗，请先结束或中断' };
  }
  if (spec.mode === 'arena') {
    if (state.arena.attempts <= 0) return { ok: false, msg: '今日演武次数不足' };
    state.arena.attempts -= 1;
  }
  const original = state, backup = JSON.parse(JSON.stringify(state));
  const seq = state.battle.nextSeq++;
  const id = 'b' + seq;
  const mode = spec.mode || 'campaign', index = spec.index || 0;
  const first = mode === 'campaign' ? index === state.campaign.cleared + 1
    : mode === 'tower' ? index === state.tower.best + 1 : false;
  state.battle.pending = {
    id, mode, index,
    referenceLevel: Math.max(1, Math.floor(spec.referenceLevel || state.player.level)),
    levelAtStart: state.player.level, first,
    diff: spec.diff || 1, startedAt: Date.now()
  };
  try { save(); } catch (err) {
    state = original; mergeStateInPlace(original, backup);
    return { ok: false, msg: '战斗未能保存', error: err && err.message };
  }
  return { ok: true, ...state.battle.pending };
}

function interruptBattle(battleId, reason) {
  const pending = state.battle.pending;
  if (!pending || pending.id !== battleId) return { ok: false, msg: '战斗已失效' };
  const original = state, backup = JSON.parse(JSON.stringify(state));
  state.battle.pending = null;
  state.battle.lastSettled = { id: battleId, outcome: 'interrupted', gainedXP: 0, reward: null, reason: reason || 'interrupted' };
  try { save(); return { ok: true, id: battleId }; }
  catch (err) {
    state = original; mergeStateInPlace(original, backup);
    return { ok: false, msg: '中断状态未保存', error: err && err.message };
  }
}

function battleXP(pending, win) {
  if (!win || state.player.level >= C.MAX_LEVEL) return 0;
  const base = C.BATTLE_XP.base + C.BATTLE_XP.perEnemyLevel * pending.referenceLevel;
  if (pending.mode === 'campaign') {
    if (pending.first) return Math.floor(base * C.BATTLE_XP.campaignFirst);
    const rate = Math.max(0.2, Math.min(1, pending.referenceLevel / Math.max(1, pending.levelAtStart)));
    return Math.floor(base * C.BATTLE_XP.campaignRepeat * rate);
  }
  if (pending.mode === 'tower') return pending.first ? Math.floor(base * C.BATTLE_XP.towerFirst) : 0;
  if (pending.mode === 'arena') return Math.floor(base * C.BATTLE_XP.arenaWin);
  if (pending.mode === 'training') return Math.floor(base * C.BATTLE_XP.training);

}

function settleBattle(battleId, outcome) {
  outcome = outcome || {};
  const last = state.battle.lastSettled;
  if (last && last.id === battleId) return { ok: true, alreadySettled: true, ...last.summary };
  const pending = state.battle.pending;
  if (!pending || pending.id !== battleId) return { ok: false, msg: '战斗已失效，未发放奖励' };

  const original = state, backup = JSON.parse(JSON.stringify(state));
  state = JSON.parse(JSON.stringify(state));
  try {
    checkDailyReset();
    const win = outcome.win === true;
    let reward = null;
    if (pending.mode === 'campaign') {
      if (win) {
        reward = winCampaign(pending.index);
        if (pending.index === 1 && !state.heroProgress.firstWinChoiceGranted && !state.heroProgress.firstWinChoicePending) state.heroProgress.firstWinChoicePending = true;
        if (pending.index >= 10 && !state.heroProgress.chapterOneVoucherGranted) {
          state.vouchers.sr += 1; state.heroProgress.chapterOneVoucherGranted = true;
        }
      }
    } else if (pending.mode === 'tower') {
      if (win) reward = winTower(pending.index);
    } else if (pending.mode === 'arena') {
      reward = arenaFight(win, pending.diff, true);
    }
    if (win) { bumpQuest('q_battle1', 1); bumpQuest('q_win3', 1); }
    if (pending.mode === 'tower') bumpQuest('q_tower1', 1);
    const xp = battleXP(pending, win);
    const level = addPlayerXP(xp);
    state.battle.pending = null;
    const summary = {
      id: battleId, mode: pending.mode, outcome: win ? 'win' : 'loss',
      levelBefore: level.before, levelAfter: level.after, gainedXP: level.gained,
      playerExp: level.exp, needXP: level.need, reward, firstWinChoicePending: state.heroProgress.firstWinChoicePending

    const committed = state;
    state = original;
    mergeStateInPlace(original, committed);
    save();
    return { ok: true, alreadySettled: false, ...summary };

    state = original;
    mergeStateInPlace(original, backup);
    return { ok: false, msg: '结算未保存，请重试', error: err && err.message };
  }
}

function mergeStateInPlace(target, source) {
  Object.keys(target).forEach(k => { if (!(k in source)) delete target[k]; });
  Object.keys(source).forEach(k => {
    const a = target[k], b = source[k];
    if (Array.isArray(b)) target[k] = b.slice();
    else if (b && typeof b === 'object') {
      if (!a || typeof a !== 'object' || Array.isArray(a)) target[k] = {};
      mergeStateInPlace(target[k], b);
    } else target[k] = b;
  });
}

function bumpQuest(qid, n) {

    if ((state.daily.quests[qid] || 0) < q.target) return { ok: false, msg: '任务未完成' };
    if (state.daily.claimed.indexOf(qid) >= 0) return { ok: false, msg: '已领取' };
    state.daily.claimed.push(qid); applyReward(q.reward);

}

  });
  return pts;
}
function claimActiveChest(idx) {
  return withSavedMutation(() => {
    const chest = IT.ACTIVE_CHESTS[idx];
    if (!chest) return { ok: false };
    if (state.daily.active.indexOf(idx) >= 0) return { ok: false, msg: '已领取' };
    if (activePoints() < chest.need) return { ok: false, msg: '活跃度不足' };
    state.daily.active.push(idx); applyReward(chest.reward);
    return { ok: true, reward: chest.reward };
  });
}

function claimDailyRewards(includeIdle) {
  const original = state, backup = JSON.parse(JSON.stringify(state));
  state = JSON.parse(JSON.stringify(state));
  const before = Object.assign({}, state.res);
  const claimedQuestIds = [], claimedChestIds = [];
  try {

    IT.QUESTS.forEach(q => {
      if ((state.daily.quests[q.id] || 0) >= q.target && state.daily.claimed.indexOf(q.id) < 0) {
        state.daily.claimed.push(q.id); applyReward(q.reward); claimedQuestIds.push(q.id);
      }
    });
    IT.ACTIVE_CHESTS.forEach((chest, idx) => {
      if (activePoints() >= chest.need && state.daily.active.indexOf(idx) < 0) {
        state.daily.active.push(idx); applyReward(chest.reward); claimedChestIds.push(idx);
      }
    });
    const rewards = {};
    Object.keys(state.res).forEach(k => { const delta = (state.res[k] || 0) - (before[k] || 0); if (delta) rewards[k] = delta; });
    const changed = !!(idle.changed || claimedQuestIds.length || claimedChestIds.length);
    if (changed) save();
    const committed = state; state = original; mergeStateInPlace(original, committed);
    return { ok: true, changed, rewards, idle, claimedQuestIds, claimedChestIds };
  } catch (err) {

  }

  if (r.exp) state.res.gold += Math.floor(r.exp);

  if (r.token) state.res.token += r.token;
  if (r.shard) state.res.shard += r.shard;

// 全局关卡序号（1 起）→ 剧情配置；超出本表（>120 关）返回 null，调用方走循环乱世兜底
function getStoryStage(globalStage) {
  if (globalStage < 1 || globalStage > CHAPTERS.length * 10) return null;
  const chIdx = Math.floor((globalStage - 1) / 10);
  const inCh = (globalStage - 1) % 10;
  const ch = CHAPTERS[chIdx];
  return { ch, chIdx, inCh, stage: ch.stages[inCh], isBoss: inCh === 9 };
}

function getStoryChapter(chIdx) {
  return CHAPTERS[chIdx] || null;
}

module.exports = { CHAPTERS, getStoryStage, getStoryChapter };
