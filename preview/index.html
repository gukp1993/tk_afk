<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>预览 · 主城</title>
<link rel="stylesheet" href="assets.css">
<link rel="stylesheet" href="pages.css">
<style>
  body { margin: 0; background: #0d0906; display: flex; justify-content: center; }
  .phone { width: 375px; min-height: 812px; background: var(--bg); position: relative; overflow: hidden; }
  .fakebar { display: flex; background: linear-gradient(180deg, #241a10, #171009); border-top: 1px solid #5a452a; position: absolute; bottom: 0; left: 0; right: 0; }
  .fakebar .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 7px 0 5px; color: #a6906c; }
  .fakebar .tab-item.active { color: #e9c47a; }
  .fakebar .tab-icon { font-size: 20px; }
  .fakebar .tab-text { font-size: 11px; margin-top: 2px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="phone">
  <div class="page">
    <div class="res-bar">
      <div class="res-chip">🪙 <span id="r-gold">6万</span></div>
      <div class="res-chip">💵 <span id="r-gem">1888</span></div>
      <div class="res-chip">📜 <span id="r-scroll">12</span></div>
      <div class="res-chip">📕 <span id="r-exp">4万</span></div>
    </div>

    <div class="campaign panel panel-ornate">
      <div class="camp-head">
        <div>
          <div class="camp-chapter">第一章 · 黄巾之乱</div>
          <div class="camp-stage t-dim">第 1 关</div>
        </div>
        <div class="camp-power">
          <div class="pw-row"><span class="t-dim">我军 </span><span class="t-gold" id="pw-me">—</span></div>
          <div class="pw-row"><span class="t-dim">敌军 </span><span class="t-red" id="pw-foe">—</span></div>
        </div>
      </div>
      <div class="camp-foes">
        <span class="t-dim">守军：</span><span class="camp-foe">华雄</span><span class="camp-foe">颜良</span><span class="camp-foe">廖化</span><span class="camp-foe">张角</span><span class="camp-foe">华佗</span>
      </div>
      <div class="btn btn-red camp-btn">⚔ 出 征</div>
    </div>

    <div class="idle panel">
      <div class="idle-head">
        <div class="h-title">挂机收益</div>
        <div class="t-dim idle-time">累计 2 小时 36 分钟</div>
      </div>
      <div class="idle-loot">
        <div class="loot">🪙 <span class="t-gold">1.2万</span></div>
        <div class="loot">📕 <span class="t-gold">8236</span></div>
        <div class="loot">📜 <span class="t-gold">0</span></div>
      </div>
      <div class="idle-btns">
        <div class="btn btn-gold">一键领取</div>
        <div class="btn btn-ghost">快速收获 +2h (50元宝) 0/6</div>
      </div>
    </div>

    <div class="entries">
      <div class="entry panel"><span class="entry-icon">🎖</span><span>编队</span></div>
      <div class="entry panel"><span class="entry-icon">📋</span><span>任务</span></div>
      <div class="entry panel"><span class="entry-icon">🗼</span><span>群英塔</span></div>
      <div class="entry panel"><span class="entry-icon">🏟</span><span>演武场</span></div>
    </div>

    <div class="section-title">出战阵容</div>
    <div class="quick-team" id="qteam"></div>
  </div>

  <div class="fakebar">
    <div class="tab-item active"><div class="tab-icon">🏯</div><div class="tab-text">主城</div></div>
    <div class="tab-item"><div class="tab-icon">⚔</div><div class="tab-text">群英</div></div>
    <div class="tab-item"><div class="tab-icon">📜</div><div class="tab-text">点将</div></div>
    <div class="tab-item"><div class="tab-icon">🏛</div><div class="tab-text">王庭</div></div>
  </div>
</div>

<script src="engine.js"></script>
<script>
const store = _req('store');
store.load();
const F = _req('fmt');
const s = store.getState();
document.getElementById('r-gold').textContent = F.fmtNum(s.res.gold);
document.getElementById('r-gem').textContent = s.res.gem;
document.getElementById('r-scroll').textContent = s.res.scroll;
document.getElementById('r-exp').textContent = F.fmtNum(s.res.exp);
document.getElementById('pw-me').textContent = F.fmtNum(store.teamPower());
const stages = _req('stages');
const heroes = _req('heroes');
const enemy = stages.makeStageEnemies(1);
document.getElementById('pw-foe').textContent = F.fmtNum(Math.floor(enemy.units.reduce((a, u) => a + heroes.heroPower(u.hero, u.level, u.star) * u.scale, 0)));
// 出战阵容
const qt = document.getElementById('qteam');
store.getFormationCalc().forEach(c => {
  const d = document.createElement('div');
  d.className = 'qt-slot';
  if (c) {
    d.innerHTML = '<div class="qt-face bg-' + c.faction + ' rarity-frame-' + c.rarity + '"><span>' + c.name[0] + '</span></div><div class="qt-name t-dim">' + c.name + '</div>';
  } else {
    d.innerHTML = '<div class="qt-face qt-empty"><span>+</span></div><div class="qt-name t-dim">空</div>';
  }
  qt.appendChild(d);
});
</script>
</body>
</html>
