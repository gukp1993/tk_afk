<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>挂机定三国 · 首期主线养成交互原型</title>
  <style>
    :root{color-scheme:dark;--ink:#19231f;--deep:#111c18;--green:#355d4e;--line:#8a774f;--gold:#d3a349;--paper:#e2d5ac;--light:#f9ecc8;--muted:#aab097;--red:#8c412b}
    *{box-sizing:border-box}body{margin:0;background:#292b29;color:var(--light);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    button,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.44;cursor:not-allowed}
    .workspace{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:34px;padding:18px}
    .phone{width:390px;height:844px;max-height:calc(100vh - 36px);border:7px solid #101816;border-radius:33px;background:var(--deep);box-shadow:0 24px 48px #0007;overflow:hidden;flex:none}
    #app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .top{padding:13px 15px 10px;background:#253a31;border-bottom:1px solid var(--line)}
    .topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
    .brand{font-size:18px;font-weight:800;color:var(--gold);letter-spacing:2px}
    .resources{display:flex;gap:7px;margin-top:10px}.pill{border:1px solid #86754e;background:#1b2c25;border-radius:15px;padding:6px 9px;font-size:12px;flex:1;text-align:center;white-space:nowrap}
    main{flex:1;overflow:auto;padding:14px 15px 24px;background:linear-gradient(145deg,#22392f 0%,#172822 51%,#201d17 100%)}
    .title{font-size:22px;color:var(--gold);font-weight:800;margin:1px 0 5px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:13px}
    .card{border:1px solid #806f4b;border-radius:12px;background:linear-gradient(150deg,#304638,#243129);padding:13px;margin-bottom:11px;box-shadow:0 3px 12px #0003}
    .paper{background:#e0d3ac;color:#29372e;border-color:#c6ad6e}.paper .muted{color:#5c6255}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row>*{min-width:0}
    .small{font-size:12px}.muted{color:var(--muted)}.gold{color:var(--gold)}.strong{font-weight:800}
    .progress{height:10px;background:#11231c;border:1px solid #89754e;border-radius:10px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,#8d6c32,#e3bd65);transition:width .2s linear}
    .chip{display:inline-block;border:1px solid #a5854b;background:#22372c;border-radius:20px;padding:4px 8px;font-size:11px;color:#efd79f;margin:4px 4px 0 0}
    .btn{background:var(--gold);color:#302719;border:1px solid #efca7e;border-radius:9px;padding:11px 12px;font-size:13px;font-weight:800;min-height:42px}
    .btn.secondary{background:#355d4e;color:var(--light);border-color:#75997a}.btn.dark{background:#322b22;color:var(--light);border-color:#75603e}
    .buttons{display:flex;gap:8px;margin-top:11px}.buttons .btn{flex:1}.full{width:100%;margin-top:10px}
    .stage-track{border-radius:12px;background:linear-gradient(130deg,#738a73,#a4aa83 52%,#667f72);padding:20px 12px;min-height:212px;position:relative;overflow:hidden}
    .stage-track:before{content:"";position:absolute;left:0;top:43%;width:110%;height:52px;border:7px solid #d6c58c;border-radius:50%;transform:rotate(-17deg);opacity:.8}
    .flags{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:173px;gap:4px}.flag{background:#243f35;color:#f6e2a8;border:2px solid #a1844d;border-radius:10px;padding:10px 5px;text-align:center;min-width:53px;box-shadow:0 5px 8px #0005}.flag:nth-child(2){align-self:center}.flag:nth-child(3){align-self:flex-start}.flag.current{background:#8c412b;border-color:#f1c76b}.flag.locked{opacity:.6}
    .task{display:flex;align-items:center;gap:12px;padding:12px 10px;border:1px solid #786746;border-radius:9px;background:#2c382d;margin:7px 0}.task .seal{height:36px;width:36px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);flex:none}.task .body{flex:1}.task .name{font-weight:700;font-size:14px}.task .reward{font-size:11px;color:var(--muted);margin-top:4px}.task .status{font-size:12px;color:var(--gold);white-space:nowrap}
    .reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.reward-box{border:1px solid #ae925a;border-radius:9px;background:#263a2e;padding:10px 5px;text-align:center;font-size:12px}.reward-box b{display:block;color:var(--gold);font-size:18px;margin-bottom:4px}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);background:#091f1b;border-top:2px solid var(--gold);height:67px;flex:none}.nav button{background:transparent;color:#b4a985;font-size:13px;line-height:1.4}.nav button.active{background:#3c3927;color:var(--gold);font-weight:800}.nav span{font-size:18px;display:block}
    .overlay{position:absolute;inset:0;background:#000b;display:grid;place-items:center;padding:22px;z-index:3}.modal{width:100%;background:#27231c;border:2px solid #b68e49;border-radius:14px;padding:19px;color:var(--light)}.modal h2{margin:0 0 9px;color:var(--gold);font-size:21px}.modal p{font-size:13px;line-height:1.65;margin:8px 0}.modal .list{border-radius:8px;background:#183027;padding:10px 12px;margin:13px 0;font-size:13px;line-height:1.9}
    .ad{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;background:linear-gradient(160deg,#315e4a,#17251e 62%,#2b2419)}.ad .icon{font-size:82px;color:var(--gold);border:2px solid #a28854;border-radius:18px;width:160px;height:144px;display:grid;place-items:center;margin-bottom:24px}.ad .progress{width:100%;height:17px;margin:20px 0 8px}.ad .buttons{width:100%;margin-top:28px}
    .side{width:280px;color:#e7e5d7;line-height:1.7;font-size:14px}.side h1{font-size:22px;color:#f2c36b}.side code{color:#efcb86}.side button{width:100%;margin-top:12px}.side ol{padding-left:18px}
    .toast{position:absolute;left:24px;right:24px;bottom:76px;background:#0b1914ec;border:1px solid var(--gold);border-radius:8px;text-align:center;padding:9px;z-index:4;font-size:12px}
    @media(max-width:760px){.workspace{padding:0;display:block}.phone{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}.side{display:none}}
  </style>
</head>
<body>
<div class="workspace">
  <div class="phone"><div id="app" aria-live="polite"></div></div>
  <aside class="side"><h1>首期 30 天交互原型</h1><p>无美术资源，仅用当前 Cocos 的墨绿、纸色与鎏金视觉令牌表达交互结构。尺寸按手机 <code>390×844</code> 设计。</p><ol><li>在战役页切换第 40、90、100、110、120 关，查看首通预览。</li><li>点“模拟胜利”查看结算与里程碑奖励。</li><li>日常页补满第三场胜利并一键领取。</li><li>挂机页体验完整与提前关闭的模拟广告。</li></ol><p>所有余额均为演示数据，不连接真实存档。进度条是测试广告，3 秒完成后才可领奖。</p><button class="btn secondary" data-action="reset">重置原型状态</button></aside>
</div>
<script>
(() => {
  const app=document.getElementById('app');
  const initial=()=>({page:'campaign',stage:40,day:7,wins:2,idleClaimed:false,dailyClaimed:false,gemToday:1000,pendingGem:2000,fastUsed:0,modal:false,lastCleared:0,toast:'',adStarted:0,adDone:false,adProgress:0});
  let s=initial(),timer=null;
  const milestone={10:'SR 武将自选券 ×1 · R 军械自选箱 ×1',30:'SR 军械自选箱 ×1',40:'SSR 武将自选券 ×1',60:'SSR 军械自选箱 ×1',90:'SSR 军械自选箱 ×1',100:'SSR 武将自选券 ×1',110:'SSR 军械自选箱 ×1',120:'招募令 ×10 · 第一期主线完成'};
  const fmt=n=>Number(n).toLocaleString('zh-CN');
  const boss=n=>n%10===0;
  const chapter=n=>Math.ceil(Math.min(n,120)/10);
  const dailyReady=()=>s.idleClaimed&&s.wins>=3;
  function notify(msg){s.toast=msg;render();setTimeout(()=>{if(s.toast===msg){s.toast='';render()}},2400)}
  function header(){return `<header class="top"><div class="topline"><div class="brand">汉 · 挂机定三国</div><div>演示第 ${s.day} 天</div></div><div class="resources"><div class="pill">◈ 元宝 ${fmt(1888+s.gemToday)}</div><div class="pill">◇ 招募令 12</div><div class="pill">▣ 精铁 300</div></div></header>`}
  function nav(){const labels=[['campaign','战役','战'],['daily','日常','令'],['result','首通','奖'],['idle','挂机','收']];return `<nav class="nav">${labels.map(([p,label,glyph])=>`<button data-action="page" data-page="${p}" class="${s.page===p?'active':''}"><span>${glyph}</span>${label}</button>`).join('')}</nav>`}
  function campaign(){const n=s.stage;return `<main><div class="title">${n>120?'循环乱世 · 后续挑战':`第 ${chapter(n)} 章 · 主线征途`}</div><div class="sub">${n>120?'第一期已完成 120/120 关 · 后续关卡继续开放':`第一期进度 ${Math.min(n-1,120)}/120 关 · 目标约第 30 天通关`}</div><div class="card"><div class="row"><b>第一期主线</b><span class="gold">${Math.min(n-1,120)} / 120</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,(n-1)/120*100)}%"></div></div><span class="small muted">第 40 关自选武将 · 第 90 关自选军械 · 第 120 关完成</span></div><div class="stage-track"><div class="flags"><div class="flag">${n-2}<br>已通关</div><div class="flag">${n-1}<br>已通关</div><div class="flag current">${n}<br>${boss(n)?'名将关':'当前'}</div><div class="flag locked">${n+1}<br>未开放</div></div></div><div class="card paper" style="margin-top:12px"><div class="row"><b>当前第 ${n} 关</b><span>首通元宝 ${boss(n)?130:30}</span></div><div class="small muted" style="margin-top:6px">${milestone[n]?'里程碑：'+milestone[n]:'通关后继续获得挂机与战斗成长'}</div><div class="buttons"><button class="btn dark" data-action="preview">首通预览</button><button class="btn secondary" data-action="preview">继续出征</button></div></div><div class="card"><div class="row"><b>今日三件事</b><span class="small gold">${(s.idleClaimed?1:0)+(s.wins>=3?2:s.wins>=1?1:0)}/3</span></div><div class="small muted" style="margin-top:7px">领取挂机 · 赢 3 场 · 一键领奖</div><div class="buttons"><button class="btn secondary" data-action="page" data-page="idle">挂机收获</button><button class="btn dark" data-action="page" data-page="daily">去做日常</button></div></div><div class="card"><label class="small muted" for="stageSelect">原型审查：快速切换奖励节点</label><select id="stageSelect" data-action="stage" style="width:100%;margin-top:7px;padding:8px;background:#183027;color:#f9ecc8;border:1px solid #987944;border-radius:7px">${[10,40,60,90,100,110,120].map(x=>`<option value="${x}" ${x===n?'selected':''}>第 ${x} 关</option>`).join('')}</select></div></main>`}
  function daily(){const tasks=[['收','领取挂机收益 1 次','铜钱 ×10,000 · 活跃 +30',s.idleClaimed],['战','任意战斗胜利 1 次','铜钱 ×20,000 · 活跃 +30',s.wins>=1],['征','任意战斗胜利 3 次','精铁 ×80 · 元宝 ×20 · 活跃 +40',s.wins>=3]],active=(s.idleClaimed?30:0)+(s.wins>=1?30:0)+(s.wins>=3?40:0);return `<main><div class="title">每日任务</div><div class="sub">每天只需领挂机、打赢三场；不看广告也能领满基础奖励。</div><div class="card"><div class="row"><b>今日活跃</b><b class="gold">${active}/100</b></div><div class="progress"><div class="fill" style="width:${active}%"></div></div>${tasks.map(([seal,name,reward,done])=>`<div class="task"><div class="seal">${seal}</div><div class="body"><div class="name">${name}</div><div class="reward">${reward}</div></div><div class="status">${done?'已完成':'进行中'}</div></div>`).join('')}<div class="buttons"><button class="btn secondary" data-action="win">模拟胜利 +1</button><button class="btn dark" data-action="page" data-page="idle">领挂机</button></div></div><div class="card"><div class="row"><b>活跃宝箱</b><span class="small muted">自动合并领取</span></div><div class="reward-grid" style="margin-top:10px"><div class="reward-box"><b>40</b>元宝 ×30</div><div class="reward-box"><b>70</b>招募令 ×2</div><div class="reward-box"><b>100</b>碎片 ×30</div></div><button class="btn full" data-action="claimDaily" ${!dailyReady()||s.dailyClaimed?'disabled':''}>${s.dailyClaimed?'今日已领取':dailyReady()?'领取全部日常':'完成三件事后领取'}</button></div><div class="small muted">更多任务：点将／群英塔／演武场为可选项，不卡 100 活跃。</div></main>`}
  function result(){const n=s.lastCleared||40;return `<main><div class="title">${s.lastCleared?'凯旋 · 首次通关':'首通结算示例'}</div><div class="sub">第 ${n} 关 · 第 ${chapter(n)} 章${boss(n)?'名将关':''}</div><div class="card" style="text-align:center;padding:22px 13px"><div style="font-size:66px;color:#d3a349">胜</div><div class="gold strong" style="font-size:20px">第 ${n} 关首通</div><div class="small muted" style="margin-top:8px">确定奖励已到账 · 重打不会再次领取</div></div><div class="card"><b>基础奖励</b><div class="reward-grid" style="margin-top:11px"><div class="reward-box"><b>${boss(n)?130:30}</b>元宝</div><div class="reward-box"><b>${fmt(3000+150*n)}</b>铜钱</div><div class="reward-box"><b>${boss(n)?2:0}</b>招募令</div></div><div class="small muted" style="margin-top:10px">随机军械：65% 概率获得，结果以实际掉落为准</div></div>${milestone[n]?`<div class="card paper"><b>里程碑奖励</b><p style="font-size:15px;margin:9px 0">${milestone[n]}</p><button class="btn secondary full" data-action="milestone">查看奖励去向</button></div>`:''}<div class="buttons"><button class="btn dark" data-action="page" data-page="campaign">返回战役</button><button class="btn secondary" data-action="next">挑战下一关</button></div></main>`}
  function idle(){const canFast=s.fastUsed<3&&s.gemToday<=4000;return `<main><div class="title">挂机收获</div><div class="sub">离线照常累计。元宝每天最多 5 小时；铜钱和精铁自然累计最多 12 小时。</div><div class="card paper"><div class="row"><b>今日挂机元宝</b><b>${fmt(s.gemToday)} / 5,000</b></div><div class="progress"><div class="fill" style="width:${s.gemToday/50}%"></div></div><div class="row small"><span>自然待领：${fmt(Math.min(s.pendingGem,5000-s.gemToday))} 元宝</span><span>00:00 重置</span></div><div class="small muted" style="margin-top:8px">另有铜钱 120,000 · 精铁 300 待领</div><button class="btn full" data-action="claimIdle" ${!s.pendingGem?'disabled':''}>${s.pendingGem?'一键领取挂机收益':'自然收益已领取'}</button></div><div class="card"><div class="row"><b>快速收获 · 模拟广告</b><span class="small gold">剩余 ${3-s.fastUsed}/3 次</span></div><div class="small muted" style="margin-top:8px">完整观看后，立即获得 1 小时收益：元宝 1,000＋精铁 25＋铜钱。元宝计入今天的 5,000 上限；精铁不占自然 12 小时待领。</div><button class="btn secondary full" data-action="startAd" ${!canFast?'disabled':''}>${canFast?'播放 3 秒模拟广告':'今日次数用完或元宝额度不足'}</button></div><div class="card"><b>其他激励入口</b><div class="small muted" style="margin-top:7px">挂机双倍、免费招募令和战败复活也复用同一模拟进度条；提前关闭均不发奖。</div></div></main>`}
  function ad(){return `<div class="ad"><div class="icon">▣</div><div class="title">模拟广告 · 测试模式</div><div class="sub">快速收获：完成后立即获得 1 小时收益</div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(s.adProgress)}"><div id="adFill" class="fill" style="width:${s.adProgress}%"></div></div><div id="adText" class="small gold">播放中… ${Math.max(0,Math.ceil(3-s.adProgress*.03))} 秒 · ${Math.floor(s.adProgress)}%</div><div class="small muted" style="margin-top:16px">提前关闭不扣次数、不发奖励</div><div class="buttons"><button class="btn dark" data-action="closeAd">关闭</button><button class="btn" id="adClaim" data-action="claimAd" ${s.adDone?'':'disabled'}>领取奖励</button></div></div>`}
  function preview(){const n=s.stage;return `<div class="overlay"><div class="modal"><h2>第 ${n} 关 · 首通预览</h2><p>${boss(n)?'名将镇守 · 本关含章末宝箱奖励':'继续出征，胜利后领取首通奖励'}</p><div class="list">确定获得：元宝 ${boss(n)?130:30}<br>铜钱 ${fmt(3000+150*n)}${boss(n)?'<br>招募令 ×2':''}${milestone[n]?'<br><b style="color:#edc277">里程碑：'+milestone[n]+'</b>':''}<br><span class="muted">概率获得：随机军械（65%）</span></div><div class="buttons"><button class="btn dark" data-action="closePreview">返回</button><button class="btn" data-action="winStage">模拟胜利</button></div></div></div>`}
  function render(){app.innerHTML=s.page==='ad'?ad():header()+({campaign,daily,result,idle}[s.page]||campaign)()+nav()+(s.modal?preview():'')+(s.toast?`<div class="toast">${s.toast}</div>`:'')}
  function stopAd(){if(timer){clearInterval(timer);timer=null}}
  function startAd(){if(s.fastUsed>=3||s.gemToday>4000)return;stopAd();s.page='ad';s.adDone=false;s.adProgress=0;s.adStarted=performance.now();render();timer=setInterval(()=>{if(document.hidden){stopAd();s.page='idle';s.adProgress=0;render();return}const p=Math.min(100,(performance.now()-s.adStarted)/30);s.adProgress=p;const fill=document.getElementById('adFill'),label=document.getElementById('adText'),bar=app.querySelector('[role=progressbar]');if(fill)fill.style.width=p+'%';if(label)label.textContent=p<100?`播放中… ${Math.ceil((100-p)*.03)} 秒 · ${Math.floor(p)}%`:'播放完成 · 可领取奖励';if(bar)bar.setAttribute('aria-valuenow',Math.floor(p));if(p>=100){stopAd();s.adDone=true;const claim=document.getElementById('adClaim');if(claim)claim.disabled=false}},50)}
  app.addEventListener('change',e=>{if(e.target.id==='stageSelect'){s.stage=Number(e.target.value);s.lastCleared=0;render()}});
  app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case'page':s.page=b.dataset.page;s.modal=false;render();break;case'preview':s.modal=true;render();break;case'closePreview':s.modal=false;render();break;case'winStage':s.lastCleared=s.stage;s.stage++;s.wins=Math.min(3,s.wins+1);s.modal=false;s.page='result';render();break;case'next':s.page='campaign';render();break;case'win':s.wins=Math.min(3,s.wins+1);render();break;case'claimIdle':if(!s.pendingGem)return;s.gemToday=Math.min(5000,s.gemToday+s.pendingGem);s.pendingGem=0;s.idleClaimed=true;notify('已领取挂机收益；日常“领挂机”已完成');break;case'claimDaily':if(!dailyReady()||s.dailyClaimed)return;s.dailyClaimed=true;notify('日常已领取：精铁80 · 元宝50 · 招募令2');break;case'startAd':startAd();break;case'closeAd':stopAd();s.page='idle';s.adDone=false;s.adProgress=0;render();break;case'claimAd':if(!s.adDone)return;s.adDone=false;s.gemToday=Math.min(5000,s.gemToday+1000);s.fastUsed++;s.page='idle';notify('快速收获：元宝1000 · 精铁25 · 铜钱');break;case'milestone':notify('奖励进入已有自选券／军械箱背包');break;case'reset':stopAd();s=initial();render();break}});
  document.querySelector('.side')?.addEventListener('click',e=>{if(e.target.dataset.action==='reset'){stopAd();s=initial();render()}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&s.page==='ad'){stopAd();s.page='idle';s.adDone=false;s.adProgress=0;render()}});
  render();
})();
</script>
</body>
</html>
