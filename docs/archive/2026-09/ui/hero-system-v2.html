<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>挂机定三国 · 英雄系统 v2 交互原型</title>
<style>
:root{--bg:#111820;--panel:#202a34;--muted:#aab5be;--line:#3a4651;--gold:#e8c47d;--ink:#171b22;--green:#8acbac}*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7abbea;outline-offset:2px}.desk{display:flex;gap:36px;max-width:1000px;margin:30px auto;padding:0 20px}.notes{width:330px;padding-top:16px}.eyebrow{letter-spacing:2px;font-size:12px;color:#766548}.notes h1{font-size:28px;line-height:1.35}.notes p{color:#4b535a}.route{display:flex;gap:8px;flex-wrap:wrap}.route button,.sizes button{border:1px solid #aba69a;background:transparent;padding:9px 12px;border-radius:8px;min-height:44px}.sizes{display:flex;gap:8px;margin:20px 0}.hint{padding:16px;background:#f6f4ef;border-radius:12px}.phone{width:375px;height:812px;flex:none;background:var(--bg);color:#f4f0e7;border:1px solid #49535b;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 18px 60px #25344225;display:flex;flex-direction:column}.safe{height:24px;flex:none;text-align:center;font-size:11px;color:#8393a2;padding-top:4px}.header{padding:8px 16px 12px;border-bottom:1px solid var(--line);flex:none}.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.header h2{font-size:21px;margin:0}.tiny{font-size:12px;color:var(--muted)}.small{font-size:14px;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:12px}.content{padding:16px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.panel h3{font-size:16px;margin:0 0 8px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.button{min-height:44px;border:1px solid #60717c;border-radius:9px;background:#283742;color:#f4f0e7;padding:10px 14px}.primary{background:var(--gold);border-color:var(--gold);color:#1b2026;font-weight:650}.full{width:100%}.ghost{background:transparent}.button:disabled{opacity:.45;cursor:default}.mt{margin-top:12px}.progress{height:7px;border-radius:9px;background:#39434d;overflow:hidden;margin:10px 0 6px}.progress span{display:block;height:100%;background:var(--gold)}.footer{display:flex;flex:none;border-top:1px solid var(--line);background:#18212a;padding:6px 8px 18px;gap:4px}.footer button{flex:1;border:0;color:#b6c0c8;background:none;min-height:48px;border-radius:8px;font-size:14px}.footer button.active{background:#34382f;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;color:#eee;background:#202b36;text-align:left;min-width:0;position:relative}.portrait{height:94px;position:relative;background:#182631;border-top:3px solid var(--rarity,#c9b087)}.portrait img{display:block;width:100%;height:100%;object-fit:contain}.badge{position:absolute;left:5px;top:5px;background:#10161fde;padding:1px 5px;border-radius:4px;font-size:11px}.on{position:absolute;right:5px;bottom:5px;font-size:11px;padding:1px 4px;background:#254b3f;color:#c5eed7}.cardbody{padding:8px}.name{display:block;font-size:15px;white-space:nowrap}.stars{color:var(--gold);font-size:12px;white-space:nowrap}.filters{display:flex;gap:6px;margin:8px 0;overflow-x:auto;padding-bottom:3px}.filters button{flex:none;min-height:44px;min-width:48px;padding:8px 11px;background:var(--panel);color:#c9d0d5;border:1px solid var(--line);border-radius:8px}.filters button.sel{border-color:var(--gold);color:var(--gold)}.filters select{min-height:44px;background:var(--panel);color:#eee;border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0;flex:1}.lead{display:flex;gap:18px;align-items:center}.largeportrait{height:142px;width:110px;border-radius:12px;overflow:hidden;flex:none}.largeportrait img{width:100%;height:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}.stat{text-align:center;border-radius:8px;background:#17212a;padding:10px 2px}.stat b{display:block;font-size:18px}.skill{padding:10px 0;border-top:1px solid var(--line)}.skill b{color:var(--gold)}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slots.back{grid-template-columns:repeat(2,1fr);max-width:228px;margin:12px auto 0}.slot{min-height:112px;border:1px solid #52616b;border-radius:10px;background:#18242d;color:#eee;padding:7px}.slot img{width:58px;height:58px;display:block;margin:auto}.slot.selected{border:2px solid var(--gold);background:#34372d}.result-title{font-size:30px;color:var(--gold);text-align:center;margin:15px 0}.xpbig{font-size:29px;font-weight:700}.reward{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.overlay{position:absolute;inset:0;background:#000a;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#202c36;border:1px solid #697681;border-radius:16px;padding:20px;width:100%;max-height:90%;overflow:auto}.modal h3{margin:0 0 10px}.modal p{color:#bdc8d0}.toast{position:absolute;top:138px;pointer-events:none;left:20px;right:20px;background:#e8c47d;color:#182029;border-radius:10px;padding:12px;text-align:center;z-index:20;font-size:14px}.actionbar{padding:10px 16px;background:#18212a;border-top:1px solid var(--line);flex:none}.empty{padding:40px 12px;text-align:center;color:var(--muted)}.equip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.equip div{padding:12px 2px;border:1px dashed #6d7880;border-radius:8px;text-align:center;font-size:13px}.note{font-size:13px;color:#aab5be;margin:8px 0}.locked{opacity:.55}@media(max-width:800px){.desk{justify-content:center;margin:16px auto;flex-wrap:wrap;gap:20px}.notes{width:375px;padding-top:0}.notes h1{font-size:23px;margin:8px 0}.notes .detailnote{display:none}.phone{max-width:100%}}@media(prefers-reduced-motion:reduce){*{sc </style>
<div class="desk"><aside class="notes"><div class="eyebrow">TK AFK / DESIGN V2</div><h1>一个玩家等级，<br>整支队伍一起成长。</h1><p>交互示意 · 示例数据。此文件是独立设计原型，不连接游戏存档。</p><div class="route"><button data-route="home">主城</button><button data-route="heroes">武将</button><button data-route="detail">详情</button><button data-route="formation">编队</button><button data-route="result">结算</button></div><div class="sizes"><button data-height="812">375 × 812</button><button data-height="667">375 × 667</button></div><div class="hint" id="guide">查看玩家经验、下一关和当前队伍。</div><p class="detailnote">可操作：筛选武将、打开详情、预览并确认升星、取消弹窗、选位置换将、模拟胜利升级、领取自选英雄。刷新恢复示例状态。</p><p class="detailnote">占位图以职业剪影区分功能，阵营用文字与底色，稀有度用文字与边框。未来只替换图片，保留卡片布局。</p></aside><section class="phone" id="phone" aria-label="游戏界面原型"></section></div>
<script>
const colors={N:'#c3cbd0',R:'#7eb9ee',SR:'#c49beb',SSR:'#e7bb6e'};
const factionColor={蜀:'#476858',魏:'#415c7a',吴:'#7a4b48',群:'#695279'};
const heroes=[
{id:'guanyu',name:'关羽',r:'SSR',f:'蜀',role:'战士',job:'单体爆发',star:0,cards:1},
{id:'zhangfei',name:'张飞',r:'SSR',f:'蜀',role:'坦克',job:'前排承伤',star:0,cards:0},
{id:'liubei',name:'刘备',r:'SSR',f:'蜀',role:'辅助',job:'治疗增益',star:0,cards:0},
{id:'liaohua',name:'廖化',r:'N',f:'蜀',role:'战士',job:'近战输出',star:0,cards:2},
{id:'mengda',name:'孟达',r:'N',f:'蜀',role:'射手',job:'后排输出',star:0,cards:0},
{id:'pangtong',name:'庞统',r:'SR',f:'蜀',role:'军师',job:'群体输出',star:0,cards:0},
{id:'zhenji',name:'甄姬',r:'SR',f:'魏',role:'辅助',job:'恢复辅助',star:0,cards:0},
{id:'huatuo',name:'华佗',r:'SR',f:'群',role:'辅助',job:'团队恢复',star:0,cards:0},
{id:'guanping',name:'关平',r:'R',f:'蜀',role:'战士',job:'近战输出',star:0,cards:3},
{id:'zhaoyun',name:'赵云',r:'SSR',f:'蜀',role:'战士',job:'持续输出',star:0,cards:0,locked:true}];
let state={screen:'home',level:16,xp:60,gold:18000,selected:'guanyu',faction:'全部',rarity:'全部',sort:'推荐',formation:['zhangfei','guanyu','liaohua','liubei','mengda'],slot:0,voucher:1,resultClaimed:false,result:null,draft:null,toast:''};
const phone=document.querySelector('#phone');
function face(h){let icon=h.role==='坦克'?'<path d="M31 52L50 44L69 52V72L50 86L31 72Z" fill="#d5ddcf"/>':h.role==='射手'?'<path d="M65 37Q92 62 65 88M65 37V88M53 62H90M84 56L90 62L84 68" fill="none" stroke="#dbd3b4" stroke-width="4"/>':h.role==='军师'?'<path d="M27 62Q50 27 73 62L50 81Z" fill="#d1c9bc"/><path d="M35 58L50 78L44 51M57 50L50 78L66 58" stroke="#687177" fill="none"/>':h.role==='辅助'?'<path d="M69 40V88M60 49H78" stroke="#e6d8a9" stroke-width="5"/><circle cx="69" cy="40" r="8" fill="#a9d9bc"/>':'<path d="M72 26L81 29L61 77L55 74Z" fill="#d5d4bd"/><path d="M49 70L67 79M55 74L48 90" stroke="#e5bf74" stroke-width="5"/>';
let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 105"><rect width="100" height="105" fill="${factionColor[h.f]}"/><circle cx="50" cy="43" r="33" fill="#ffffff09"/><path d="M20 105V78Q22 60 40 59H55Q73 64 76 83V105Z" fill="#19252d"/><ellipse cx="47" cy="37" rx="15" ry="18" fill="#bdbaaa"/><path d="M30 34L36 13L58 13L66 34L47 28Z" fill="#202b33"/><path d="M43 11L48 2L53 11" fill="#d7bf87"/>${icon}</svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function hero(id){return heroes.find(h=>h.id===id)}
function img(h){return `<img src="${face(h)}" alt="${h.role}占位剪影">`}
function card(h,action='detail'){return `<button class="card ${h.locked?'locked':''}" data-${action}="${h.id}" aria-label="${h.name} ${h.r} ${h.role}${h.locked?' 未拥有':''}"><div class="portrait" style="--rarity:${colors[h.r]}">${img(h)}<span class="badge">${h.r} · ${h.f}</span>${state.formation.includes(h.id)?'<span class="on">已上阵</span>':''}</div><div class="cardbody"><b class="name">${h.name}</b><div class="tiny">${h.role} · ${h.locked?'未拥有':'Lv.'+state.level}</div><div class="stars">${h.star?'★'.repeat(h.star):'0 星'}${h.cards?' · 同名卡 '+h.cards:''}</div></div></button>`}
function header(title,sub=''){return `<div class="safe">挂机定三国</div><header class="header"><div class="headrow"><h2>${title}</h2><span class="pill">玩家 Lv.${state.level}</span></div>${sub?`<div class="small" style="margin-top:5px">${sub}</div>`:''}</header>`}
function nav(){return `<nav class="footer">${[['home','主城'],['heroes','武将'],['formation','编队'],['summon','招募']].map(([key,label])=>`<button data-route="${key}" class="${state.screen===key?'active':''}">${label}</button>`).join('')}</nav>`}
function home(){return header('桃园营地','铜钱 '+state.gold.toLocaleString()+'　元宝 1,888')+`<main class="content"><section class="panel"><div class="row between"><h3>玩家等级 ${state.level}</h3><span class="small">所有武将同级</span></div><div class="progress"><span style="width:${state.xp/(100+20*(state.level-1))*100}%"></span></div><div class="row between"><span class="small">经验 ${state.xp} / ${100+20*(state.level-1)}</span><span class="tiny">战斗胜利获得</span></div></section><section class="panel"><span class="tiny">第二章 · 虎牢关</span><h3 style="font-size:23px;margin:8px 0">第 11 关</h3><p class="small">敌方参考等级 17 · 首通经验 +630</p><button class="button primary full" data-fight="campaign">出征</button><div class="row mt"><button class="button full" data-route="formation">调整编队</button><button class="button full" data-practice>练兵</button></div></section><section class="panel"><div class="row between"><h3>当前队伍</h3><button class="button ghost" data-route="formation">更换</button></div><div class="row" style="justify-content:space-between">${state.formation.map(id=>`<div style="width:52px;text-align:center">${img(hero(id))}<span class="tiny">${hero(id).name}</span></div>`).join('')}</div><p class="note">共享 Lv.${state.level} · 换将立即参战</p></section><button class="button full" data-route="heroes">查看武将与同名卡</button></main>`+nav()}
function heroesPage(){let list=heroes.filter(h=>(state.faction==='全部'||h.f===state.faction)&&(state.rarity==='全部'||h.r===state.rarity));if(state.sort==='同名卡')list.sort((a,b)=>b.cards-a.cards);return header('武将',`已拥有 ${heroes.filter(h=>!h.locked).length} / 120 · 全体共享 Lv.${state.level}`)+`<main class="content"><div class="filters">${['全部','蜀','魏','吴','群'].map(f=>`<button class="${state.faction===f?'sel':''}" data-faction="${f}">${f}</button>`).join('')}</div><div class="filters"><select aria-label="稀有度" id="rarity">${['全部','SSR','SR','R','N'].map(r=>`<option ${r===state.rarity?'selected':''}>${r}</option>`).join('')}</select><select aria-label="排序" id="sort">${['推荐','同名卡'].map(r=>`<option ${r===state.sort?'selected':''}>${r}</option>`).join('')}</select><button data-voucher>自选券 ${state.voucher}</button></div><div class="grid mt">${list.map(h=>card(h)).join('')}</div>${list.length?'':'<p class="empty">没有符合条件的武将</p>'}<p class="note">新获得的武将立即共享玩家等级。</p></main>`+nav()}
function detail(){const h=hero(state.selected),max={N:2,R:3,SR:4,SSR:5}[h.r];return header('武将详情',h.locked?'收集后立即共享玩家等级':'全体武将随玩家等级成长')+`<main class="content"><section class="panel"><div class="lead"><div class="portrait largeportrait" style="--rarity:${colors[h.r]}">${img(h)}</div><div><span class="pill">${h.r} · ${h.f}国</span><h2 style="margin:9px 0 4px">${h.name}</h2><div>${h.role} · ${h.job}</div><div class="stars mt">${h.star} / ${max} 星</div><div class="small">共享等级 ${state.level}</div></div></div><div class="stats"><div class="stat"><span class="tiny">生命</span><b>${Math.round(6800*(1+.12*h.star)).toLocaleString()}</b></div><div class="stat"><span class="tiny">攻击</span><b>${Math.round(980*(1+.12*h.star))}</b></div><div class="stat"><span class="tiny">防御</span><b>${Math.round(340*(1+.12*h.star))}</b></div></div></section><section class="panel"><h3>技能与定位</h3><div class="skill"><b>普攻</b><div class="small">持续攻击目标并积攒怒气。</div></div><div class="skill"><b>必杀 · 核心职责</b><div class="small">${h.job}。具体技能文案沿用武将配置。</div></div><div class="skill"><b>被动</b><div class="small">0 星即可发挥核心作用，升星提高属性。</div></div></section><section class="panel"><h3>装备</h3><div class="equip"><div>武器</div><div>护甲</div><div>头盔</div><div>饰品</div></div><p class="note">装备属于该武将，换将时不会自动转移。</p></section><section class="panel"><div class="row between"><h3>同名卡 ${h.cards}</h3><span class="tiny">用于本人升星</span></div><div class="row"><button class="button primary full" data-ascend ${h.locked||h.star>=max?'disabled':''}>${h.star>=max?'已满星':'升星预览'}</button><button class="button full" data-use ${h.locked?'disabled':''}>调整上阵</button></div></section><button class="button full" data-route="heroes">返回武将</button></main>`+nav()}
function formation(){if(!state.draft)state.draft=[...state.formation];return header('编队','前排 3 人 · 后排 2 人 · 点击位置后换将')+`<main class="content"><section class="panel"><div class="tiny" style="text-align:center;margin-bottom:8px">敌方方向 ↑</div><div class="slots">${state.draft.slice(0,3).map((id,i)=>slot(id,i)).join('')}</div><div class="slots back">${state.draft.slice(3).map((id,i)=>slot(id,i+3)).join('')}</div><p class="note">${state.draft.every(id=>hero(id).f==='蜀')?'蜀阵营 5 人 · 加成 18%':'阵营加成按实际人数计算'} · 全体 Lv.${state.level}</p></section><div class="row between"><h3 style="margin:0 0 12px">替换${state.slot<3?'前排':'后排'} ${state.slot<3?state.slot+1:state.slot-2} 号位</h3><span class="tiny">点击已上阵武将将交换位置</span></div><div class="grid">${heroes.filter(h=>!h.locked).map(h=>card(h,'replace')).join('')}</div></main><div class="actionbar"><button class="button primary full" data-saveformation>保存编队</button></div>`+nav()}
function slot(id,i){let h=hero(id);return `<button class="slot ${state.slot===i?'selected':''}" data-slot="${i}">${img(h)}<b>${h.name}</b><div class="tiny">${h.role}</div></button>`}
function result(){const r=state.result||{before:16,after:17,xp:290,need:420};return header('战斗结算','第二章 · 第 11 关')+`<main class="content"><div class="result-title">凯旋</div><section class="panel"><div class="tiny">玩家经验</div><div class="xpbig">+630</div><div class="row between mt"><span>Lv.${r.before} → Lv.${r.after}</span><span class="pill">全体武将同步提升</span></div><div class="progress"><span style="width:${r.xp/r.need*100}%"></span></div><div class="small">新等级经验 ${r.xp} / ${r.need}</div><p class="note">新抽到的武将也会直接成为 ${r.after} 级。</p></section><section class="panel"><h3>首通奖励</h3><div class="reward"><span>铜钱</span><b>+5,815</b></div><div class="reward"><span>元宝</span><b>+30</b></div><p class="note">奖励已入账，返回或关闭不会丢失。</p></section><button class="button primary full" data-next>继续挑战</button><div class="row mt"><button class="button full" data-route="formation">调整编队</button><button class="button full" data-route="home">返回主城</button></div></main>`+nav()}
function summon(){return header('招募','固定概率 · 无保底')+`<main class="content"><section class="panel"><h3>群英招募</h3><p class="small">SSR 2% · SR 10% · R 28% · N 60%</p><p>首次获得永久解锁；再次获得转为同名卡。</p><p class="small">所有新武将直接共享 Lv.${state.level}。</p><button class="button primary full" data-voucher>使用 SSR 自选券 · ${state.voucher} 张</button></section><p class="note">本原型只演示自选流程，随机招募由现有系统保留。</p></main>`+nav()}
const guides={home:'主城突出玩家等级和经验；练兵提供卡关时的升级出口。',heroes:'三列卡片，姓名在图下；阵营一行，稀有度和排序另一行。',detail:'没有个人升级或共鸣按钮。升星先展示收益和消耗。',formation:'点击位置再选人，不依赖拖拽；选到已上阵英雄就交换。',result:'经验在结算时已入账，展示全体武将提升；按钮不负责发奖。',summon:'自选券独立持有，关闭选择弹窗后仍在。'};
function render(){phone.innerHTML=({home,heroes:heroesPage,detail,formation,result,summon}[state.screen]||home)();document.querySelector('#guide').textContent=guides[state.screen];}
function modal(html){let wrap=document.createElement('div');wrap.className='overlay';wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');wrap.innerHTML=`<div class="modal">${html}</div>`;phone.append(wrap);wrap.querySelector('button')?.focus()}
function close(){phone.querySelector('.overlay')?.remove()}
function toast(msg){phone.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;phone.append(t);setTimeout(()=>t.remove(),2200)}
function gainXP(gain){state.xp+=gain;while(state.level<200&&state.xp>=100+20*(state.level-1)){state.xp-=100+20*(state.level-1);state.level++}if(state.level===200)state.xp=0}
function settleDemo(){if(!state.resultClaimed){state.resultClaimed=true;let before=state.level;gainXP(630);state.result={before,after:state.level,xp:state.xp,need:100+20*(state.level-1)};state.gold+=5815}state.screen='result';render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.route){if(b.dataset.route==='result'){settleDemo();return}state.screen=b.dataset.route;render()}
else if(b.dataset.height){phone.style.height=b.dataset.height+'px'}
else if(b.dataset.detail){state.selected=b.dataset.detail;state.screen='detail';render()}
else if(b.dataset.faction){state.faction=b.dataset.faction;render()}
else if(b.hasAttribute('data-ascend')){let h=hero(state.selected),cost=[2000,8000,25000,70000,160000][h.star],copies=[1,1,2,2,3][h.star];modal(`<h3>${h.name} · ${h.star} → ${h.star+1} 星</h3><p>基础属性倍率 ${(1+.12*h.star).toFixed(2)} → ${(1+.12*(h.star+1)).toFixed(2)}<br>等级保持 ${state.level}，不消耗其他武将。</p><div class="reward"><span>同名卡</span><b>${h.cards} / ${copies}</b></div><div class="reward"><span>铜钱</span><b>${state.gold.toLocaleString()} / ${cost.toLocaleString()}</b></div><div class="row mt"><button class="button full" data-close>取消</button><button class="button primary full" data-confirmstar ${h.cards<copies||state.gold<cost?'disabled':''}>确认升星</button></div>${h.cards<copies?'<p class="note">同名卡不足，可通过招募或自选获得。</p>':''}`)}
else if(b.hasAttribute('data-confirmstar')){let h=hero(state.selected),cost=[2000,8000,25000,70000,160000][h.star],copies=[1,1,2,2,3][h.star];if(!cost||h.cards<copies||state.gold<cost)return;h.cards-=copies;state.gold-=cost;h.star++;render();toast('升星成功，等级保持不变')}
else if(b.hasAttribute('data-close'))close();
else if(b.hasAttribute('data-use')){state.screen='formation';render();toast('选择位置，再点击要上阵的武将')}
else if(b.dataset.slot!==undefined){state.slot=Number(b.dataset.slot);render()}
else if(b.dataset.replace){let index=state.draft.indexOf(b.dataset.replace),old=state.draft[state.slot];if(index>=0)state.draft[index]=old;state.draft[state.slot]=b.dataset.replace;render();toast('已调整，点击保存编队确认')}
else if(b.hasAttribute('data-saveformation')){state.formation=[...state.draft];render();toast('编队已保存（示例）')}
else if(b.hasAttribute('data-practice'))modal('<h3>练兵</h3><p>挑战较弱的练兵队，胜利获得少量玩家经验。无次数限制，不产出铜钱和装备。</p><div class="row"><button class="button full" data-close>返回</button><button class="button primary full" data-training>模拟胜利</button></div>');
else if(b.hasAttribute('data-training')){let d=Math.max(1,state.level-2),gain=Math.floor(.6*(40+10*d));gainXP(gain);close();render();toast('练兵胜利，玩家经验 +'+gain)}
else if(b.dataset.fight)settleDemo();
else if(b.hasAttribute('data-next'))toast('实际游戏此处进入下一关；原型只演示单次结算');
else if(b.hasAttribute('data-voucher')){if(!state.voucher){toast('暂无自选券');return}modal('<h3>SSR 自选券</h3><p>选定后消耗 1 张券。关闭后可继续选择。</p><div class="grid">'+heroes.filter(h=>h.r==='SSR').map(h=>card(h,'choose')).join('')+'</div><button class="button full mt" data-close>稍后选择</button>')}
else if(b.dataset.choose){let h=hero(b.dataset.choose);close();modal(`<h3>确认选择${h.name}？</h3><p>${h.locked?'永久解锁，共享 Lv.'+state.level:'已拥有，获得 1 张同名卡'}。</p><div class="row"><button class="button full" data-close>取消</button><button class="button primary full" data-confirmchoose="${h.id}">确认选择</button></div>`)}
else if(b.dataset.confirmchoose){if(state.voucher<1)return;let h=hero(b.dataset.confirmchoose);state.voucher--;if(h.locked)h.locked=false;else h.cards++;state.screen='heroes';render();toast('已获得'+h.name+'，自选券 -1')}
});
document.addEventListener('change',e=>{if(e.target.id==='rarity')state.rarity=e.target.value;if(e.target.id==='sort')state.sort=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></html>
